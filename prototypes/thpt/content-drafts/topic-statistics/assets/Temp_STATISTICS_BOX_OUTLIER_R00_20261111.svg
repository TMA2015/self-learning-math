<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-labelledby="t d">
<title id="t">Biểu đồ hộp cho mẫu có giá trị ngoại lệ 30</title>
<desc id="d">Mẫu dữ liệu đã sắp xếp 1,2,2,4,5,8,30. Q1 bằng 2, trung vị bằng 4, Q3 bằng 8, IQR bằng 6, hàng rào phía trên 17, 30 là ngoại lệ. Râu thấp là 1, râu cao là 8, điểm ngoại lệ 30 được đánh dấu riêng.</desc>
<rect width="780" height="320" fill="#fff" stroke="#64748b" rx="14"/>
<text x="26" y="34" font-family="Arial,sans-serif" font-size="20" fill="#172554">Mẫu: 1, 2, 2, 4, 5, 8, 30</text>
<line x1="80" y1="249" x2="724" y2="249" stroke="#334155" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#0f172a" font-size="16" text-anchor="middle">
<text x="90" y="273">0</text><text x="190" y="273">5</text><text x="290" y="273">10</text><text x="390" y="273">15</text><text x="490" y="273">20</text><text x="590" y="273">25</text><text x="690" y="273">30</text></g>
<g stroke="#94a3b8"><line x1="90" y1="245" x2="90" y2="255"/><line x1="190" y1="245" x2="190" y2="255"/><line x1="290" y1="245" x2="290" y2="255"/><line x1="390" y1="245" x2="390" y2="255"/><line x1="490" y1="245" x2="490" y2="255"/><line x1="590" y1="245" x2="590" y2="255"/><line x1="690" y1="245" x2="690" y2="255"/></g>
<line x1="110" y1="135" x2="130" y2="135" stroke="#0f172a" stroke-width="3"/>
<line x1="250" y1="135" x2="690" y2="135" stroke="#0f172a" stroke-width="2" stroke-dasharray="4 8" opacity=".5"/>
<line x1="250" y1="115" x2="250" y2="155" stroke="#0f172a" stroke-width="3"/>
<line x1="110" y1="115" x2="110" y2="155" stroke="#0f172a" stroke-width="3"/>
<rect x="130" y="102" width="120" height="66" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/>
<line x1="170" y1="102" x2="170" y2="168" stroke="#0c4a6e" stroke-width="4"/>
<circle cx="690" cy="135" r="8" fill="#b91c1c"/>
<g font-family="Arial,sans-serif" font-size="17" fill="#0f172a" text-anchor="middle"><text x="110" y="100">Min=1</text><text x="130" y="194">Q1=2</text><text x="170" y="87">Me=4</text><text x="250" y="194">Q3=8</text><text x="690" y="103">Ngoại lệ 30</text><text x="390" y="62">Hàng rào trên: 17</text></g>
</svg>