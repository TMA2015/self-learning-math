<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
<title id="t">Hai cách cộng vectơ: quy tắc tam giác và quy tắc hình bình hành</title><desc id="d">Bảng trái: vectơ AB rồi BC theo đầu đuôi có tổng AC. Bảng phải: trong hình bình hành ABCD, vectơ AB và AD cùng gốc A có tổng là đường chéo AC.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#173d56"/></marker></defs>
<rect width="1000" height="400" rx="12" fill="#fff"/><g font-family="Arial,sans-serif" fill="#18334a"><text x="25" y="36" font-size="22" font-weight="bold">Cộng vectơ: đúng chiều mũi tên, đúng điểm đầu–cuối</text><text x="45" y="78" font-size="19" font-weight="bold">Quy tắc tam giác</text><text x="520" y="78" font-size="19" font-weight="bold">Quy tắc hình bình hành</text></g>
<rect x="22" y="94" width="456" height="263" rx="10" fill="#f7fafc" stroke="#d9e4ee"/><rect x="505" y="94" width="473" height="263" rx="10" fill="#f7fafc" stroke="#d9e4ee"/>
<g fill="none" stroke-width="4" stroke-linecap="round"><path d="M100 285L275 285" stroke="#1769aa" marker-end="url(#arr)"/><path d="M275 285L275 140" stroke="#17856b" marker-end="url(#arr)"/><path d="M100 285L275 140" stroke="#b45b17" marker-end="url(#arr)"/>
<path d="M555 290L745 290" stroke="#1769aa" marker-end="url(#arr)"/><path d="M555 290L625 155" stroke="#17856b" marker-end="url(#arr)"/><path d="M555 290L815 155" stroke="#b45b17" marker-end="url(#arr)"/><path d="M625 155L815 155L745 290" stroke="#879aa8" stroke-dasharray="8 6" stroke-width="2.5"/></g>
<g font-family="Arial,sans-serif" font-size="18" fill="#18334a"><text x="80" y="310">A</text><text x="284" y="309">B</text><text x="281" y="131">C</text><text x="535" y="317">A</text><text x="749" y="313">B</text><text x="825" y="150">C</text><text x="600" y="146">D</text>
<text x="62" y="382">AB + BC = AC</text><text x="518" y="382">AB + AD = AC (ABCD hình bình hành)</text></g></svg>