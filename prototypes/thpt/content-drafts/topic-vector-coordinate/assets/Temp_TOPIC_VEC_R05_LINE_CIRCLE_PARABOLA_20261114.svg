<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Ba quỹ tích Oxy: đường thẳng, đường tròn và parabol</title><desc id="d">Ba ô phân biệt đường thẳng pháp tuyến, đường tròn tâm I bán kính R, parabol có đỉnh và trục đối xứng. Hình minh họa khái niệm, không phải số đo tỉ lệ chuẩn trên mọi trục.</desc><rect width="1200" height="420" rx="14" fill="#fff"/><text x="24" y="36" fill="#17364b" font-size="24" font-family="Arial" font-weight="bold">Từ điều kiện tọa độ đến hình được xác định</text>
