<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d">
<title id="t">Từ hai tọa độ điểm đến vectơ AB trong Oxy và dấu tích vô hướng</title><desc id="d">A trừ hai ba, B bốn âm một, vectơ AB có độ dời sáu theo Ox và âm bốn theo Oy. Hình bên phải có hai vectơ tạo góc tù nên tích vô hướng âm.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#173d56"/></marker></defs><rect width="1000" height="400" rx="12" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#18334a"><text x="20" y="32" font-size="21" font-weight="bold">Oxy: tọa độ là độ dời, tích vô hướng đọc cùng góc</text><text x="30" y="67" font-size="17" font-weight="bold">A(−2; 3) → B(4; −1)</text><text x="600" y="67" font-size="17" font-weight="bold">Góc tù → tích vô hướng âm</text></g><rect x="16" y="77" width="558" height="298" rx="10" fill="#f7fbff" stroke="#d9e6f1"/><rect x="589" y="77" width="393" height="298" rx="10" fill="#f7fbff" stroke="#d9e6f1"/>
<g fill="none" stroke-linecap="round"><path d="M60 227H545M260 350V94" stroke="#72879a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M180 107H420V267" stroke="#168a71" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M180 107L420 267" stroke="#185fa6" stroke-width="4.5" marker-end="url(#arrow)"/>
<path d="M773 269H924" stroke="#185fa6" stroke-width="4" marker-end="url(#arrow)"/><path d="M773 269L697 150" stroke="#b35c1f" stroke-width="4" marker-end="url(#arrow)"/></g>
<g font-family="Arial,sans-serif" font-size="17" fill="#18334a"><text x="267" y="245">O</text><text x="536" y="247">x</text><text x="270" y="110">y</text><text x="149" y="105">A</text><text x="430" y="287">B</text><text x="270" y="97">Δx=+6</text><text x="432" y="192">Δy=−4</text><text x="764" y="292">O</text><text x="933" y="270">u</text><text x="674" y="142">v</text><text x="643" y="344">u · v = |u||v|cos θ &lt; 0</text><text x="31" y="396">AB = (4−(−2); −1−3) = (6; −4)</text></g></svg>