<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 420" role="img" aria-labelledby="title desc">
<title id="title">So sánh dãy cấp số cộng và cấp số nhân qua năm bước</title>
<desc id="desc">Tại các chỉ số n bằng 1 đến 5, cấp số cộng A có giá trị 4,7,10,13,16; cấp số nhân B có 4,8,16,32,64. Cả hai bắt đầu bằng 4 nhưng B tăng nhanh hơn vì nhân 2 qua mỗi bước, A cộng 3. Các điểm là mẫu rời rạc, không phải đồ thị liên tục.</desc>
<rect width="740" height="420" fill="#ffffff" stroke="#94a3b8"/>
<g stroke="#94a3b8" stroke-width="1.6"><line x1="76" y1="340" x2="660" y2="340"/><line x1="76" y1="340" x2="76" y2="38"/></g>
<g font-family="Arial,sans-serif" font-size="15" fill="#334155"><text x="39" y="46">uₙ</text><text x="668" y="344">n</text><text x="46" y="340">0</text><text x="43" y="270">16</text><text x="43" y="198">32</text><text x="43" y="52">64</text></g>
<g stroke="#cbd5e1" stroke-dasharray="4 5"><line x1="76" y1="268" x2="650" y2="268"/><line x1="76" y1="196" x2="650" y2="196"/><line x1="76" y1="52" x2="650" y2="52"/></g>
<polyline points="130,322 245,308.5 360,295 475,281.5 590,268" fill="none" stroke="#0369a1" stroke-dasharray="6 5" stroke-width="2.5"/>
<polyline points="130,322 245,304 360,268 475,196 590,52" fill="none" stroke="#be123c" stroke-dasharray="6 5" stroke-width="2.5"/>
<g fill="#0369a1"><circle cx="130" cy="322" r="5"/><circle cx="245" cy="308.5" r="5"/><circle cx="360" cy="295" r="5"/><circle cx="475" cy="281.5" r="5"/><circle cx="590" cy="268" r="5"/></g>
<g fill="#be123c"><circle cx="130" cy="322" r="4.5"/><circle cx="245" cy="304" r="5"/><circle cx="360" cy="268" r="5"/><circle cx="475" cy="196" r="5"/><circle cx="590" cy="52" r="5"/></g>
<g font-family="Arial,sans-serif" font-size="16" fill="#0f172a" text-anchor="middle"><text x="130" y="365">1</text><text x="245" y="365">2</text><text x="360" y="365">3</text><text x="475" y="365">4</text><text x="590" y="365">5</text></g>
<g font-family="Arial,sans-serif" font-size="16"><text x="92" y="398" fill="#0369a1">A: uₙ=4+3(n−1)</text><text x="400" y="398" fill="#be123c">B: vₙ=4·2⁽ⁿ⁻¹⁾</text></g>
</svg>