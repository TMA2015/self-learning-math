<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500" role="img" aria-labelledby="t d"><title id="t">Hai phân bố cùng trung bình, phương sai khác nhau</title><desc id="d">Giá trị đại diện các lớp là 10,20,30,40,50. Mẫu A có tần số 1,2,8,2,1; mẫu B là 4,2,2,2,4. Trung bình cùng bằng 30 nhưng mẫu B có nhiều dữ liệu xa tâm hơn.</desc><rect width="1100" height="500" rx="22" fill="#f6f9fb"/><text x="35" y="56" font-family="DejaVu Sans" font-size="30" fill="#152c45">Bài 10 · Cùng trung bình, độ trải khác nhau</text><text x="42" y="93" font-family="DejaVu Sans" font-size="21" fill="#40556b">Giá trị đại diện: 10, 20, 30, 40, 50; cả hai mẫu có x̄ = 30</text><line x1="130" y1="397" x2="945" y2="397" stroke="#8493a4" stroke-width="3"/><g font-family="DejaVu Sans" font-size="20" text-anchor="middle"><text x="205" y="431">10</text><text x="365" y="431">20</text><text x="525" y="431">30</text><text x="685" y="431">40</text><text x="845" y="431">50</text></g><g fill="#3789b8"><rect x="180" y="375" width="29" height="22"/><rect x="340" y="352" width="29" height="45"/><rect x="500" y="212" width="29" height="185"/><rect x="660" y="352" width="29" height="45"/><rect x="820" y="375" width="29" height="22"/></g><g fill="#cf8259"><rect x="215" y="304" width="29" height="93"/><rect x="375" y="352" width="29" height="45"/><rect x="535" y="352" width="29" height="45"/><rect x="695" y="352" width="29" height="45"/><rect x="855" y="304" width="29" height="93"/></g><rect x="60" y="467" width="17" height="17" fill="#3789b8"/><text x="82" y="482" font-family="DejaVu Sans" font-size="18">Mẫu A f=(1,2,8,2,1)</text><rect x="416" y="467" width="17" height="17" fill="#cf8259"/><text x="440" y="482" font-family="DejaVu Sans" font-size="18">Mẫu B f=(4,2,2,2,4)</text><line x1="525" y1="138" x2="525" y2="400" stroke="#263d52" stroke-width="2" stroke-dasharray="8 8"/><text x="536" y="158" font-family="DejaVu Sans" font-size="17" fill="#263d52">x̄=30</text></svg>