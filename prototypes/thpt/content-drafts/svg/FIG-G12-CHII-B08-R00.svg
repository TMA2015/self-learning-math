<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="ttl ds"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17324d"/></marker></defs><title id="ttl">Phân tích vectơ AB thành ba thay đổi</title><desc id="ds">Một mũi tên tím nối A với B, ba mũi tên mảnh đi theo ba hướng minh họa biến thiên x, y, z. Minh họa nguyên tắc tọa độ cuối trừ đầu.</desc><rect width="840" height="520" rx="26" fill="#f6fafb"/><text x="35" y="52" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">Bài 8 · Cuối trừ đầu, rồi tính độ dài</text><g stroke-width="5" fill="none"><path d="M125 360L300 360" stroke="#d64949" marker-end="url(#arr)"/><path d="M300 360L400 300" stroke="#1877b8" marker-end="url(#arr)"/><path d="M400 300L400 135" stroke="#15926f" marker-end="url(#arr)"/><path d="M125 360L400 135" stroke="#854aa6" stroke-width="7" marker-end="url(#arr)"/></g><g font-family="Arial" font-size="23" fill="#17324d"><text x="104" y="390">A</text><text x="414" y="135">B</text><text x="184" y="390" fill="#c14242">Δx</text><text x="340" y="345" fill="#1877b8">Δy</text><text x="414" y="228" fill="#15926f">Δz</text><text x="205" y="203" fill="#854aa6">AB</text></g><text x="492" y="191" font-family="Arial" font-size="23" fill="#17324d">AB = (xB − xA;</text><text x="566" y="225" font-family="Arial" font-size="23" fill="#17324d">yB − yA;</text><text x="566" y="259" font-family="Arial" font-size="23" fill="#17324d">zB − zA)</text><text x="35" y="489" font-family="Arial" font-size="19" fill="#425e70">Sơ đồ ý nghĩa ba thành phần; không phải hình tỷ lệ đo đạc.</text></svg>