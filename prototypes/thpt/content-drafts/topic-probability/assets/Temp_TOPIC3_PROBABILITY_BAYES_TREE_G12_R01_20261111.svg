<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">Sơ đồ cây xác suất hai hộp dùng cho công thức toàn phần và Bayes</title>
<desc id="desc">Chọn hộp X xác suất 1/3 hoặc Y xác suất 2/3. Nếu X thì đỏ 2/5, xanh 3/5; nếu Y thì đỏ 3/4, xanh 1/4. Bốn nhánh đầy đủ lần lượt có xác suất 2/15, 1/5, 1/2 và 1/6. Xác suất đỏ là 19/30; xác suất chọn hộp Y khi thấy đỏ là 15/19.</desc>
<rect width="920" height="440" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="22" y="33" fill="#0f172a" font-family="Arial,sans-serif" font-size="19" font-weight="bold">Đọc mỗi nhánh: nhân xác suất; gom các nhánh dẫn tới cùng kết quả: cộng</text>
<g stroke="#334155" stroke-width="3" fill="none">
<path d="M140 222L341 115 M140 222L341 329"/>
<path d="M397 115L694 75 M397 115L694 161"/>
<path d="M397 329L694 285 M397 329L694 375"/>
</g>
<g font-family="Arial,sans-serif" font-size="19" fill="#0f172a" text-anchor="middle">
<text x="90" y="211" font-weight="bold">Bắt đầu</text>
<text x="370" y="119" font-weight="bold">Hộp X</text>
<text x="370" y="334" font-weight="bold">Hộp Y</text>
<text x="745" y="80" fill="#b91c1c" font-weight="bold">Đỏ</text>
<text x="745" y="165" fill="#0369a1" font-weight="bold">Xanh</text>
<text x="745" y="290" fill="#b91c1c" font-weight="bold">Đỏ</text>
<text x="745" y="380" fill="#0369a1" font-weight="bold">Xanh</text>
<text x="242" y="138">1/3</text><text x="242" y="318">2/3</text>
<text x="562" y="75">2/5</text><text x="564" y="155">3/5</text>
<text x="562" y="275">3/4</text><text x="564" y="382">1/4</text>
</g>
<g font-family="Arial,sans-serif" font-size="17" fill="#334155">
<text x="796" y="80">2/15</text>
