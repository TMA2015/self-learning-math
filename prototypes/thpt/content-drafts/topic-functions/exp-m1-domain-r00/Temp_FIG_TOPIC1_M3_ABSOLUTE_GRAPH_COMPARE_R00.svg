<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
<title id="title">So sánh đồ thị trị tuyệt đối bên ngoài và bên trong dấu hàm</title>
<desc id="desc">Cả hai khung lấy hàm gốc f(x)=x bình phương trừ 4x cộng 3, nét xám đứt. Khung trái vẽ giá trị tuyệt đối của đầu ra, phần parabol âm giữa x bằng 1 và 3 được phản xạ lên trên trục x. Khung phải vẽ f của giá trị tuyệt đối của đầu vào, lấy nửa đồ thị x không âm và phản chiếu sang bên trái trục y, có hai điểm thấp nhất x bằng âm 2 và 2.</desc>
<style>.hdr{font:650 20px system-ui,Arial,sans-serif;fill:#153b54}.lab{font:600 17px system-ui,Arial,sans-serif;fill:#25465e}.tick{font:400 12px system-ui,Arial,sans-serif;fill:#5e788a}.note{font:400 13px system-ui,Arial,sans-serif;fill:#4c677a}</style>
<rect width="1100" height="430" rx="18" fill="#fbfdff"/>
<text x="30" y="35" class="hdr">Cùng một dấu | |, hai cách thay đổi đồ thị</text>
<text x="65" y="68" class="lab">A · y = |f(x)| — đổi dấu đầu ra âm</text>
<text x="605" y="68" class="lab">B · y = f(|x|) — đổi đầu vào âm</text>
