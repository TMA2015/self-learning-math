<text x="25" y="40" fill="#163c55" font-size="24" font-weight="700" font-family="system-ui,Arial">Một hàm số – bốn cách đặt câu hỏi</text>
<text x="25" y="74" fill="#456c83" font-size="18" font-family="system-ui,Arial">f(x) = log₂ x · Miền xác định x &gt; 0</text>
