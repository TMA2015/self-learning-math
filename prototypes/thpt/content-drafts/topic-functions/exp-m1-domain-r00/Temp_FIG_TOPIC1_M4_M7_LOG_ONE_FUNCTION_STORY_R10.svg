<svg xmlns="http://www.w3.org/2000/svg" width="760" height="485" viewBox="0 0 760 485" role="img" aria-labelledby="title desc">
<title id="title">Một hàm logarit đi qua bốn chặng M4 đến M7</title>
<desc id="desc">Đồ thị y bằng logarit cơ số 2 của x, chỉ trên miền x lớn hơn 0. Có tiệm cận đứng x bằng 0. Các điểm A(0,5; âm 1), B(1;0), C(2;1), D(4;2). Đường cong tăng liên tục trên miền, và phần [0,5;4] được nhấn để đọc giá trị nhỏ nhất âm 1 và lớn nhất 2. Tiếp tuyến tại C có hệ số góc 1 chia 2 ln 2.</desc>
