<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chuyên đề 1 M2 · Đồ thị hàm từng đoạn</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#173b53;background:white}
*{box-sizing:border-box}
body{margin:0;padding:14px}.card{max-width:850px;margin:auto;border:1px solid #c7dfe9;border-radius:16px;overflow:hidden}
header{background:#e9f4fa;padding:16px 19px}
h1{font-size:19px;margin:0 0 6px}p{margin:7px 0;line-height:1.6}
main{padding:15px 19px}figure{margin:12px 0;padding:6px;border:1px solid #e0edf4;border-radius:12px;background:#fcfeff}
svg{display:block;width:100%;height:auto}label{font-weight:600;display:block}
input{width:100%;accent-color:#1687b4;min-height:34px}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:11px 0}
button{padding:9px 12px;border:1px solid #b7d4e4;border-radius:9px;background:#fff;color:#18506b;font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid #126aa3;outline-offset:2px}
.output{padding:12px 14px;border:1px solid #d3e7f1;border-radius:11px;background:#f3f9fc;line-height:1.6}
.small{font-size:13px;color:#526f81}
@media(max-width:480px){body{padding:6px}header,main{padding:12px}h1{font-size:17px}}
</style></head><body>
<section class="card" aria-label="Phòng thí nghiệm hàm số từng đoạn">
<header><h1>Đọc đồ thị tại điểm đổi công thức</h1>
<p>Hàm số đang xét: <strong>f(x) = x + 1</strong> khi <strong>x &lt; 1</strong>; <strong>f(x) = 3</strong> khi <strong>x ≥ 1</strong>.</p></header>
<main>
<label for="x">Chọn giá trị x: <output id="val" for="x">0</output></label>
<input id="x" type="range" min="-2" max="3" step="0.01" value="0" aria-label="Chọn x để quan sát hai nhánh của đồ thị">
<figure><svg role="img" viewBox="0 0 720 355" aria-labelledby="ttl dsc" xmlns="http://www.w3.org/2000/svg">
<title id="ttl">Đường thẳng ở bên trái, nhánh hằng ở bên phải</title>
<desc id="dsc">Đường xanh dương biểu diễn y bằng x cộng 1 khi x nhỏ hơn 1, chấm rỗng ở (1,2). Đường xanh lá biểu diễn y bằng 3 khi x lớn hơn hoặc bằng 1, chấm đặc ở (1,3). Điểm cam di chuyển theo x đang chọn.</desc>
<rect width="720" height="355" fill="#fcfeff"/>
<g stroke="#e3edf3" stroke-width="1"><path d="M60 35V305 M145 35V305 M230 35V305 M315 35V305 M400 35V305 M485 35V305 M570 35V305 M655 35V305 M60 80H680 M60 125H680 M60 170H680 M60 215H680 M60 260H680 M60 305H680"/></g>
<g stroke="#8da7b7" stroke-width="1.5" fill="none"><path d="M315 35V310 M55 260H680"/></g>
<g font-family="system-ui,Arial" font-size="13" fill="#4b6b80" text-anchor="middle"><text x="145" y="329">−2</text><text x="230" y="329">−1</text><text x="315" y="329">0</text><text x="400" y="329">1</text><text x="485" y="329">2</text><text x="570" y="329">3</text></g>
<g font-family="system-ui,Arial" font-size="12" fill="#4b6b80" text-anchor="end"><text x="48" y="264">0</text><text x="48" y="219">1</text><text x="48" y="174">2</text><text x="48" y="129">3</text></g>
<path d="M145 305L400 170" stroke="#1687b4" stroke-width="2.8" fill="none" stroke-linecap="round"/>
<path d="M400 125H655" stroke="#218f73" stroke-width="2.8" fill="none" stroke-linecap="round"/>
<circle cx="400" cy="170" r="5.5" fill="#fcfeff" stroke="#1687b4" stroke-width="2.5"/>
<circle cx="400" cy="125" r="5.5" fill="#218f73"/>
<circle id="mark" cx="315" cy="215" r="5.5" fill="#ee922d" stroke="#fff" stroke-width="1.5"/>
<text x="400" y="22" text-anchor="middle" font-size="13" font-family="system-ui,Arial" fill="#345c74">○ (1;2) không thuộc · ● (1;3) thuộc</text>
</svg></figure>
<div class="buttons"><button type="button" data-x="0.99">x = 0,99</button><button type="button" data-x="1">x = 1</button><button type="button" data-x="1.01">x = 1,01</button><button type="button" data-x="2">x = 2</button></div>
<div class="output" id="result" role="status" aria-live="polite"></div>
<p class="small">Vận dụng: x = 1 phải dùng nhánh có dấu bằng. Đây là mô hình quan sát công khai, không phải Tự kiểm tra độc lập.</p>
</main></section>
<script>
(()=>{"use strict";
const slide=document.getElementById("x"),label=document.getElementById("val"),mark=document.getElementById("mark"),out=document.getElementById("result");
const show=v=>String(Math.round(v*100)/100).replace(".",",");
function render(){const x=Number(slide.value),left=x<1,y=left?x+1:3;label.textContent=show(x);
mark.setAttribute("cx",String(315+85*x));mark.setAttribute("cy",String(260-45*y));
out.textContent="x = "+show(x)+" thuộc nhánh "+(left?"x < 1":"x ≥ 1")+". Giá trị f(x) = "+show(y)+". "+(x===1?"Tại mốc, phải lấy điểm (1;3) được tô đặc.":"Đọc đúng điều kiện trước khi tính.");
}
slide.addEventListener("input",render);document.querySelectorAll("button[data-x]").forEach(b=>b.addEventListener("click",()=>{slide.value=b.dataset.x;render()}));render();
})();
</script></body></html>
