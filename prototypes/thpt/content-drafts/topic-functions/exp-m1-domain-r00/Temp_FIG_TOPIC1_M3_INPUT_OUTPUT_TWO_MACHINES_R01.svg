<svg xmlns="http://www.w3.org/2000/svg" width="560" height="700" viewBox="0 0 560 700" role="img" aria-labelledby="figTitle figDesc">
<title id="figTitle">Hai cách dùng dấu giá trị tuyệt đối cho cùng hàm f</title>
<desc id="figDesc">Với f(x)=x bình phương trừ 4x cộng 3 và x bằng âm 2. Máy A xử lý đầu ra: x âm 2 qua f được 15, lấy trị tuyệt đối của 15 được 15. Máy B xử lý đầu vào: x âm 2 lấy trị tuyệt đối thành 2, qua f được âm 1. Hai kết quả khác nhau.</desc>
<rect x="0" y="0" width="560" height="700" rx="16" fill="#ffffff"/>
<text x="24" y="39" font-family="system-ui,Segoe UI,sans-serif" font-size="23" font-weight="700" fill="#173b53">Một dấu | | — hai vị trí khác nhau</text>
<text x="24" y="73" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#44687f">Cùng hàm f(x) = x² − 4x + 3, cùng đầu vào x = −2</text>
<rect x="20" y="100" width="520" height="247" rx="14" fill="#eef7fc" stroke="#b9ddeb" stroke-width="2"/>
<text x="39" y="135" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#146b95">A · |f(x)| — đổi đầu ra</text>
<text x="39" y="166" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#36576b">Đưa x vào f trước, rồi lấy trị tuyệt đối kết quả</text>
<rect x="38" y="190" width="145" height="73" rx="10" fill="#fff" stroke="#a9c9da" stroke-width="2"/>
<rect x="207" y="190" width="145" height="73" rx="10" fill="#fff" stroke="#a9c9da" stroke-width="2"/>
<rect x="376" y="190" width="145" height="73" rx="10" fill="#d8edfc" stroke="#1881ab" stroke-width="2"/>
<path d="M183 227H203 M352 227H372" fill="none" stroke="#577b91" stroke-width="3" stroke-linecap="round"/>
<path d="M195 219L204 227L195 235 M364 219L373 227L364 235" fill="none" stroke="#577b91" stroke-width="3"/>
<g text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" fill="#183b54">
 <text x="110" y="232" font-size="22" font-weight="700">x = −2</text>
 <text x="280" y="219" font-size="18">f(−2)</text>
 <text x="280" y="245" font-size="23" font-weight="700">= 15</text>
 <text x="448" y="219" font-size="18">|15|</text>
 <text x="448" y="245" font-size="23" font-weight="700">= 15</text>
</g>
<text x="39" y="310" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#355d75">Chỉ tung độ âm mới bị đổi dấu; đầu vào giữ nguyên.</text>
<rect x="20" y="369" width="520" height="247" rx="14" fill="#eef9f3" stroke="#b7dcc8" stroke-width="2"/>
<text x="39" y="403" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700" fill="#1d7657">B · f(|x|) — đổi đầu vào</text>
<text x="39" y="434" font-family="system-ui,Segoe UI,sans-serif" font-size="17" fill="#36576b">Lấy trị tuyệt đối của x trước, rồi mới đưa vào f</text>
<rect x="38" y="458" width="145" height="73" rx="10" fill="#fff" stroke="#a9c9da" stroke-width="2"/>
<rect x="207" y="458" width="145" height="73" rx="10" fill="#fff" stroke="#a9c9da" stroke-width="2"/>
<rect x="376" y="458" width="145" height="73" rx="10" fill="#d8f1e6" stroke="#288767" stroke-width="2"/>
<path d="M183 495H203 M352 495H372" fill="none" stroke="#577b91" stroke-width="3" stroke-linecap="round"/>
<path d="M195 487L204 495L195 503 M364 487L373 495L364 503" fill="none" stroke="#577b91" stroke-width="3"/>
<g text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" fill="#183b54">
 <text x="110" y="500" font-size="22" font-weight="700">x = −2</text>
 <text x="280" y="487" font-size="18">|−2|</text>
 <text x="280" y="513" font-size="23" font-weight="700">= 2</text>
 <text x="448" y="487" font-size="18">f(2)</text>
 <text x="448" y="513" font-size="23" font-weight="700">= −1</text>
</g>
<text x="39" y="578" font-family="system-ui,Segoe UI,sans-serif" font-size="18" fill="#355d75">Hai đầu vào −2 và 2 được đưa qua cùng giá trị |x|.</text>
<path d="M24 647H536" stroke="#ddebf2" stroke-width="2"/>
<text x="280" y="679" font-family="system-ui,Segoe UI,sans-serif" font-size="21" font-weight="700" text-anchor="middle" fill="#173b53">Kết quả: 15 khác −1 ⇒ |f(x)| ≠ f(|x|)</text>
</svg>