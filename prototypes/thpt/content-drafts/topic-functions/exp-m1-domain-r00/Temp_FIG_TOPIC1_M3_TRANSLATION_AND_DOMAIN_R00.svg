<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 480" width="920" height="480" role="img" aria-labelledby="ttl desc">
<title id="ttl">Tịnh tiến một đoạn parabol sang phải hai đơn vị và lên trên ba đơn vị</title>
<desc id="desc">Đường xanh dương là f(u) bằng (u trừ 1) bình phương, chỉ trên đoạn đầu vào từ 0 đến 2. Đường xanh lá là g(x) bằng f(x trừ 2) cộng 3, chỉ trên đoạn đầu vào từ 2 đến 4. Điểm đỉnh từ I (1,0) chuyển thành I phẩy (3,3). Các đầu mút từ (0,1) và (2,1) chuyển thành (2,4) và (4,4). Hai đường chỉ được vẽ trên miền hợp lệ, không kéo dài ra vô cực.</desc>
<rect width="920" height="480" fill="#fbfdff" rx="16"/>
<text x="28" y="35" font-family="system-ui,Arial,sans-serif" font-size="21" font-weight="700" fill="#163b54">Một điểm dịch đi, cả miền đầu vào cũng dịch theo</text>
