<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="ttl dsc"><title id="ttl">Đồ thị từng đoạn: chấm đặc và chấm rỗng</title><desc id="dsc">Hàm f(x) bằng 2 nếu x nhỏ hơn hoặc bằng 1 và bằng x+3 nếu x lớn hơn 1. Nhánh trái có điểm đặc (1,2). Nhánh phải tới gần (1,4) nhưng điểm (1,4) rỗng. Hai tung độ 2 và 4 khác nhau, đồ thị có bước nhảy tại x=1.</desc><rect width="960" height="520" rx="20" fill="#f8fafc"/><text x="36" y="45" font-size="25" font-family="Arial" font-weight="700" fill="#0f172a">Đồ thị từng đoạn: chấm đặc và chấm rỗng</text><line x1="95" y1="450" x2="820" y2="450" stroke="#475569" stroke-width="2"/><line x1="430" y1="88" x2="430" y2="475" stroke="#475569" stroke-width="2"/><polyline points="100,296 210,296 320,296 430,296 540,296" fill="none" stroke="#2563eb" stroke-width="4"/><polyline points="540,142 595,103.5 650,65 705,26.5" fill="none" stroke="#d97706" stroke-width="4"/><circle cx="540" cy="296" r="8" fill="#2563eb"/><circle cx="540" cy="142" r="9" fill="#f8fafc" stroke="#d97706" stroke-width="4"/><line x1="540" y1="296" x2="540" y2="142" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5"/><text x="555" y="317" font-size="20" font-family="Arial" fill="#1d4ed8">(1,2) lấy</text><text x="555" y="160" font-size="20" font-family="Arial" fill="#b45309">(1,4) loại</text><text x="700" y="358" font-size="18" font-family="Arial" fill="#1d4ed8">x≤1: y=2</text><text x="700" y="394" font-size="18" font-family="Arial" fill="#b45309">x>1: y=x+3</text><text x="840" y="454" font-size="18" font-family="Arial" fill="#475569">x</text></svg>