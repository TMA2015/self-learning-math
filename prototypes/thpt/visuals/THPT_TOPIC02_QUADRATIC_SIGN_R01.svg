<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Dấu tam thức x bình trừ 4x cộng 3 khi có hai nghiệm 1 và 3</title>
<desc id="desc">Đồ thị parabol mở lên y=x bình trừ 4x cộng 3, cắt trục hoành tại x=1 và x=3, đỉnh (2,-1). Giá trị dương khi x nhỏ hơn 1 hoặc lớn hơn 3, bằng không ở 1 và 3, âm khi 1 nhỏ hơn x nhỏ hơn 3. Đồ thị chỉ minh họa cho lập luận dấu của tích (x-1)(x-3).</desc>
<rect x="0" y="0" width="900" height="520" rx="20" fill="#f8fafc"/>
<text x="50" y="53" font-size="27" font-weight="700" font-family="Arial,sans-serif" fill="#111827">Hiểu dấu tam thức qua đồ thị và nhân tử</text>
<text x="50" y="91" font-size="21" font-family="Arial,sans-serif" fill="#334155">f(x) = x² − 4x + 3 = (x − 1)(x − 3)</text>
<line x1="75" y1="285" x2="795" y2="285" stroke="#334155" stroke-width="3"/>
<path d="M 795 285 l -15 -8 v16 z" fill="#334155"/>
<text x="808" y="289" font-size="18" font-family="Arial,sans-serif" fill="#111827">x</text>
<line x1="100" y1="382" x2="100" y2="94" stroke="#64748b" stroke-width="3"/>
<path d="M 100 94 l -8 15 h16 z" fill="#64748b"/>
<text x="83" y="92" font-size="19" font-family="Arial,sans-serif" fill="#111827">y</text>
<polyline points="100.0,105.0 115.0,128.4 130.0,150.6 145.0,171.6 160.0,191.4 175.0,210.0 190.0,227.4 205.0,243.6 220.0,258.6 235.0,272.4 250.0,285.0 265.0,296.4 280.0,306.6 295.0,315.6 310.0,323.4 325.0,330.0 340.0,335.4 355.0,339.6 370.0,342.6 385.0,344.4 400.0,345.0 415.0,344.4 430.0,342.6 445.0,339.6 460.0,335.4 475.0,330.0 490.0,323.4 505.0,315.6 520.0,306.6 535.0,296.4 550.0,285.0 565.0,272.4 580.0,258.6 595.0,243.6 610.0,227.4 625.0,210.0 640.0,191.4 655.0,171.6 670.0,150.6 685.0,128.4 700.0,105.0" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="250" cy="285" r="7" fill="#fff" stroke="#047857" stroke-width="3"/>
<circle cx="550" cy="285" r="7" fill="#fff" stroke="#047857" stroke-width="3"/>
<circle cx="400" cy="345" r="5" fill="#047857"/>
<line x1="250" y1="265" x2="250" y2="305" stroke="#6b7280" stroke-width="2"/>
<line x1="550" y1="265" x2="550" y2="305" stroke="#6b7280" stroke-width="2"/>
<text x="245" y="314" font-size="20" font-family="Arial,sans-serif" fill="#111827">1</text>
<text x="545" y="314" font-size="20" font-family="Arial,sans-serif" fill="#111827">3</text>
<text x="404" y="368" font-size="17" font-family="Arial,sans-serif" fill="#111827">Đỉnh (2; −1)</text>
<text x="49" y="413" font-size="20" font-family="Arial,sans-serif" font-weight="600" fill="#111827">Bảng dấu của f(x) (a &gt; 0; Δ &gt; 0):</text>
<rect x="49" y="432" width="802" height="58" rx="10" fill="#fff" stroke="#9ca3af"/>
<text x="100" y="456" font-size="18" font-family="Arial,sans-serif" fill="#065f46">x &lt; 1: dương</text>
<text x="311" y="456" font-size="18" font-family="Arial,sans-serif" fill="#991b1b">1 &lt; x &lt; 3: âm</text>
<text x="550" y="456" font-size="18" font-family="Arial,sans-serif" fill="#065f46">x &gt; 3: dương</text>
<text x="111" y="477" font-size="15" font-family="Arial,sans-serif" fill="#334155">x = 1 hoặc x = 3: f(x) = 0. Khi giải ≥ hoặc ≤ phải xét lấy hai đầu mút.</text>
</svg>
