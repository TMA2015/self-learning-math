<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 500" role="img" aria-labelledby="ttl dsc"><title id="ttl">Dãy số là các điểm rời rạc tại chỉ số nguyên</title><desc id="dsc">Các điểm biểu diễn dãy hữu hạn u n bằng 2n trừ 1 từ n bằng 1 đến 6; không nối liên tục giữa các chỉ số. Sáu điểm là (1,1),(2,3),(3,5),(4,7),(5,9),(6,11).</desc><rect width="780" height="500" fill="#ffffff"/><line x1="90" y1="430" x2="715" y2="430" stroke="#243248" stroke-width="2.5"/><line x1="90" y1="440" x2="90" y2="45" stroke="#243248" stroke-width="2.5"/><text x="716" y="460" font-size="19">n</text><text x="48" y="39" font-size="19">uₙ</text><line x1="150" y1="369" x2="150" y2="430" stroke="#9bb6c3" stroke-dasharray="4 5"/><circle cx="150" cy="369" r="8" fill="#1573a3"/><text x="145" y="455" font-size="18">1</text><text x="159" y="356" font-size="17">1</text><line x1="242" y1="311" x2="242" y2="430" stroke="#9bb6c3" stroke-dasharray="4 5"/><circle cx="242" cy="311" r="8" fill="#1573a3"/><text x="237" y="455" font-size="18">2</text><text x="251" y="298" font-size="17">3</text><line x1="334" y1="253" x2="334" y2="430" stroke="#9bb6c3" stroke-dasharray="4 5"/><circle cx="334" cy="253" r="8" fill="#1573a3"/><text x="329" y="455" font-size="18">3</text><text x="343" y="240" font-size="17">5</text><line x1="426" y1="195" x2="426" y2="430" stroke="#9bb6c3" stroke-dasharray="4 5"/><circle cx="426" cy="195" r="8" fill="#1573a3"/><text x="421" y="455" font-size="18">4</text><text x="435" y="182" font-size="17">7</text><line x1="518" y1="137" x2="518" y2="430" stroke="#9bb6c3" stroke-dasharray="4 5"/><circle cx="518" cy="137" r="8" fill="#1573a3"/><text x="513" y="455" font-size="18">5</text><text x="527" y="124" font-size="17">9</text><line x1="610" y1="79" x2="610" y2="430" stroke="#9bb6c3" stroke-dasharray="4 5"/><circle cx="610" cy="79" r="8" fill="#1573a3"/><text x="605" y="455" font-size="18">6</text><text x="619" y="66" font-size="17">11</text><text x="265" y="40" font-size="23">uₙ = 2n − 1, n = 1,...,6</text><text x="178" y="485" font-size="18">Không nối điểm thành đường liên tục</text></svg>