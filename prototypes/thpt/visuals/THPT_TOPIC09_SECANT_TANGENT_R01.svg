<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" role="img" aria-labelledby="ttl dsc"><title id="ttl">Cát tuyến qua P Q tiến tới tiếp tuyến đạo hàm trên đồ thị y bằng x bình phương</title><desc id="dsc">Trên parabol y=x bình phương, P có tọa độ 1,1 và Q 2,4 ứng với h bằng1. Độ dốc cát tuyến là 3. Khi h tiến0 cả hai phía, độ dốc 2+h tiến2. Đường tiếp tuyến tại P có phương trình y bằng 2x trừ 1 và độ dốc bằng2. Các đường và tọa độ được biểu diễn theo cùng tỷ lệ.</desc><rect width="940" height="560" fill="#ffffff"/><line x1="85" y1="450" x2="860" y2="450" stroke="#2d3f53" stroke-width="2.5"/><line x1="100" y1="525" x2="100" y2="68" stroke="#2d3f53" stroke-width="2.5"/><text x="869" y="461" font-size="21">x</text><text x="83" y="60" font-size="21">y</text><text x="118" y="478" font-size="19">0</text><path d="M140.0,448.4 L148.1,447.7 L156.3,446.8 L164.4,445.9 L172.5,444.7 L180.6,443.5 L188.8,442.1 L196.9,440.6 L205.0,439.0 L213.1,437.2 L221.3,435.3 L229.4,433.3 L237.5,431.1 L245.6,428.8 L253.8,426.4 L261.9,423.8 L270.0,421.1 L278.1,418.3 L286.3,415.3 L294.4,412.2 L302.5,409.0 L310.6,405.6 L318.8,402.1 L326.9,398.5 L335.0,394.8 L343.1,390.9 L351.3,386.9 L359.4,382.7 L367.5,378.4 L375.6,374.0 L383.8,369.5 L391.9,364.8 L400.0,360.0 L408.1,355.1 L416.3,350.0 L424.4,344.8 L432.5,339.4 L440.6,334.0 L448.8,328.4 L456.9,322.6 L465.0,316.8 L473.1,310.8 L481.3,304.6 L489.4,298.4 L497.5,292.0 L505.6,285.5 L513.8,278.8 L521.9,272.0 L530.0,265.1 L538.1,258.0 L546.3,250.9 L554.4,243.5 L562.5,236.1 L570.6,228.5 L578.8,220.8 L586.9,213.0 L595.0,205.0 L603.1,196.9 L611.3,188.6 L619.4,180.2 L627.5,171.7 L635.6,163.1 L643.8,154.3 L651.9,145.4 L660.0,136.4" fill="none" stroke="#216fa1" stroke-width="4"/><line x1="150" y1="500" x2="650" y2="200" stroke="#bc5e30" stroke-width="3"/><line x1="150" y1="470" x2="650" y2="270" stroke="#2a944b" stroke-width="3" stroke-dasharray="10 6"/><circle cx="300" cy="410" r="8" fill="#1e6e9d"/><circle cx="500" cy="290" r="8" fill="#1e6e9d"/><text x="317" y="408" font-size="21">P(1;1)</text><text x="516" y="283" font-size="21">Q(2;4)</text><text x="555" y="105" font-size="22" fill="#216fa1">y=x²</text><text x="570" y="168" font-size="19" fill="#bc5e30">Cát tuyến m=3</text><text x="570" y="243" font-size="19" fill="#2a944b">Tiếp tuyến m=2</text><text x="185" y="527" font-size="20">m(PQ)=[(1+h)²−1]/h=2+h → 2 khi h→0, h≠0</text></svg>