<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="ttl dsc"><title id="ttl">Bảng dấu v và a cho chuyển động s bằng t mũ ba trừ sáu t bình phương cộng chín t</title><desc id="dsc">Trên thời gian từ 0 đến4, v bằng 3(t−1)(t−3): dương 0 đến1, âm 1 đến3, dương 3 đến4. Gia tốc a bằng6(t−2): âm 0 đến2, dương2 đến4. Tốc độ |v| giảm trên 0 đến1 và 2 đến3, tăng trên1 đến2 và3 đến4, riêng ở t1,t2,t3 phải xét biên.</desc><rect width="960" height="540" fill="#ffffff"/><text x="75" y="62" font-size="25">s=t³−6t²+9t, v=3(t−1)(t−3), a=6(t−2)</text><line x1="165" y1="155" x2="817" y2="155" stroke="#293f54" stroke-width="3"/><line x1="165" y1="142" x2="165" y2="425" stroke="#b8c6d5" stroke-width="1.6" stroke-dasharray="6 5"/><text x="159" y="130" font-size="20">0</text><line x1="325" y1="142" x2="325" y2="425" stroke="#b8c6d5" stroke-width="1.6" stroke-dasharray="6 5"/><text x="319" y="130" font-size="20">1</text><line x1="485" y1="142" x2="485" y2="425" stroke="#b8c6d5" stroke-width="1.6" stroke-dasharray="6 5"/><text x="479" y="130" font-size="20">2</text><line x1="645" y1="142" x2="645" y2="425" stroke="#b8c6d5" stroke-width="1.6" stroke-dasharray="6 5"/><text x="639" y="130" font-size="20">3</text><line x1="805" y1="142" x2="805" y2="425" stroke="#b8c6d5" stroke-width="1.6" stroke-dasharray="6 5"/><text x="799" y="130" font-size="20">4</text><text x="20" y="226" font-size="21">v</text><text x="20" y="307" font-size="21">a</text><text x="20" y="389" font-size="21">|v|</text><text x="250" y="230" font-size="31" text-anchor="middle">+</text><text x="410" y="230" font-size="31" text-anchor="middle">−</text><text x="570" y="230" font-size="31" text-anchor="middle">−</text><text x="730" y="230" font-size="31" text-anchor="middle">+</text><text x="330" y="311" font-size="31" text-anchor="middle">−</text><text x="650" y="311" font-size="31" text-anchor="middle">+</text><text x="250" y="390" font-size="20" text-anchor="middle">giảm</text><text x="410" y="390" font-size="20" text-anchor="middle">tăng</text><text x="570" y="390" font-size="20" text-anchor="middle">giảm</text><text x="730" y="390" font-size="20" text-anchor="middle">tăng</text><text x="165" y="466" font-size="19">Điểm t=1,2,3 là mốc kiểm riêng; không suy a âm luôn giảm tốc độ.</text></svg>