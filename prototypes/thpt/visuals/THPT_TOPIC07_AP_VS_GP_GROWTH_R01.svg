<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="ttl dsc"><title id="ttl">So sánh tăng đều và tăng theo phần trăm</title><desc id="dsc">Hai dãy cùng bắt đầu 100: cấp số cộng cộng thêm 10 cho các giá trị 100,110,120,130. Cấp số nhân nhân 1 phẩy 1 cho các giá trị 100,110,121,133 phẩy 1. Bắt đầu bằng nhau nhưng từ kỳ thứ ba độ chênh tăng dần.</desc><rect width="900" height="520" fill="#ffffff"/><line x1="80" y1="420" x2="825" y2="420" stroke="#30394d" stroke-width="2"/><line x1="90" y1="440" x2="90" y2="65" stroke="#30394d" stroke-width="2"/><text x="810" y="452" font-size="19">kỳ</text><text x="22" y="61" font-size="18">giá trị</text><line x1="88" y1="350" x2="790" y2="350" stroke="#d4d9dc" stroke-width="1"/><text x="28" y="357" font-size="17">100</text><line x1="88" y1="280" x2="790" y2="280" stroke="#d4d9dc" stroke-width="1"/><text x="28" y="287" font-size="17">110</text><line x1="88" y1="210" x2="790" y2="210" stroke="#d4d9dc" stroke-width="1"/><text x="28" y="217" font-size="17">120</text><line x1="88" y1="140" x2="790" y2="140" stroke="#d4d9dc" stroke-width="1"/><text x="28" y="147" font-size="17">130</text><line x1="88" y1="70" x2="790" y2="70" stroke="#d4d9dc" stroke-width="1"/><text x="28" y="77" font-size="17">140</text><polyline points="180,350 340,280 500,210 660,140" fill="none" stroke="#1b7297" stroke-width="3"/><polyline points="180,350 340,280 500,203 660,118.3" fill="none" stroke="#bc612c" stroke-width="3"/><circle cx="180" cy="350" r="6" fill="#1b7297"/><circle cx="180" cy="350" r="4.5" fill="#bc612c"/><text x="176" y="449" font-size="18">1</text><circle cx="340" cy="280" r="6" fill="#1b7297"/><circle cx="340" cy="280" r="4.5" fill="#bc612c"/><text x="336" y="449" font-size="18">2</text><circle cx="500" cy="210" r="6" fill="#1b7297"/><circle cx="500" cy="203" r="4.5" fill="#bc612c"/><text x="496" y="449" font-size="18">3</text><circle cx="660" cy="140" r="6" fill="#1b7297"/><circle cx="660" cy="118.30000000000007" r="4.5" fill="#bc612c"/><text x="656" y="449" font-size="18">4</text><rect x="550" y="54" width="280" height="50" fill="#fff"/><line x1="563" y1="70" x2="595" y2="70" stroke="#1b7297" stroke-width="4"/><text x="604" y="77" font-size="17">CSC +10 / kỳ</text><line x1="563" y1="94" x2="595" y2="94" stroke="#bc612c" stroke-width="4"/><text x="604" y="101" font-size="17">CSN ×1,1 / kỳ</text><text x="600" y="485" font-size="18">Kỳ 4: 130 so với 133,1</text></svg>