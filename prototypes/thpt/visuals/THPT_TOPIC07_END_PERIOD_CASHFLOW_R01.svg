<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" role="img" aria-labelledby="ttl dsc"><title id="ttl">Dòng tiền nộp cuối kỳ và số dư ở cuối kỳ ba</title><desc id="dsc">Kỳ 0 không nộp. Nộp 100 đơn vị cuối các kỳ 1,2,3 với lãi suất 10 phần trăm mỗi kỳ. Giá trị tính tại ngay cuối kỳ 3 là: khoản kỳ 1 có giá trị 121, khoản kỳ 2 là 110, khoản kỳ 3 là 100. Tổng là 331.</desc><rect width="950" height="480" fill="#ffffff"/><line x1="100" y1="210" x2="870" y2="210" stroke="#2a364c" stroke-width="3"/><path d="M870 210 l-15 -8 v16 z" fill="#2a364c"/><line x1="130" y1="193" x2="130" y2="228" stroke="#394c60" stroke-width="2"/><text x="122" y="252" font-size="22">0</text><line x1="352" y1="193" x2="352" y2="228" stroke="#394c60" stroke-width="2"/><text x="344" y="252" font-size="22">1</text><line x1="574" y1="193" x2="574" y2="228" stroke="#394c60" stroke-width="2"/><text x="566" y="252" font-size="22">2</text><line x1="796" y1="193" x2="796" y2="228" stroke="#394c60" stroke-width="2"/><text x="788" y="252" font-size="22">3</text><line x1="352" y1="100" x2="352" y2="195" stroke="#1a7e9b" stroke-width="4"/><path d="M352 196 l-8 -14 h16 z" fill="#1a7e9b"/><text x="311" y="83" font-size="19">+100</text><line x1="574" y1="100" x2="574" y2="195" stroke="#1a7e9b" stroke-width="4"/><path d="M574 196 l-8 -14 h16 z" fill="#1a7e9b"/><text x="533" y="83" font-size="19">+100</text><line x1="796" y1="100" x2="796" y2="195" stroke="#1a7e9b" stroke-width="4"/><path d="M796 196 l-8 -14 h16 z" fill="#1a7e9b"/><text x="755" y="83" font-size="19">+100</text><text x="90" y="298" font-size="19">Giá trị cuối kỳ 3 của từng khoản</text><text x="295" y="337" font-size="19">Kỳ 1: 100 × 1,1² = 121</text><text x="295" y="366" font-size="19">Kỳ 2: 100 × 1,1 = 110</text><text x="295" y="395" font-size="19">Kỳ 3: 100 × 1 = 100</text><text x="340" y="443" font-size="25">Tổng: 121 + 110 + 100 = 331</text></svg>