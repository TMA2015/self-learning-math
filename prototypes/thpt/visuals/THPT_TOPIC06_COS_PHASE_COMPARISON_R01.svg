<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">So sánh cos(2x) và 1+3cos(2x+π/3)</title><desc id="desc">Hai đường cùng chu kỳ π. Đường xám đứt nét có biên độ 1, trục giữa 0, đỉnh tại x=0. Đường xanh có biên độ 3, trục giữa 1, đỉnh 4 tại x=−π/6 và 5π/6, đáy −2 tại x=π/3. Đỉnh dịch trái π/6 so với cos(2x).</desc>
<rect width="1000" height="500" rx="16" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#243447">
<text x="45" y="34" font-size="23" font-weight="bold">Dịch pha, biên độ và trục giữa — trên cùng hệ trục</text>
<line x1="75" y1="58" x2="110" y2="58" stroke="#64748b" stroke-width="3" stroke-dasharray="8 5"/><text x="120" y="64" font-size="19">y = cos(2x)</text>
<line x1="390" y1="58" x2="425" y2="58" stroke="#126d9a" stroke-width="4"/><text x="435" y="64" font-size="19">y = 1 + 3cos(2x + π/3)</text>
