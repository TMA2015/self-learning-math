<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="titleDom descDom">
<title id="titleDom">Lọc nghiệm ngoại lai theo miền xác định của hai căn bậc hai</title>
<desc id="descDom">Với phương trình căn x bình cộng 7x cộng 11 bằng căn x cộng 3, sau khi bình phương có hai nghiệm ứng viên âm 4 và âm 2. Căn x cộng 3 đòi x lớn hơn hoặc bằng âm 3. Trên trục số, vùng x từ âm 3 trở lên tô nền xanh. Ứng viên âm 4 bên trái vùng bị gạch bỏ; âm 2 trong miền được nhận vì cả hai căn có giá trị 1. Biên âm 3 chỉ là ranh giới miền, không phải nghiệm.</desc>
<rect x="0" y="0" width="1100" height="520" rx="22" fill="#f8fafc"/>
<text x="42" y="52" font-size="27" font-weight="700" font-family="Arial,sans-serif" fill="#102a43">Bình phương cho nghiệm ứng viên — miền xác định mới chọn nghiệm thật</text>
<text x="44" y="105" font-size="23" font-family="Arial,sans-serif" fill="#1f2937">√(x² + 7x + 11) = √(x + 3)</text>
<text x="44" y="142" font-size="20" font-family="Arial,sans-serif" fill="#1f2937">Phương trình bình phương: (x + 4)(x + 2) = 0 → x = −4 hoặc x = −2</text>
<rect x="407" y="194" width="634" height="124" fill="#d1fae5" fill-opacity="0.75" rx="15"/>
<text x="582" y="222" font-size="18" font-family="Arial,sans-serif" fill="#065f46">Điều kiện căn phải: x ≥ −3</text>
<line x1="72" y1="283" x2="1035" y2="283" stroke="#334155" stroke-width="4"/>
<path d="M 1035 283 l -14 -8 v16 z" fill="#334155"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#1f2937" text-anchor="middle">
<line x1="231" y1="271" x2="231" y2="296" stroke="#334155" stroke-width="3"/><text x="231" y="326">−4</text>
<line x1="407" y1="271" x2="407" y2="296" stroke="#334155" stroke-width="3"/><text x="407" y="326">−3</text>
<line x1="583" y1="271" x2="583" y2="296" stroke="#334155" stroke-width="3"/><text x="583" y="326">−2</text>
<line x1="759" y1="271" x2="759" y2="296" stroke="#334155" stroke-width="3"/><text x="759" y="326">−1</text>
<line x1="935" y1="271" x2="935" y2="296" stroke="#334155" stroke-width="3"/><text x="935" y="326">0</text></g>
<path d="M219 256 l24 -25 M219 231 l24 25" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/>
<circle cx="407" cy="283" r="10" fill="#d1fae5" stroke="#047857" stroke-width="3"/>
<circle cx="583" cy="283" r="11" fill="#047857" stroke="#fff" stroke-width="3"/>
<text x="110" y="377" font-size="20" font-family="Arial,sans-serif" fill="#991b1b">x = −4: loại (x + 3 = −1).</text>
<text x="110" y="409" font-size="20" font-family="Arial,sans-serif" fill="#065f46">x = −2: nhận (hai căn đều bằng 1).</text>
<text x="110" y="460" font-size="19" font-family="Arial,sans-serif" fill="#334155">Màu chỉ hỗ trợ: vị trí mốc, điều kiện x ≥ −3 và phép thế mới quyết định đáp án.</text>
</svg>