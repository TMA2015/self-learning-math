<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc"><title id="title">Đồ thị tan x, các tiệm cận x bằng cộng hoặc trừ pi chia hai</title><desc id="desc">Các nhánh đồ thị tan tăng trên từng khoảng xác định và bị ngắt tại các đường gạch x bằng âm pi chia hai và dương pi chia hai, nơi cos x bằng không. Không nối hai nhánh qua tiệm cận đứng. Các nhánh được cắt tại biên vùng vẽ, không tạo đoạn ngang.</desc><rect width="1000" height="470" fill="#fff"/><line x1="60" y1="230" x2="940" y2="230" stroke="#30394d" stroke-width="2"/><line x1="500" y1="25" x2="500" y2="440" stroke="#30394d" stroke-width="2"/><line x1="290" y1="30" x2="290" y2="435" stroke="#b65125" stroke-width="2" stroke-dasharray="8 6"/><line x1="710" y1="30" x2="710" y2="435" stroke="#b65125" stroke-width="2" stroke-dasharray="8 6"/><path d="M80.00,230.00 L80.95,229.61 L81.91,229.21 L82.86,228.82 L83.82,228.43 L84.77,228.04 L85.73,227.64 L86.68,227.25 L87.63,226.86 L88.59,226.46 L89.54,226.07 L90.50,225.67 L91.45,225.28 L92.40,224.88 L93.36,224.49 L94.31,224.09 L95.27,223.69 L96.22,223.29 L97.18,222.89 L98.13,222.50 L99.08,222.10 L100.04,221.69 L100.99,221.29 L101.95,220.89 L102.90,220.49 L103.86,220.08 L104.81,219.67 L105.76,219.27 L106.72,218.86 L107.67,218.45 L108.63,218.04 L109.58,217.63 L110.53,217.21 L111.49,216.80 L112.44,216.38 L113.40,215.97 L114.35,215.55 L115.31,215.13 L116.26,214.71 L117.21,214.28 L118.17,213.86 L119.12,213.43 L120.08,213.00 L121.03,212.57 L121.99,212.14 L122.94,211.70 L123.89,211.26 L124.85,210.82 L125.80,210.38 L126.76,209.94 L127.71,209.49 L128.66,209.05 L129.62,208.59 L130.57,208.14 L131.53,207.69 L132.48,207.23 L133.44,206.77 L134.39,206.30 L135.34,205.84 L136.30,205.37 L137.25,204.89 L138.21,204.42 L139.16,203.94 L140.12,203.45 L141.07,202.97 L142.02,202.48 L142.98,201.99 L143.93,201.49 L144.89,200.99 L145.84,200.49 L146.79,199.98 L147.75,199.47 L148.70,198.95 L149.66,198.43 L150.61,197.91 L151.57,197.38 L152.52,196.85 L153.4