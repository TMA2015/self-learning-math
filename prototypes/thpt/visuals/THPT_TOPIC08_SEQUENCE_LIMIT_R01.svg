<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" role="img" aria-labelledby="ttl dsc"><title id="ttl">Dãy số rời rạc tiến gần L bằng 2</title><desc id="dsc">Tám điểm (n,2+1/n) với n nguyên 1 đến 8 nằm trên đường ngang giới hạn L bằng 2. Các điểm tiến gần đường gạch nhưng không chạm giới hạn; trục ngang là n nguyên dương và trục đứng là u n.</desc><rect width="940" height="510" fill="#fff"/><line x1="65" y1="435" x2="890" y2="435" stroke="#35475d" stroke-width="2.5"/><line x1="100" y1="468" x2="100" y2="40" stroke="#35475d" stroke-width="2.5"/><line x1="115" y1="327" x2="890" y2="327" stroke="#b2572b" stroke-width="3" stroke-dasharray="10 6"/><text x="720" y="310" font-size="23" fill="#9e4625">L = 2</text><text x="899" y="446" font-size="20">n</text><text x="50" y="42" font-size="19">uₙ</text><text x="310" y="48" font-size="24">uₙ = 2 + 1/n, n = 1,2,…</text><line x1="160" y1="117" x2="160" y2="327" stroke="#c4d9e1" stroke-dasharray="4 4"/><circle cx="160" cy="117" r="7.5" fill="#1a769c"/><text x="154" y="461" font-size="18">1</text><line x1="250" y1="222" x2="250" y2="327" stroke="#c4d9e1" stroke-dasharray="4 4"/><circle cx="250" cy="222" r="7.5" fill="#1a769c"/><text x="244" y="461" font-size="18">2</text><line x1="340" y1="257" x2="340" y2="327" stroke="#c4d9e1" stroke-dasharray="4 4"/><circle cx="340" cy="257" r="7.5" fill="#1a769c"/><text x="334" y="461" font-size="18">3</text><line x1="430" y1="274.5" x2="430" y2="327" stroke="#c4d9e1" stroke-dasharray="4 4"/><circle cx="430" cy="274.5" r="7.5" fill="#1a769c"/><text x="424" y="461" font-size="18">4</text><line x1="520" y1="285" x2="520" y2="327" stroke="#c4d9e1" stroke-dasharray="4 4"/><circle cx="520" cy="285" r="7.5" fill="#1a769c"/><text x="514" y="461" font-size="18">5</text><line x1="610" y1="292" x2="610" y2="327" stroke="#c4d9e1" stroke-dasharray="4 4"/><circle cx="610" cy="292" r="7.5" fill="#1a769c"/><text x="604" y="461" font-size="18">6</text><line x1="700" y1="297" x2="700" y2="327" stroke="#c4d9e1" stroke-dasharray="4 4"/><circle cx="700" cy="297" r="7.5" fill="#1a769c"/><text x="694" y="461" font-size="18">7</text><line x1="790" y1="300.75" x2="790" y2="327" stroke="#c4d9e1" stroke-dasharray="4 4"/><circle cx="790" cy="300.75" r="7.5" fill="#1a769c"/><text x="784" y="461" font-size="18">8</text><text x="160" y="493" font-size="18">Khoảng cách |uₙ − 2| = 1/n → 0</text></svg>