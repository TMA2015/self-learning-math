<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="title desc">
<title id="title">Góc giữa hai vectơ cùng gốc</title><desc id="desc">Hai vectơ khác không được tịnh tiến về chung gốc O. Hai vectơ vuông góc; hình biểu diễn trong mặt phẳng chứa chúng, không theo tỉ lệ độ dài.</desc>
<rect width="640" height="350" fill="#fff"/>
<defs><marker id="au" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#176b82"/></marker><marker id="av" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#a65330"/></marker></defs>
<g font-family="Arial,sans-serif" fill="#172b36"><text x="320" y="38" text-anchor="middle" font-size="22" font-weight="bold">Tịnh tiến về chung gốc O</text><text x="320" y="68" text-anchor="middle" font-size="17">Mặt phẳng chứa hai vectơ</text>
<path d="M148 250 H180 V218 H148" fill="none" stroke="#52616a" stroke-width="2.5"/>
<line x1="148" y1="250" x2="448" y2="250" stroke="#176b82" stroke-width="4" marker-end="url(#au)"/>
<line x1="148" y1="250" x2="148" y2="92" stroke="#a65330" stroke-width="4" marker-end="url(#av)"/>
<circle cx="148" cy="250" r="4" fill="#172b36"/><text x="121" y="274" font-size="20">O</text>
<text x="308" y="280" text-anchor="middle" font-size="20" fill="#176b82">u (hướng ngang)</text>
<text x="167" y="113" font-size="20" fill="#a65330">v</text><text x="193" y="213" font-size="19">90°</text>
<text x="320" y="326" text-anchor="middle" font-size="17">Minh họa hướng; không theo tỉ lệ độ dài.</text></g>
</svg>