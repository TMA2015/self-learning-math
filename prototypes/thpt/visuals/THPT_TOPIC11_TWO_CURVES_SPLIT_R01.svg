<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ttl dsc"><title id="ttl">Diện tích giữa y=x và y=x bình phương từ không đến hai</title><desc id="dsc">Hai đường y=x và y=x bình phương giao tại x0 và x1. Trên x từ0 đến1 đường thẳng y=x ở trên parabol, diện tích một phần sáu. Trên x từ1 đến2 parabol y=x bình phương ở trên đường thẳng, diện tích năm phần sáu. Tổng diện tích1, không phải trị tuyệt đối của tích phân có dấu âm hai phần ba.</desc><rect width="960" height="560" fill="#fff"/>
