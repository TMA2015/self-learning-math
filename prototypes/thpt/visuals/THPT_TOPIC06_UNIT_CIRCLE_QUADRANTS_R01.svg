<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 550" role="img" aria-labelledby="title desc"><title id="title">Đường tròn đơn vị: góc 135 độ thuộc phần tư II</title><desc id="desc">Đường tròn tâm O bán kính 1, trục cos nằm ngang và sin đứng. Điểm M ở góc 135 độ có hoành độ âm trừ căn hai chia hai và tung độ dương căn hai chia hai; nét đứt chiếu lên các trục, giúp đọc dấu sin và cos.</desc><rect width="620" height="550" fill="#ffffff"/><line x1="60" y1="275" x2="570" y2="275" stroke="#323b50" stroke-width="2"/><line x1="310" y1="35" x2="310" y2="520" stroke="#323b50" stroke-width="2"/><circle cx="310" cy="275" r="200" fill="none" stroke="#216e8d" stroke-width="3"/><line x1="310" y1="275" x2="168.579" y2="133.579" stroke="#b65125" stroke-width="4"/><line x1="168.579" y1="133.579" x2="168.579" y2="275" stroke="#888" stroke-dasharray="6 5"/><line x1="168.579" y1="133.579" x2="310" y2="133.579" stroke="#888" stroke-dasharray="6 5"/><circle cx="168.579" cy="133.579" r="6" fill="#b65125"/><text x="322" y="270" font-size="19">O</text><text x="520" y="266" font-size="17">cos</text><text x="323" y="45" font-size="17">sin</text><text x="80" y="110" font-size="19">II: cos &lt; 0, sin &gt; 0</text><text x="85" y="85" font-size="17">M = (−√2/2, √2/2)</text><text x="177" y="128" font-size="17">M</text><text x="350" y="505" font-size="16">Góc 135° = 3π/4</text></svg>