<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 500" role="img" aria-labelledby="ttl dsc"><title id="ttl">Hai giới hạn một phía khác nhau tại x bằng không</title><desc id="dsc">Hàm x+2 với x nhỏ hơn không có giới hạn trái bằng 2, biểu diễn bằng điểm trống ở (0,2). Hàm 2x+1 với x lớn hơn hoặc bằng không có giới hạn phải bằng 1 và điểm đặc tại (0,1). Hai giới hạn khác nhau nên không có giới hạn hai phía tại không.</desc><rect width="850" height="500" fill="#fff"/><line x1="90" y1="385" x2="780" y2="385" stroke="#364454" stroke-width="2.5"/><line x1="420" y1="445" x2="420" y2="65" stroke="#364454" stroke-width="2.5"/><text x="792" y="396" font-size="19">x</text><text x="405" y="48" font-size="20">y</text><text x="435" y="403" font-size="18">0</text><line x1="190" y1="330" x2="420" y2="160" stroke="#126e99" stroke-width="4"/><line x1="420" y1="265" x2="575" y2="110" stroke="#ae572b" stroke-width="4"/><circle cx="420" cy="160" r="8" fill="#fff" stroke="#126e99" stroke-width="3.5"/><circle cx="420" cy="265" r="8" fill="#ae572b" stroke="#ae572b" stroke-width="3"/><line x1="90" y1="160" x2="415" y2="160" stroke="#9db6ca" stroke-dasharray="6 5"/><line x1="90" y1="265" x2="415" y2="265" stroke="#c9aa9f" stroke-dasharray="6 5"/><text x="42" y="167" font-size="20">2</text><text x="42" y="272" font-size="20">1</text><text x="130" y="102" font-size="20" fill="#126e99">Trái: 2, chấm trống</text><text x="520" y="80" font-size="20" fill="#ae572b">Phải: 1, chấm đặc</text><text x="194" y="471" font-size="20">lim trái = 2 ≠ lim phải = 1</text></svg>