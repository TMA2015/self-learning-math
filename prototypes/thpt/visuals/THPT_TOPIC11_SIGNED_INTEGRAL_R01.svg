<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="ttl dsc"><title id="ttl">Tích phân có dấu khác diện tích không âm của đồ thị y bằng x từ âm một đến hai</title><desc id="dsc">Đồ thị y=x có hai vùng tam giác khi x từ âm1 đến2. Vùng bên trái trục tung có diện tích nửa đơn vị vuông nhưng đóng góp tích phân âm một phần hai. Vùng phải có diện tích2 và đóng góp tích phân dương2. Tích phân có dấu bằng ba phần hai; tổng diện tích hình học bằng năm phần hai. Điểm đổi dấu x0.</desc><rect width="960" height="560" fill="#fff"/>
<line x1="140" y1="300" x2="860" y2="300" stroke="#405267" stroke-width="2"/><line x1="460" y1="525" x2="460" y2="40" stroke="#405267" stroke-width="2"/><polygon points="320,300 460,300 320,440" fill="#f8d5bf" stroke="#ba5b32" stroke-width="1.7"/><polygon points="460,300 740,300 740,20" fill="#d4e9fb" stroke="#267ba7" stroke-width="1.7"/><line x1="320" y1="440" x2="740" y2="20" stroke="#254a8d" stroke-width="3.5"/>
<text x="308" y="325" font-size="20" fill="#253a55">−1</text><text x="449" y="325" font-size="20" fill="#253a55">0</text><text x="732" y="325" font-size="20" fill="#253a55">2</text><text x="175" y="185" font-size="20" fill="#b35b2b">Vùng âm: −1/2</text><text x="605" y="182" font-size="20" fill="#236d98">Vùng dương: +2</text>
<text x="190" y="483" font-size="22" fill="#243f59">∫ từ −1 đến 2 của x dx = 3/2 (có dấu)</text>
<text x="190" y="524" font-size="22" fill="#243f59">Diện tích ∫|x| dx = 1/2 + 2 = 5/2</text>
</svg>