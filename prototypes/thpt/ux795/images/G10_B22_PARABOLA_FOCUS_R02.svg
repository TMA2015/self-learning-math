<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 445" role="img" aria-labelledby="t d"><title id="t">Parabol y²=4x với tiêu điểm F(1,0), đường chuẩn x=-1</title><desc id="d">Parabol có đỉnh O(0,0), mở sang phải, tiêu điểm F(1,0), đường chuẩn đứng x=-1. Mỗi điểm P trên parabol có khoảng cách đến F bằng khoảng cách vuông góc đến đường chuẩn.</desc><rect width="760" height="445" fill="#f8fbff" rx="22"/><text x="21" y="41" font-size="23" font-weight="700" fill="#193b68" font-family="Arial,sans-serif">Parabol: cách đều tiêu điểm và đường chuẩn</text>
