<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="t d"><title id="t">Đường thẳng 2x+y=6 với vectơ chỉ phương và pháp tuyến</title><desc id="d">Đường thẳng qua (0,6) và (3,0). Tại P(1,4), vectơ chỉ phương u=(1,-2) nằm dọc đường và vectơ pháp tuyến n=(2,1) vuông góc đường, tích vô hướng bằng 0.</desc><rect width="760" height="420" fill="#f8fbff" rx="20"/><text x="24" y="40" font-size="24" font-weight="700" fill="#18395f" font-family="Arial,sans-serif">Chỉ phương đi dọc đường, pháp tuyến vuông góc</text>
