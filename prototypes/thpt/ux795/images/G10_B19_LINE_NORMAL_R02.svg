<g font-family="Arial,sans-serif" font-size="19" fill="#18395f"><text x="240" y="130">P(1;4)</text><text x="295" y="250">u=(1;−2)</text><text x="375" y="96">n=(2;1)</text><text x="370" y="335">2x+y=6</text><text x="136" y="354">O</text></g>
<text x="25" y="395" font-size="18" font-family="Arial,sans-serif" fill="#375575">u·n = 1·2 + (−2)·1 = 0. Hình minh họa quan hệ vuông góc.</text></svg>