<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">Tăng trưởng rời rạc và đường liên tục tương đương</title><desc id="desc">Dữ liệu A0 bằng 100, r bằng 20 phần trăm mỗi năm. Đường liên tục với k bằng ln 1,2 đi qua các chấm tại năm nguyên, nhưng hai cách mô hình hóa có giả định thời gian khác nhau.</desc><rect width="720" height="420" fill="#fff"/><text x="24" y="36" font-family="sans-serif" font-size="20" fill="#143c4b">A(n)=100(1,2)^n và A(t)=100e^(kt), k=ln(1,2)</text><line x1="90" y1="350" x2="640" y2="350" stroke="#263c52" stroke-width="3"/><line x1="90" y1="350" x2="90" y2="75" stroke="#263c52" stroke-width="3"/><text x="640" y="375" font-size="17" font-family="sans-serif">t (năm)</text><text x="15" y="75" font-size="17" font-family="sans-serif">A</text><path d="M90 338 C150 320 175 317 200 307 S290 278 310 265 S420 220 420 215 S530 159 530 151" stroke="#176fa3" stroke-width="4" fill="none"/><g fill="#e06d2f" stroke="#b34f19" stroke-width="1.5"><circle cx="90" cy="338" r="7"/><circle cx="200" cy="307" r="7"/><circle cx="310" cy="265" r="7"/><circle cx="420" cy="215" r="7"/><circle cx="530" cy="151" r="7"/></g><g font-size="16" font-family="sans-serif" fill="#243746"><text x="86" y="371">0</text><text x="195" y="371">1</text><text x="305" y="371">2</text><text x="415" y="371">3</text><text x="525" y="371">4</text><text x="40" y="340">100</text><text x="40" y="155">207</text></g><text x="123" y="91" font-size="17" font-family="sans-serif" fill="#176fa3">Đường liên tục</text><circle cx="140" cy="125" r="7" fill="#e06d2f"/><text x="155" y="131" font-size="17" font-family="sans-serif">Điểm năm nguyên</text><text x="115" y="402" font-size="14" font-family="sans-serif" fill="#525c66">Chỉ khớp đúng tại n nguyên nếu k=ln(1+r); không tự đặt k=r.</text></svg>