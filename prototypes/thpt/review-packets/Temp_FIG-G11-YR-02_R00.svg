<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title desc"><title id="title">Dữ liệu ghép nhóm và lớp chứa trung vị</title><desc id="desc">Ba nhóm từ 0 đến dưới 10 có tần số 2, từ 10 đến dưới 20 có tần số 5, từ 20 đến dưới 30 có tần số 3. Tổng n bằng 10, tích lũy là 2,7,10, lớp thứ hai chứa vị trí n chia 2.</desc><rect width="720" height="450" fill="#fff"/><text x="45" y="42" font-size="22" font-family="sans-serif">Dữ liệu ghép nhóm: đếm tích lũy để tìm trung vị</text><line x1="85" y1="342" x2="665" y2="342" stroke="#273f4e" stroke-width="3"/><line x1="85" y1="345" x2="85" y2="70" stroke="#273f4e" stroke-width="3"/><rect x="130" y="244" width="135" height="98" fill="#9bc9dc" stroke="#477e9d" stroke-width="2"/><rect x="265" y="98" width="135" height="244" fill="#ecb16b" stroke="#b37739" stroke-width="2"/><rect x="400" y="195" width="135" height="147" fill="#9bc9dc" stroke="#477e9d" stroke-width="2"/><g font-family="sans-serif" font-size="22" fill="#223d51"><text x="187" y="234">2</text><text x="319" y="90">5</text><text x="458" y="185">3</text><text x="142" y="378">[0;10)</text><text x="268" y="378">[10;20)</text><text x="402" y="378">[20;30)</text></g><text x="105" y="412" font-size="18" font-family="sans-serif">Tần số tích lũy: 2 → 7 → 10; vị trí n/2=5 nằm trong nhóm thứ hai.</text><text x="94" y="65" font-size="17" font-family="sans-serif">Tần số</text></svg>