name: UX795 G10 Draft Render QA (no deploy)
# The 27-lesson x 3-width browser census is NOT a lesson-change check.
# Retain on shared navigation/theme or its own harness change, or manual dispatch.
# Scoped QA owns single-lesson Markdown, independent figures and Q18 receipts.
on:
  pull_request:
    paths:
      - "docs/assets/stylesheets/thpt-g10-knowledge-hybrid-l1-v1.css"
      - "docs/assets/javascripts/thpt-sgk-lesson-nav-v1.js"
      - "scripts/test-ux795-g10-render-draft.cjs"
      - "scripts/test-ux795-g10-knowledge-browser.cjs"
      - "scripts/test-ux795-g10-legacy-dual-source-audit.cjs"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ux795-g10-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render-model-b:
    name: Build and inspect G10 all 27 Knowledge pages
    runs-on: ubuntu-24.04
    timeout-minutes: 35 # Full 27 x 3 viewport browser AP QA; no skipped lesson
    steps:
      - uses: actions/checkout@v4
      - name: "MONITOR only · G10 27 source numbering, parent/sibling and a→b continuity"
        run: node scripts/test-ux795-g10-numbering-monitor.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: python -m pip install --disable-pip-version-check mkdocs-material
      - name: Build draft THPT with full original MkDocs config, no deploy
        run: mkdocs build --config-file mkdocs.thpt-preview.yml --site-dir site-thpt-preview
      - name: Enforce 27 candidate source SHA receipts and protected Knowledge-only scope
        run: node scripts/test-ux795-g10-source-candidate-lock.cjs
      - name: Structural coverage of 19 G10 ChVI outcome-first-try-D6 paths
        run: node scripts/test-ux795-g10-chvi-ped-mapping.cjs
      - name: Mathematical checks of 19 Chapter VI worked examples (B15-B18)
        run: node scripts/test-ux795-g10-chvi-worked-math.cjs
      - name: Source-pinned mathematical and geometric checks of 11 new educational SVGs
        run: node scripts/test-ux795-g10-figure-math.cjs
      - name: Enforce 27 rendered pages, four tabs, closed self-reveals, MathJax and SVG paths
        run: node scripts/test-ux795-g10-render-draft.cjs
      - name: Install isolated Chromium for real browser QA
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: "Real browser AP smoke - G10 27 lessons x 390/820/1440 (NO DEPLOY)"
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site-thpt-preview > /tmp/ux795-g10-browser-http.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          url="http://127.0.0.1:8765/thpt-preview/sgk/chuong-i/bai-1/"
          for _ in range(40):
              try:
                  with urllib.request.urlopen(url, timeout=3) as r:
                      if r.status==200: break
              except Exception:
                  time.sleep(.5)
          else:
              raise SystemExit("UX795 preview test server did not start")
          PY
          node scripts/test-ux795-g10-knowledge-browser.cjs

      - uses: actions/checkout@v4
        with:
          ref: main
          path: integration-main
          fetch-depth: 1
      - name: EVIDENCE ONLY - dual-source historic baseline versus current candidate (no gate bypass)
        run: node scripts/test-ux795-g10-legacy-dual-source-audit.cjs --baseline integration-main
      - name: "DRY RUN - merge 27 G10 Knowledge pages with published main titles, NO DEPLOY"
        run: |
          set -euo pipefail
          echo "Published main baseline for dry run:"
          git -C integration-main rev-parse HEAD
          lesson_count=0
          for lesson in docs/thpt-preview/sgk/chuong-*/bai-*.md; do
            [[ "$lesson" =~ /bai-[0-9]+\.md$ ]] || continue
            test -f "$lesson"
            cp "$lesson" "integration-main/$lesson"
            lesson_count=$((lesson_count + 1))
          done
          test "$lesson_count" -eq 27
          # The CSS was first added when all 27 G10 lessons were published.
          # Accept exactly TWO source-locked states:
          # (1) previous main without the single approved CSS line, OR
          # (2) current published main with the line already present.
          # In both cases reject ANY other MkDocs config difference. This is
          # a post-publication test migration, not a relaxation of source gates.
          python - <<'PY'
          from pathlib import Path
          css = "  - assets/stylesheets/thpt-g10-knowledge-hybrid-l1-v1.css\n"
          golden_hook = "  - hooks/sgk_golden_first_paint.py\n"
          for name in ("mkdocs.yml", "mkdocs.thpt-preview.yml"):
              candidate = Path(name).read_text(encoding="utf-8")
              live_file = Path("integration-main") / name
              published = live_file.read_text(encoding="utf-8")
              if candidate.count(css) != 1:
                  raise SystemExit(f"STANDARD_CONFLICT_HOLD: {name} must register exactly one scoped G10 CSS")
              # The #984 initial-HTML hook is added ONLY to the main config.
              # Require exact byte-preserving parity after removing ONLY
              # that one named hook and/or the one historic scoped CSS.
              if name == "mkdocs.yml" and candidate.count(golden_hook) != 1:
                  raise SystemExit("STANDARD_CONFLICT_HOLD: exactly one First Paint hook required")
              if name != "mkdocs.yml" and golden_hook in candidate:
                  raise SystemExit("STANDARD_CONFLICT_HOLD: no First Paint hook in alternate preview config")
              allowed = [candidate, candidate.replace(css, "", 1)]
              if name == "mkdocs.yml":
                  no_hook = candidate.replace(golden_hook, "", 1)
                  allowed.extend([no_hook, no_hook.replace(css, "", 1)])
              if published not in allowed:
                  raise SystemExit(f"STANDARD_CONFLICT_HOLD: {name} has unapproved config differences")
              print(f"PASS {name}: only the source-locked CSS/Golden hook states are permitted")
              live_file.write_text(candidate, encoding="utf-8")
          PY
          cp hooks/sgk_golden_first_paint.py integration-main/hooks/
          cp docs/assets/stylesheets/thpt-g10-knowledge-hybrid-l1-v1.css integration-main/docs/assets/stylesheets/
          # B09 new responsive decomposition D5: QA-only overlay, not deploy.
          for image in THPT_G10_B09_DECOMPOSITION_TWO_DIRECTIONS_D5_R03.svg THPT_G10_B09_DECOMPOSITION_MOBILE_D5_R03.svg; do
            cp "docs/assets/images/thpt/$image" "integration-main/docs/assets/images/thpt/$image"
          done
          # Overlay approved source-locked ChV visual dependencies in the
          # isolated integration checkout, never in production.
          cp docs/assets/javascripts/thpt-sgk-lesson-nav-v1.js integration-main/docs/assets/javascripts/
          cp docs/assets/images/thpt/G10_B14_BOXPLOT_S1_Q18_ENRICHMENT_20261113.svg integration-main/docs/assets/images/thpt/
          for name in \
            G10_B02_MEMBERSHIP_SUBSET_R01.svg \
            G10_B06_SURVEY_RIGHT_TRIANGLE_R01.svg \
            G10_B16_PARABOLA_VERTEX_R02.svg \
            G10_B17_QUADRATIC_SIGN_R02.svg \
            G10_B19_LINE_NORMAL_R02.svg \
            G10_B20_POINT_LINE_DISTANCE_R02.svg \
            G10_B21_CIRCLE_TANGENT_R02.svg \
            G10_B22_PARABOLA_FOCUS_R02.svg \
            G10_B23_ADD_MULTIPLY_CHOICES_R02.svg \
            G10_B24_ORDER_VS_COMBINATION_R02.svg \
            G10_B25_PASCAL_TRIANGLE_R02.svg; do
            cp "docs/assets/images/thpt/$name" "integration-main/docs/assets/images/thpt/$name"
          done
          # The follow-on Q18 UX receipt is optional for historical PRs.
          # If present, copy the exact signed source identities into this
          # isolated postmerge dry-run (not main / not production).
          if [[ -f prototypes/thpt/ux795/G10_CHVI_B15_B18_EXAMPLE_UX_Q18_DELTA_RECEIPT_20261113.md ]]; then
            cp prototypes/thpt/ux795/G10_CHVI_B15_B18_EXAMPLE_UX_Q18_DELTA_RECEIPT_20261113.md integration-main/prototypes/thpt/ux795/
          fi
          if [[ -f prototypes/thpt/ux795/G10_CHVII_B19_B22_S1_Q18_GOLDEN_ENRICHMENT_RECEIPT_20261113.md ]]; then
            cp prototypes/thpt/ux795/G10_CHVII_B19_B22_S1_Q18_GOLDEN_ENRICHMENT_RECEIPT_20261113.md integration-main/prototypes/thpt/ux795/
          fi
          # Exact B05 Q18 receipt must accompany the new canonical DEG First Try
          # when replayed in the temporary main+candidate checkout.
          # This is QA-only; not a production artifact mutation.
          if [[ -f prototypes/thpt/ux795/G10_CHIII_B05_S1_OWNER_Q18_ENRICHMENT_DELTA_R01_20261116.md ]]; then
            cp prototypes/thpt/ux795/G10_CHIII_B05_S1_OWNER_Q18_ENRICHMENT_DELTA_R01_20261116.md integration-main/prototypes/thpt/ux795/
          fi
          # B06 four-S1-section academic Delta C: exact Q18 receipt must accompany
          # candidate Markdown inside isolated main+candidate browser dry-run.
          if [[ -f prototypes/thpt/ux795/G10_CHIII_B06_S1_OWNER_Q18_ENRICHMENT_DELTA_R01_20261116.md ]]; then
            cp prototypes/thpt/ux795/G10_CHIII_B06_S1_OWNER_Q18_ENRICHMENT_DELTA_R01_20261116.md integration-main/prototypes/thpt/ux795/
          fi
          if [[ -f prototypes/thpt/ux795/G10_CHIII_B06_PED_REFERENCE_ANCHOR_R02_20261116.md ]]; then
            cp prototypes/thpt/ux795/G10_CHIII_B06_PED_REFERENCE_ANCHOR_R02_20261116.md integration-main/prototypes/thpt/ux795/
          fi
          if [[ -f prototypes/thpt/ux795/G10_CHIV_B08_S1_OWNER_Q18_ENRICHMENT_DELTA_R02_20261116.md ]]; then
            cp prototypes/thpt/ux795/G10_CHIV_B08_S1_OWNER_Q18_ENRICHMENT_DELTA_R02_20261116.md integration-main/prototypes/thpt/ux795/
          fi
          if [[ -f prototypes/thpt/ux795/G10_CHIV_B08_MATHJAX_DISPLAY_DELTA_A_R03_20261117.md ]]; then
            cp prototypes/thpt/ux795/G10_CHIV_B08_MATHJAX_DISPLAY_DELTA_A_R03_20261117.md integration-main/prototypes/thpt/ux795/
          fi
          # B08 R04 owner-approved 3+1 semantic teaching delta. Copy the
          # exact new Q18 receipt to QA-only integration checkout; original
          # R02 and R03 receipts remain immutable and are checked in order.
          if [[ -f prototypes/thpt/ux795/G10_CHIV_B08_SEMANTIC_3PLUS1_DELTA_R04_20261117.md ]]; then
            cp prototypes/thpt/ux795/G10_CHIV_B08_SEMANTIC_3PLUS1_DELTA_R04_20261117.md integration-main/prototypes/thpt/ux795/
          fi
          # Include B09 academic/S1 3+1 receipt only in the isolated QA
          # checkout. This is NOT release authority: B09-F02 authoring HOLD
          # remains explicit in the signed receipt and #795 master ledger.
          if [[ -f prototypes/thpt/ux795/G10_CHIV_B09_S1_SEMANTIC_DECOMPOSITION_R03_20261117.md ]]; then
            cp prototypes/thpt/ux795/G10_CHIV_B09_S1_SEMANTIC_DECOMPOSITION_R03_20261117.md integration-main/prototypes/thpt/ux795/
          fi
          # R05 uses ONE canonical B09 manuscript; carry the source and Q18
          # receipt together to the isolated main+candidate dry-run. No deploy.
          test -f prototypes/thpt/content-drafts/THPT_G10_CHIV_B09_CANONICAL.md
          test -f prototypes/thpt/ux795/G10_CHIV_B09_CANONICAL_Q18_R05_20261117.md
          cp prototypes/thpt/content-drafts/THPT_G10_CHIV_B09_CANONICAL.md integration-main/prototypes/thpt/content-drafts/
          cp prototypes/thpt/ux795/G10_CHIV_B09_CANONICAL_Q18_R05_20261117.md integration-main/prototypes/thpt/ux795/
          # Owner P2 scoped B09-F04: preserve R05 as history, chain real
          # learner error R06 and copy receipt to same isolated checkout.
          test -f prototypes/thpt/ux795/G10_CHIV_B09_TAB4_REAL_ERROR_P2_DELTA_C_R06_20261117.md
          cp prototypes/thpt/ux795/G10_CHIV_B09_TAB4_REAL_ERROR_P2_DELTA_C_R06_20261117.md integration-main/prototypes/thpt/ux795/
          # B10 G0–G5: overlay ONE current academic manuscript and Q18
          # receipt into the temporary main+candidate render QA. No deploy.
          test -f prototypes/thpt/content-drafts/THPT_G10_CHIV_B10_CANONICAL.md
          test -f prototypes/thpt/ux795/G10_CHIV_B10_S1_PED_SINGLE_CANONICAL_Q18_R01_20261118.md
          cp prototypes/thpt/content-drafts/THPT_G10_CHIV_B10_CANONICAL.md integration-main/prototypes/thpt/content-drafts/
          cp prototypes/thpt/ux795/G10_CHIV_B10_S1_PED_SINGLE_CANONICAL_Q18_R01_20261118.md integration-main/prototypes/thpt/ux795/
          # B10 owner P2 DELTA_A MathJax: the temporary dry-run overlays R02
          # Knowledge and R02 canonical, so it must also receive the exact
          # signed R01→R02 UI receipt. Historical R01 stays unchanged.
          test -f prototypes/thpt/ux795/G10_CHIV_B10_P2_MATHJAX_DELTA_A_UI_R02_20261118.md
          cp prototypes/thpt/ux795/G10_CHIV_B10_P2_MATHJAX_DELTA_A_UI_R02_20261118.md integration-main/prototypes/thpt/ux795/
          # B12 CALCULATOR candidate is a separate Delta C with its own exact
          # academic/PED review HOLD and Q18 source identity. Overlay receipt only
          # into isolated postmerge QA, never into public/production by this step.
          if [[ -f prototypes/thpt/ux795/G10_CHV_B12_S1_PED_CALCULATOR_Q18_R01_20261118.md ]]; then
            cp prototypes/thpt/ux795/G10_CHV_B12_S1_PED_CALCULATOR_Q18_R01_20261118.md integration-main/prototypes/thpt/ux795/
          fi
          # B15 one canonical source has new editor-signed Q18 receipt. This copy
          # is ONLY for integration-main dry-run and does not duplicate learner drafts.
          test -f prototypes/thpt/ux795/G10_CHVI_B15_OWNER_Q18_KNOWLEDGE_ENRICHMENT_20261119.md
          cp prototypes/thpt/ux795/G10_CHVI_B15_OWNER_Q18_KNOWLEDGE_ENRICHMENT_20261119.md integration-main/prototypes/thpt/ux795/
          # Owner P2 B15 two-hunk Delta A/B: replay the NEW signed receipt
          # with canonical source in isolated integration-main QA only.
          test -f prototypes/thpt/ux795/G10_CHVI_B15_P2_EDITORIAL_NOTE_DELTA_R01_20261119.md
          cp prototypes/thpt/ux795/G10_CHVI_B15_P2_EDITORIAL_NOTE_DELTA_R01_20261119.md integration-main/prototypes/thpt/ux795/
          # B15 owner screenshot R02: one canonical reading-flow source with
          # existing Golden figure class; include its Q18 receipt in dry run.
          test -f prototypes/thpt/ux795/G10_CHVI_B15_OWNER_P2_READABILITY_FIGURE_R02_20261119.md
          cp prototypes/thpt/ux795/G10_CHVI_B15_OWNER_P2_READABILITY_FIGURE_R02_20261119.md integration-main/prototypes/thpt/ux795/
          # B16 material Knowledge enrichment has its own locked candidate source;
          # the QA-only main+candidate checkout must carry its Q18 receipt too.
          if [[ -f prototypes/thpt/ux795/G10_CHVI_B16_OWNER_Q18_KNOWLEDGE_ENRICHMENT_R01_20261119.md ]]; then
            cp prototypes/thpt/ux795/G10_CHVI_B16_OWNER_Q18_KNOWLEDGE_ENRICHMENT_R01_20261119.md integration-main/prototypes/thpt/ux795/
          fi
          cp scripts/test-ux795-g10-postmerge-headings.cjs integration-main/scripts/
          (
            cd integration-main
            python scripts/test_thpt_knowledge_short_labels.py
            mkdocs build --config-file mkdocs.thpt-preview.yml --site-dir site-thpt-preview
            node scripts/test-ux795-g10-postmerge-headings.cjs
          )
          echo "main+candidate integration smoke PASS; no deployment or academic approval"
