name: G10 ChIV B07–B11 S1 editorial + Golden QA (Q18 self-verified, no deploy)
# Legacy ChIV multi-lesson suite: shared runtime / its own test maintenance only.
# Canonical lesson/source-receipt edits are covered by scoped SGK release QA.
on:
  pull_request:
    paths:
      - "docs/assets/javascripts/thpt-sgk-lesson-nav-v1.js"
      - "docs/assets/stylesheets/thpt-g10-knowledge-hybrid-l1-v1.css"
      - "scripts/test-g10-chiv-golden-browser.cjs"
      - "scripts/test-g10-chiv-editorial-source.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chiv-golden:
    name: Five published ChIV sources and 15 Golden browser cases
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify original answers, source SHA and S1 2.x section mapping
        run: |
          git fetch --no-tags --depth=3 origin 045b15ecc402acf9a081a35bd4a7fb36d6325188
          node scripts/test-g10-chiv-editorial-source.cjs
          node scripts/test-thpt-q18-release-test-router.cjs
      - name: Build preview with original site config
        run: |
          python -m pip install --disable-pip-version-check mkdocs-material
          mkdocs build --config-file mkdocs.thpt-preview.yml --site-dir site-thpt-preview
      - name: Install real headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Verify five source blobs, Golden presentation and cross-tab TOC at 390/820/1440
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site-thpt-preview >/tmp/g10-chiv-http.log 2>&1 &
          python - <<'PY'
          import time,urllib.request
          url="http://127.0.0.1:8765/thpt-preview/sgk/chuong-iv/bai-7/"
          for i in range(50):
              try:
                  with urllib.request.urlopen(url,timeout=2) as r:
                      if r.status==200: break
              except Exception: time.sleep(.5)
          else: raise SystemExit("Preview HTTP did not start")
          PY
          node scripts/test-g10-chiv-golden-browser.cjs
