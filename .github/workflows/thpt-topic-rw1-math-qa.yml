name: THPT Topic Knowledge shared math and tab QA (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/assets/javascripts/math-details-v1.js'
      - 'docs/assets/javascripts/thpt-topic01-release-tabs-v1.js'
      - 'docs/assets/javascripts/thpt-topic-w1-golden-v1.js'
      - 'docs/assets/javascripts/thpt-topic-w2-golden-v1.js'
      - 'docs/assets/javascripts/thpt-topic-w3-golden-v1.js'
      - 'docs/assets/javascripts/thpt-topic-w4-golden-v1.js'
      - 'docs/assets/javascripts/thpt-topic-w5-golden-v1.js'
      - 'scripts/test-thpt-topic-rw1-math-browser.py'
      - 'scripts/test-thpt-release-impact.cjs'
      - '.github/workflows/thpt-topic-rw1-math-qa.yml'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/thpt-deploy-scope-safety-qa.yml'
permissions:
  contents: read
jobs:
  topic-rw1:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        wave: [rw1, rw2, tail]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify actual PR before running historical scope gate
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/test-thpt-release-impact.cjs --self-test
          git diff --no-renames --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/rw1-pr-paths.txt"
          node scripts/test-thpt-release-impact.cjs "$RUNNER_TEMP/rw1-pr-paths.txt" >> "$GITHUB_OUTPUT"
          # Exact approved deployment-only recovery inherits the immutable browser PASS.
          # Unknown/runtime changes retain normal regression coverage.
      - name: Prove exact THPT menu-only scope (browser QA delegated to existing Math Lab workflow)
        if: steps.impact.outputs.reason == 'OWNER_THPT_MENU_6_PLUS_1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-menu-6-plus-1
      - name: Prove exact CĐ01 CP10 source refresh
        if: steps.impact.outputs.reason == 'OWNER_TOPIC01_REFRESH_CP10'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-topic01-refresh
      - name: Prove exact W4 refresh scope
        if: steps.impact.outputs.reason == 'OWNER_TOPIC_W4_REFRESH'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-w4-refresh
      - name: Prove exact W3b refresh scope
        if: steps.impact.outputs.reason == 'OWNER_TOPIC_W3B_REFRESH'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-w3b-refresh
      - name: Prove exact W3a refresh scope
        if: steps.impact.outputs.reason == 'OWNER_TOPIC_W3A_REFRESH'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-w3a-refresh
      - name: Prove exact W2b refresh scope
        if: steps.impact.outputs.reason == 'OWNER_TOPIC_W2B_REFRESH'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-w2b-refresh
      - name: Prove exact W2a refresh scope
        if: steps.impact.outputs.reason == 'OWNER_TOPIC_W2A_REFRESH'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-w2a-refresh
      - name: Prove exact W1 refresh scope
        if: steps.impact.outputs.reason == 'OWNER_TOPIC_W1_REFRESH'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-topic-w1-refresh
      - name: Prove exact Written library UI scope
        if: steps.impact.outputs.reason == 'OWNER_WRITTEN_LIBRARY_UI'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-written-library-ui
      - name: Prove exact R3 Back to top scope
        if: steps.impact.outputs.reason == 'OWNER_TOPIC_BACK_TOP_R3'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-topic-back-top
      - name: Prove exact SGK disclosure-only scope
        if: steps.impact.outputs.reason == 'OWNER_TOPIC_SGK_DISCLOSURES'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-topic-disclosures
      - name: Prove exact R-W3 display-only scope
        if: steps.impact.outputs.reason == 'OWNER_1055_RW3_TAB_LABELS'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-rw3-tabs
      - name: Prove exact unchanged W1 publication recovery
        if: steps.impact.outputs.reason == 'OWNER_W1_DEPLOY_RECOVERY_EXACT'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-w1-recovery
      - name: Prove immutable approved renderer and build inputs
        if: steps.impact.outputs.reason == 'OWNER_1110_DEPLOY_RECOVERY_EXACT'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-thpt-release-impact.cjs --prove-shared-recovery
      - uses: actions/setup-python@v5
        if: steps.impact.outputs.impact != 'METADATA' && steps.impact.outputs.reason != 'OWNER_1110_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_W1_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_THPT_MENU_6_PLUS_1' && ((steps.impact.outputs.reason != 'OWNER_1055_RW3_TAB_LABELS' && steps.impact.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.impact.outputs.reason != 'OWNER_TOPIC_BACK_TOP_R3' && steps.impact.outputs.reason != 'OWNER_WRITTEN_LIBRARY_UI' && steps.impact.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.impact.outputs.reason != 'OWNER_TOPIC_W1_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W4_REFRESH') || matrix.wave == 'tail')
        with:
          python-version: '3.12'
      - name: Install scoped QA dependencies
        if: steps.impact.outputs.impact != 'METADATA' && steps.impact.outputs.reason != 'OWNER_1110_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_W1_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_THPT_MENU_6_PLUS_1' && ((steps.impact.outputs.reason != 'OWNER_1055_RW3_TAB_LABELS' && steps.impact.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.impact.outputs.reason != 'OWNER_TOPIC_BACK_TOP_R3' && steps.impact.outputs.reason != 'OWNER_WRITTEN_LIBRARY_UI' && steps.impact.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.impact.outputs.reason != 'OWNER_TOPIC_W1_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W4_REFRESH') || matrix.wave == 'tail')
        run: |
          python -m pip install --disable-pip-version-check mkdocs-material playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Exact source and protected scope gate
        run: |
          node scripts/test-thpt-release-impact.cjs --self-test
          if [[ "${{ steps.impact.outputs.impact }}" == "SCOPED_TOPIC_RW1" ]]; then
            python scripts/test-thpt-topic-rw1-math-browser.py --scope
          fi
          node scripts/test-thpt-topic01-release-intake.cjs
      - name: Strict build (not full-site browser audit)
        if: steps.impact.outputs.impact != 'METADATA' && steps.impact.outputs.reason != 'OWNER_1110_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_W1_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_THPT_MENU_6_PLUS_1' && ((steps.impact.outputs.reason != 'OWNER_1055_RW3_TAB_LABELS' && steps.impact.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.impact.outputs.reason != 'OWNER_TOPIC_BACK_TOP_R3' && steps.impact.outputs.reason != 'OWNER_WRITTEN_LIBRARY_UI' && steps.impact.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.impact.outputs.reason != 'OWNER_TOPIC_W1_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W4_REFRESH') || matrix.wave == 'tail')
        run: |
          mkdocs build --strict
          mkdocs build -f mkdocs.thpt-preview.yml --strict
      - name: Shared-renderer candidate scope (no canonical changes)
        if: (steps.impact.outputs.impact == 'SCOPED_TOPIC_SHARED_MATH' && steps.impact.outputs.reason != 'OWNER_1110_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_W1_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_THPT_MENU_6_PLUS_1' && steps.impact.outputs.reason != 'OWNER_1055_RW3_TAB_LABELS' && steps.impact.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.impact.outputs.reason != 'OWNER_TOPIC_BACK_TOP_R3' && steps.impact.outputs.reason != 'OWNER_WRITTEN_LIBRARY_UI' && steps.impact.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.impact.outputs.reason != 'OWNER_TOPIC_W1_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W4_REFRESH') || github.event.pull_request.head.ref == 'release/shared-knowledge-math-rw2-20261125'
        run: python scripts/test-thpt-topic-rw1-math-browser.py --shared-candidate-scope
      - name: Published Topic navigation source preflight
        if: steps.impact.outputs.impact != 'METADATA' && steps.impact.outputs.reason != 'OWNER_1110_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_W1_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_THPT_MENU_6_PLUS_1' && ((steps.impact.outputs.reason != 'OWNER_1055_RW3_TAB_LABELS' && steps.impact.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.impact.outputs.reason != 'OWNER_TOPIC_BACK_TOP_R3' && steps.impact.outputs.reason != 'OWNER_WRITTEN_LIBRARY_UI' && steps.impact.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.impact.outputs.reason != 'OWNER_TOPIC_W1_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W4_REFRESH') || matrix.wave == 'tail')
        run: |
          node scripts/test-thpt-topic-knowledge-tabs-v3.cjs --self-test
          node scripts/test-thpt-topic-knowledge-tabs-v3.cjs
      - name: Knowledge outcomes — Markdown/HTML/MathJax, Chromium/WebKit, 390/820/1440
        if: steps.impact.outputs.impact != 'METADATA' && steps.impact.outputs.reason != 'OWNER_1110_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_W1_DEPLOY_RECOVERY_EXACT' && steps.impact.outputs.reason != 'OWNER_THPT_MENU_6_PLUS_1' && ((steps.impact.outputs.reason != 'OWNER_1055_RW3_TAB_LABELS' && steps.impact.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.impact.outputs.reason != 'OWNER_TOPIC_BACK_TOP_R3' && steps.impact.outputs.reason != 'OWNER_WRITTEN_LIBRARY_UI' && steps.impact.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.impact.outputs.reason != 'OWNER_TOPIC_W1_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W2B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3A_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W3B_REFRESH' && steps.impact.outputs.reason != 'OWNER_TOPIC_W4_REFRESH') || matrix.wave == 'tail')
        run: |
          if [[ "${{ steps.impact.outputs.reason }}" == "OWNER_TOPIC_W4_REFRESH" ]]; then
            git fetch --no-tags origin 4607740d76e635a7a76dffda013ae788bdc3ff46 5acb11da0c0f30c32088b0a5d6be795fa16a9268 a1adb856defdb0005ec0362ab1779ee2eaac2047 fe70e18403a6d1dafc35b104834b0a4f568fd97c 1a3e31f43d5f0ac9e5b4c23a9b230132c4971378
            python scripts/test-thpt-topic-w4-source-locked.py
            python scripts/test-thpt-topic-w4-shared-owner-delta.py --source-only
            node scripts/assemble-thpt-site.cjs
            python scripts/test-thpt-topic-rw1-math-browser.py --topic-w4-refresh
            python scripts/test-thpt-topic-w4-golden-browser.py --w4-refresh
            python scripts/test-thpt-topic-w4-shared-owner-delta.py
          elif [[ "${{ steps.impact.outputs.reason }}" == "OWNER_TOPIC_W3B_REFRESH" ]]; then
            git fetch --no-tags origin 2a39bf158d4a645888af00904095350020cc90df
            python scripts/test-thpt-topic-w3-source-locked.py --w3b
            node scripts/assemble-thpt-site.cjs
            python scripts/test-thpt-topic-rw1-math-browser.py --topic-w3b-refresh
            python scripts/test-thpt-topic-w3-golden-browser.py --w3b
          elif [[ "${{ steps.impact.outputs.reason }}" == "OWNER_TOPIC_W3A_REFRESH" ]]; then
            git fetch --no-tags origin 954053f0a5b3f7f8f19bfc01f4f974e9af844adb 7624c5fdce1d9ca3f1baea493eb12e8f8185758e 95fe0facb80c71663298f8a3fe685759fe96bac1
            python scripts/test-thpt-topic-w3-source-locked.py --w3a
            node scripts/assemble-thpt-site.cjs
            python scripts/test-thpt-topic-rw1-math-browser.py --topic-w3a-refresh
            python scripts/test-thpt-topic-w3-golden-browser.py --w3a
          elif [[ "${{ steps.impact.outputs.reason }}" == "OWNER_TOPIC_W2B_REFRESH" ]]; then
            git fetch --no-tags origin 7696b705c52a0d14d453083730cc9e0f9f3b2a9f 92eaf00e64b4bae1a35165926279407dc192759e 2b492772734431b37c9331f63dc6e7b23e314afe
            python scripts/test-thpt-topic-w2-source-locked.py --w2b
            node scripts/assemble-thpt-site.cjs
            python scripts/test-thpt-topic-rw1-math-browser.py --topic-w2b-refresh
            python scripts/test-thpt-topic-w2-golden-browser.py --w2b
          elif [[ "${{ steps.impact.outputs.reason }}" == "OWNER_TOPIC_W2A_REFRESH" ]]; then
            git fetch --no-tags origin d5c44c6f4dec50a2e04e867c74bbf08aab2ba582 b73c6bea5eb02508c26faa089e9b43700f5550b0 b3d22f4d9524f812d4e92584f379f3b0575f48ed
            python scripts/test-thpt-topic-w2-source-locked.py --w2a
            node scripts/assemble-thpt-site.cjs
            python scripts/test-thpt-topic-rw1-math-browser.py --topic-w2a-refresh
            python scripts/test-thpt-topic-w2-golden-browser.py --w2a
          elif [[ "${{ steps.impact.outputs.reason }}" == "OWNER_TOPIC_W1_REFRESH" ]]; then
            git fetch --no-tags origin e8e1efe7d119fa0e37f6d80100c9583de19ad757 9b6d3a1c7b599c559ccb0c2a0fea48f12365409f 62eb09df620af13313d8a17ea74c0922ae9c61aa 731dba42d606a5bc506516fe04eea5199f6d6360
            python scripts/test-thpt-topic-w1-source-locked.py
            node scripts/assemble-thpt-site.cjs
            python scripts/test-thpt-topic-rw1-math-browser.py --topic-w1-refresh
            python scripts/test-thpt-topic-w1-golden-browser.py --refresh
          elif [[ "${{ steps.impact.outputs.reason }}" == "OWNER_TOPIC01_REFRESH_CP10" ]]; then
            node scripts/assemble-thpt-site.cjs
            python scripts/test-thpt-topic-rw1-math-browser.py --topic01-refresh
            python scripts/test-thpt-topic01-release-browser.py --refresh
          elif [[ "${{ steps.impact.outputs.reason }}" == "OWNER_WRITTEN_LIBRARY_UI" ]]; then
            python scripts/test-thpt-topic-rw1-math-browser.py --written-library-only
          elif [[ "${{ steps.impact.outputs.reason }}" == "OWNER_TOPIC_BACK_TOP_R3" ]]; then
            python scripts/test-thpt-topic-rw1-math-browser.py --back-top-only
          elif [[ "${{ steps.impact.outputs.reason }}" == "OWNER_TOPIC_SGK_DISCLOSURES" ]]; then
            python scripts/test-thpt-topic-rw1-math-browser.py --disclosures-only
          elif [[ "${{ steps.impact.outputs.reason }}" == "OWNER_1055_RW3_TAB_LABELS" ]]; then
            python scripts/test-thpt-topic-rw1-math-browser.py --tabs-only
          elif [[ "${{ matrix.wave }}" == "rw2" ]]; then
            python scripts/test-thpt-topic-rw1-math-browser.py --rw2
          elif [[ "${{ matrix.wave }}" == "tail" ]]; then
            python scripts/test-thpt-topic-rw1-math-browser.py --tail
          else
            python scripts/test-thpt-topic-rw1-math-browser.py
          fi
