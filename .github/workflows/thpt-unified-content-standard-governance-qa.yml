name: THPT One Standard Governance QA (no release)

on:
  pull_request:
    branches: [main]
    paths:
      - 'prototypes/thpt/THPT_UNIFIED_LEARNING_CONTENT_STANDARD_v1.0_20261102.md'
      - 'scripts/test-thpt-unified-content-standard.cjs'
      - 'scripts/test-thpt-q18-self-qa-draft.cjs'
      - 'prototypes/thpt/standard-changes/Q18_SELF_QA_EVIDENCE_TEMPLATE_DRAFT_20261110.md'
      - 'prototypes/thpt/standard-changes/STANDARD_CHANGE_REQUEST_Q18_ENRICHMENT_SELF_VERIFICATION_20261110.md'
      - 'prototypes/thpt/standard-changes/07_THPT_NOTEBOOKLM_BATCH_AND_DELTA_REVIEW_POLICY_v1.2_DRAFT_20261110.md'
      - 'prototypes/thpt/standard-changes/Q18_G10_BASELINE_APPROVAL_SCOPE_AUDIT_R01_20261110.md'
      - 'prototypes/thpt/THPT_TWO_LANE_SOURCE_LOCKED_HANDOFF_CONTRACT_v2_20261102.md'
      - 'AGENTS.md'
      - 'prototypes/thpt/release-queue/README.md'
      - '.github/workflows/thpt-unified-content-standard-governance-qa.yml'

permissions:
  contents: read

jobs:
  one-standard-consistency:
    name: ONE standard Q01-Q18 is traceable by both lanes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax and negative fixtures
        run: |
          node --check scripts/test-thpt-unified-content-standard.cjs
          node scripts/test-thpt-unified-content-standard.cjs --self-test
      - name: Validate draft-only self-QA receipt schema with negative fixtures
        run: |
          node --check scripts/test-thpt-q18-self-qa-draft.cjs
          node scripts/test-thpt-q18-self-qa-draft.cjs --self-test
      - name: Validate one normative Q matrix and shared pointers
        run: node scripts/test-thpt-unified-content-standard.cjs
      - name: Guard - governance QA is not academic PASS or website release
        run: |
          echo "STANDARD_SCHEMA_PASS != ACADEMIC_PASS != PED_PASS != CONTENT_READY != RELEASE_READY"
          echo "No merge/deploy in this governance workflow."
