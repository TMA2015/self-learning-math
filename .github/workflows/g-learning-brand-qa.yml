name: G Learning branding QA

on:
  pull_request:
    paths:
      - 'docs/assets/branding/**'
      # G11 RELEASE AP1/AP2/AP5 source/display may affect the shared site shell.
      # Run this existing regression on every G11 learner-page integration, too.
      - 'docs/thpt-preview/sgk/lop-11/**'
      - 'docs/assets/javascripts/math-details-v1.js'
      - 'docs/assets/stylesheets/thpt-r4-preview.css'
      - 'mkdocs.yml'
      - 'scripts/test-g-learning-brand.js'
      - '.github/workflows/g-learning-brand-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate G Learning assets and Self-Learning Math identity
        run: node scripts/test-g-learning-brand.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Validate strict static build
        run: mkdocs build --strict
