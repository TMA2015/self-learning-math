name: THPT SGK 79 Editorial Governance Inventory (no deploy)

on:
  pull_request:
    paths:
      - "prototypes/thpt/standard-changes/STANDARD_CHANGE_REQUEST_SGK_79_FOUR_TAB_EDITORIAL_V31_20261112.md"
      - "prototypes/thpt/ux795/THPT_SGK_79_EDITORIAL_GOLDEN_OWNER_REVIEW_20261112.md"
      - "prototypes/thpt/ux795/Temp_THPT_SGK_79_Editorial_Golden_Review_20261112.html"
      - "scripts/audit-thpt-sgk-79-editorial.cjs"
      - ".github/workflows/thpt-sgk-editorial-governance-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thpt-sgk-editorial-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-79:
    name: Census 27+33+19 SGK lessons and source metadata (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check auditor syntax without editing learner pages
        run: node --check scripts/audit-thpt-sgk-79-editorial.cjs
      - name: Audit 79 source blobs, section numbering and tab structure
        run: node scripts/audit-thpt-sgk-79-editorial.cjs --out editorial-inventory
      - name: Verify report counts and owner gate remain explicit
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("node:fs"),assert=require("node:assert/strict");
          const r=JSON.parse(fs.readFileSync("editorial-inventory/Temp_THPT_SGK_79_Editorial_Inventory_20261112.json","utf8"));
          assert.equal(r.summary.lesson_count,79);
          assert.deepEqual(r.summary.classes,{"10":27,"11":33,"12":19});
          assert.equal(r.rows.length,79);
          assert.equal(r.summary.owner_gold_sample,"PENDING");
          assert.equal(r.summary.s1_verified_count,0);
          assert.equal(r.summary.unique_git_blobs,79);
          for(const row of r.rows)assert(/^[0-9a-f]{40}$/.test(row.blob));
          const sample=fs.readFileSync("prototypes/thpt/ux795/Temp_THPT_SGK_79_Editorial_Golden_Review_20261112.html","utf8");
          for(const label of ["1. Khám phá kiến thức","2. Kiến thức SGK","3. Ví dụ","4. Lỗi thường gặp"])
            assert(sample.includes(label),"Missing label "+label);
          assert(!sample.includes("firebase.initializeApp")&&!sample.includes("mastery.write"));
          console.log("PASS governance INVENTORY, 79 real SHA, GOLDEN = OWNER_PENDING, no academic or deployment assertions");
          NODE
      - name: Upload reproducible report (draft evidence, no deploy)
        uses: actions/upload-artifact@v4
        with:
          name: thpt-sgk-79-editorial-inventory-${{ github.sha }}
          path: |
            editorial-inventory/Temp_THPT_SGK_79_Editorial_Inventory_20261112.md
            editorial-inventory/Temp_THPT_SGK_79_Editorial_Inventory_20261112.json
          retention-days: 30
