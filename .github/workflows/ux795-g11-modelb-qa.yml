name: UX795 G11 Model B Knowledge QA (no deploy)
on:
  pull_request:
    paths:
      - "docs/thpt-preview/sgk/lop-11/chuong-*/bai-*.md"
      - "docs/assets/stylesheets/thpt-g11-knowledge-modelb-v1.css"
      - "docs/assets/javascripts/thpt-sgk-lesson-nav-v1.js"
      - "scripts/upgrade-g11-knowledge-modelb.cjs"
      - "scripts/test-ux795-g11-modelb-source.cjs"
      - "scripts/test-ux795-g11-knowledge-browser.cjs"
      - "prototypes/thpt/ux795/UX795_G11_B01_B33_ENRICHMENT_DELTA_RECEIPT_Q18_V301_20261112.md"
      - "mkdocs.yml"
      - "mkdocs.thpt-preview.yml"
      - ".github/workflows/ux795-g11-modelb-qa.yml"
permissions:
  contents: read
concurrency:
  group: ux795-g11-modelb-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check-33:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: python -m pip install --disable-pip-version-check mkdocs-material
      - name: Verify 33 baseline source SHA, unchanged math, original IDs and authored Q18 delta
        run: node scripts/test-ux795-g11-modelb-source.cjs
      - name: Build combined THPT preview without deploying
        run: mkdocs build --config-file mkdocs.thpt-preview.yml --site-dir site-thpt-preview
      - name: Install real Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Real browser 33 G11 Knowledge lessons at 390, 820 and 1440
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site-thpt-preview > /tmp/g11-modelb-http.log 2>&1 &
          python - <<'PY'
          import time,urllib.request
          u="http://127.0.0.1:8765/thpt-preview/sgk/lop-11/chuong-i/bai-1/"
          for _ in range(40):
              try:
                  with urllib.request.urlopen(u, timeout=3) as r:
                      if r.status == 200: break
              except Exception: time.sleep(.5)
          else: raise SystemExit("G11 browser server did not start")
          PY
          node scripts/test-ux795-g11-knowledge-browser.cjs
