name: SGK Golden First Paint QA (no deploy)
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/thpt-preview/sgk/lop-11/chuong-viii/bai-28.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-viii/bai-29.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-viii/bai-30.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-ix/bai-31.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-ix/bai-32.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-ix/bai-33.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-vii/bai-22.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-vii/bai-23.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-vii/bai-24.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-vii/bai-25.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-vii/bai-26.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-vii/bai-27.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-vi/bai-18.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-vi/bai-19.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-vi/bai-20.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-vi/bai-21.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-v/bai-15.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-v/bai-16.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-v/bai-17.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-iv/bai-10.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-iv/bai-11.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-iv/bai-12.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-iv/bai-13.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-iv/bai-14.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-ii/bai-5.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-ii/bai-6.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-ii/bai-7.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-iii/bai-8.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-iii/bai-9.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-i/bai-2.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-i/bai-3.md'
      - 'docs/thpt-preview/sgk/lop-11/chuong-i/bai-4.md'
      - 'hooks/sgk_golden_first_paint.py'
      - 'scripts/test-sgk-golden-first-paint.cjs'
      - 'scripts/test-thpt-sgk-lesson-nav-p2-browser.cjs'
      - 'scripts/test-thpt-academic-presentation-browser.cjs'
      - '.github/workflows/sgk-golden-first-paint-qa.yml'
      - 'mkdocs.yml'
      - 'docs/assets/javascripts/thpt-sgk-lesson-nav-v1.js'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-paint:
    name: Golden First Paint — exact delta or full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify exact #1039 W1/W2/W3/W4/W5/W6/W7 or retain full regression
        id: delta
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mode=FULL
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/first-paint-paths.txt"
            node scripts/test-thpt-release-impact.cjs --self-test
            env -u GITHUB_OUTPUT node scripts/test-thpt-release-impact.cjs "$RUNNER_TEMP/first-paint-paths.txt" > "$RUNNER_TEMP/first-paint-impact.txt"
            if grep -Fxq "impact=SCOPED_LESSON" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "changed_lessons=docs/thpt-preview/sgk/lop-11/chuong-i/bai-2.md,docs/thpt-preview/sgk/lop-11/chuong-i/bai-3.md,docs/thpt-preview/sgk/lop-11/chuong-i/bai-4.md" "$RUNNER_TEMP/first-paint-impact.txt"; then
              BEFORE_SHA="$BASE_SHA" SCOPED_LESSONS="docs/thpt-preview/sgk/lop-11/chuong-i/bai-2.md,docs/thpt-preview/sgk/lop-11/chuong-i/bai-3.md,docs/thpt-preview/sgk/lop-11/chuong-i/bai-4.md" node scripts/test-thpt-scoped-deploy-proof.cjs
              mode=G11_W1
            elif grep -Fxq "impact=SCOPED_LESSON" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "reason=OWNER_1039_W2_EXACT_SOURCE_AND_BROWSER" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "changed_lessons=docs/thpt-preview/sgk/lop-11/chuong-ii/bai-5.md,docs/thpt-preview/sgk/lop-11/chuong-ii/bai-6.md,docs/thpt-preview/sgk/lop-11/chuong-ii/bai-7.md,docs/thpt-preview/sgk/lop-11/chuong-iii/bai-8.md,docs/thpt-preview/sgk/lop-11/chuong-iii/bai-9.md" "$RUNNER_TEMP/first-paint-impact.txt"; then
              BEFORE_SHA="$BASE_SHA" SCOPED_LESSONS="docs/thpt-preview/sgk/lop-11/chuong-ii/bai-5.md,docs/thpt-preview/sgk/lop-11/chuong-ii/bai-6.md,docs/thpt-preview/sgk/lop-11/chuong-ii/bai-7.md,docs/thpt-preview/sgk/lop-11/chuong-iii/bai-8.md,docs/thpt-preview/sgk/lop-11/chuong-iii/bai-9.md" node scripts/test-thpt-scoped-deploy-proof.cjs
              mode=G11_W2
            elif grep -Fxq "impact=SCOPED_LESSON" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "reason=OWNER_1039_W3_EXACT_SOURCE_AND_BROWSER" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "changed_lessons=docs/thpt-preview/sgk/lop-11/chuong-iv/bai-10.md,docs/thpt-preview/sgk/lop-11/chuong-iv/bai-11.md,docs/thpt-preview/sgk/lop-11/chuong-iv/bai-12.md,docs/thpt-preview/sgk/lop-11/chuong-iv/bai-13.md,docs/thpt-preview/sgk/lop-11/chuong-iv/bai-14.md" "$RUNNER_TEMP/first-paint-impact.txt"; then
              BEFORE_SHA="$BASE_SHA" SCOPED_LESSONS="docs/thpt-preview/sgk/lop-11/chuong-iv/bai-10.md,docs/thpt-preview/sgk/lop-11/chuong-iv/bai-11.md,docs/thpt-preview/sgk/lop-11/chuong-iv/bai-12.md,docs/thpt-preview/sgk/lop-11/chuong-iv/bai-13.md,docs/thpt-preview/sgk/lop-11/chuong-iv/bai-14.md" node scripts/test-thpt-scoped-deploy-proof.cjs
              mode=G11_W3
            elif grep -Fxq "impact=SCOPED_LESSON" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "reason=OWNER_1039_W4_EXACT_SOURCE_AND_BROWSER" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "changed_lessons=docs/thpt-preview/sgk/lop-11/chuong-v/bai-15.md,docs/thpt-preview/sgk/lop-11/chuong-v/bai-16.md,docs/thpt-preview/sgk/lop-11/chuong-v/bai-17.md" "$RUNNER_TEMP/first-paint-impact.txt"; then
              BEFORE_SHA="$BASE_SHA" SCOPED_LESSONS="docs/thpt-preview/sgk/lop-11/chuong-v/bai-15.md,docs/thpt-preview/sgk/lop-11/chuong-v/bai-16.md,docs/thpt-preview/sgk/lop-11/chuong-v/bai-17.md" node scripts/test-thpt-scoped-deploy-proof.cjs
              mode=G11_W4
            elif grep -Fxq "impact=SCOPED_LESSON" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "reason=OWNER_1039_W5_EXACT_SOURCE_AND_BROWSER" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "changed_lessons=docs/thpt-preview/sgk/lop-11/chuong-vi/bai-18.md,docs/thpt-preview/sgk/lop-11/chuong-vi/bai-19.md,docs/thpt-preview/sgk/lop-11/chuong-vi/bai-20.md,docs/thpt-preview/sgk/lop-11/chuong-vi/bai-21.md" "$RUNNER_TEMP/first-paint-impact.txt"; then
              BEFORE_SHA="$BASE_SHA" SCOPED_LESSONS="docs/thpt-preview/sgk/lop-11/chuong-vi/bai-18.md,docs/thpt-preview/sgk/lop-11/chuong-vi/bai-19.md,docs/thpt-preview/sgk/lop-11/chuong-vi/bai-20.md,docs/thpt-preview/sgk/lop-11/chuong-vi/bai-21.md" node scripts/test-thpt-scoped-deploy-proof.cjs
              mode=G11_W5
            elif grep -Fxq "impact=SCOPED_LESSON" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "reason=OWNER_1039_W6_EXACT_SOURCE_AND_BROWSER" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "changed_lessons=docs/thpt-preview/sgk/lop-11/chuong-vii/bai-22.md,docs/thpt-preview/sgk/lop-11/chuong-vii/bai-23.md,docs/thpt-preview/sgk/lop-11/chuong-vii/bai-24.md,docs/thpt-preview/sgk/lop-11/chuong-vii/bai-25.md,docs/thpt-preview/sgk/lop-11/chuong-vii/bai-26.md,docs/thpt-preview/sgk/lop-11/chuong-vii/bai-27.md" "$RUNNER_TEMP/first-paint-impact.txt"; then
              BEFORE_SHA="$BASE_SHA" SCOPED_LESSONS="docs/thpt-preview/sgk/lop-11/chuong-vii/bai-22.md,docs/thpt-preview/sgk/lop-11/chuong-vii/bai-23.md,docs/thpt-preview/sgk/lop-11/chuong-vii/bai-24.md,docs/thpt-preview/sgk/lop-11/chuong-vii/bai-25.md,docs/thpt-preview/sgk/lop-11/chuong-vii/bai-26.md,docs/thpt-preview/sgk/lop-11/chuong-vii/bai-27.md" node scripts/test-thpt-scoped-deploy-proof.cjs
              mode=G11_W6
            elif grep -Fxq "impact=SCOPED_LESSON" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "reason=OWNER_1039_W7_EXACT_SOURCE_AND_BROWSER" "$RUNNER_TEMP/first-paint-impact.txt" && grep -Fxq "changed_lessons=docs/thpt-preview/sgk/lop-11/chuong-viii/bai-28.md,docs/thpt-preview/sgk/lop-11/chuong-viii/bai-29.md,docs/thpt-preview/sgk/lop-11/chuong-viii/bai-30.md,docs/thpt-preview/sgk/lop-11/chuong-ix/bai-31.md,docs/thpt-preview/sgk/lop-11/chuong-ix/bai-32.md,docs/thpt-preview/sgk/lop-11/chuong-ix/bai-33.md" "$RUNNER_TEMP/first-paint-impact.txt"; then
              BEFORE_SHA="$BASE_SHA" SCOPED_LESSONS="docs/thpt-preview/sgk/lop-11/chuong-viii/bai-28.md,docs/thpt-preview/sgk/lop-11/chuong-viii/bai-29.md,docs/thpt-preview/sgk/lop-11/chuong-viii/bai-30.md,docs/thpt-preview/sgk/lop-11/chuong-ix/bai-31.md,docs/thpt-preview/sgk/lop-11/chuong-ix/bai-32.md,docs/thpt-preview/sgk/lop-11/chuong-ix/bai-33.md" node scripts/test-thpt-scoped-deploy-proof.cjs
              mode=G11_W7
            fi
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check scoped source syntax
        run: |
          python -m py_compile hooks/sgk_golden_first_paint.py
          node --check scripts/test-sgk-golden-first-paint.cjs
          node --check scripts/test-thpt-sgk-lesson-nav-p2-browser.cjs
          node --check scripts/test-thpt-academic-presentation-browser.cjs
          node --check docs/assets/javascripts/thpt-sgk-lesson-nav-v1.js
      - name: Compile HTML
        run: |
          python -m pip install --disable-pip-version-check 'mkdocs-material>=9,<10'
          mkdocs build --config-file mkdocs.thpt-preview.yml --site-dir site-thpt-preview
      - name: Install Chromium for affected routes only
        if: steps.delta.outputs.mode == 'G11_W1' || steps.delta.outputs.mode == 'G11_W2' || steps.delta.outputs.mode == 'G11_W3' || steps.delta.outputs.mode == 'G11_W4' || steps.delta.outputs.mode == 'G11_W5' || steps.delta.outputs.mode == 'G11_W6' || steps.delta.outputs.mode == 'G11_W7'
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Install Chromium and Safari-compatible WebKit for full regression
        if: steps.delta.outputs.mode == 'FULL'
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Test Golden initial HTML, disabled JS and enabled JS
        env:
          SGK_FIRST_PAINT_BASE_URL: http://127.0.0.1:8765
          SGK_FIRST_PAINT_MODE: ${{ steps.delta.outputs.mode }}
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory site-thpt-preview >/tmp/sgk-first-paint-http.log 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(50):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8765/',timeout=2) as response:
                      if response.status==200: break
              except Exception: time.sleep(.5)
          else: raise SystemExit('SGK Golden server unavailable')
          PY
          node scripts/test-sgk-golden-first-paint.cjs
          if [[ "$SGK_FIRST_PAINT_MODE" == "FULL" ]]; then
            node scripts/test-thpt-sgk-lesson-nav-p2-browser.cjs
            node scripts/test-thpt-academic-presentation-browser.cjs
          fi
