name: THPT Topic W1 CĐ02–05 Golden Release QA (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/thpt-preview/chuyen-de/cd02/**'
      - 'docs/thpt-preview/chuyen-de/cd03/**'
      - 'docs/thpt-preview/chuyen-de/cd04/**'
      - 'docs/thpt-preview/chuyen-de/cd05/**'
      - 'docs/thpt-preview/chuyen-de/cd01/**'
      - 'docs/thpt-preview/chuyen-de/index.md'
      - 'docs/assets/visuals/THPT_TOPIC02_*.svg'
      - 'docs/assets/visuals/THPT_TOPIC03_*.svg'
      - 'docs/assets/visuals/THPT_TOPIC04_*.svg'
      - 'docs/assets/visuals/THPT_TOPIC05_*.svg'
      - 'docs/assets/stylesheets/thpt-topic-w1-golden-v1.css'
      - 'docs/assets/javascripts/thpt-topic-w1-golden-v1.js'
      - 'mkdocs.yml'
      - 'mkdocs.thpt-preview.yml'
      - 'scripts/test-thpt-topic-w1-source-locked.py'
      - 'scripts/test-thpt-topic-w1-golden-browser.py'
      - '.github/workflows/thpt-topic-w1-golden-release-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-browser:
    name: CĐ02–05 Q18/Q15/Q16 receipts and Golden browser (NO DEPLOY)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove exact disclosure-only change before delegating to shared component QA
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --no-renames --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/disclosure-paths.txt"
            node scripts/test-thpt-release-impact.cjs "$RUNNER_TEMP/disclosure-paths.txt"
            if grep -Fxq 'reason=OWNER_TOPIC_W1_REFRESH' "$GITHUB_OUTPUT"; then
              node scripts/test-thpt-release-impact.cjs --prove-topic-w1-refresh
            elif grep -Fxq 'reason=OWNER_TOPIC01_REFRESH_CP10' "$GITHUB_OUTPUT"; then
              node scripts/test-thpt-release-impact.cjs --prove-topic01-refresh
            elif grep -Fxq 'reason=OWNER_TOPIC_SGK_DISCLOSURES' "$GITHUB_OUTPUT"; then
              node scripts/test-thpt-release-impact.cjs --prove-topic-disclosures
            fi
          fi
      - name: Verify Topic-only runtime JS and original accepted AUTHORING source blobs
        if: steps.scope.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.scope.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.scope.outputs.reason != 'OWNER_TOPIC_W1_REFRESH'
        shell: bash
        run: |
          node --check docs/assets/javascripts/thpt-topic-w1-golden-v1.js
          git fetch --no-tags origin e8e1efe7d119fa0e37f6d80100c9583de19ad757 9b6d3a1c7b599c559ccb0c2a0fea48f12365409f 62eb09df620af13313d8a17ea74c0922ae9c61aa 731dba42d606a5bc506516fe04eea5199f6d6360
          python3 scripts/test-thpt-topic-w1-source-locked.py
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.scope.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.scope.outputs.reason != 'OWNER_TOPIC_W1_REFRESH'
        with:
          python-version: '3.12'
      - name: Prepare MkDocs and Chromium/WebKit scoped test runner
        if: steps.scope.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.scope.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.scope.outputs.reason != 'OWNER_TOPIC_W1_REFRESH'
        run: |
          python -m pip install --disable-pip-version-check mkdocs-material playwright==1.56.0
          python -m playwright install --with-deps chromium webkit
      - name: Build current site (no full-site test) + THPT dedicated nav
        if: steps.scope.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.scope.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.scope.outputs.reason != 'OWNER_TOPIC_W1_REFRESH'
        run: |
          mkdocs build --strict
          mkdocs build -f mkdocs.thpt-preview.yml --strict
      - name: Exercise ONLY four new Golden Topics, affected CĐ01 navigation and Q15/Q16
        if: steps.scope.outputs.reason != 'OWNER_TOPIC_SGK_DISCLOSURES' && steps.scope.outputs.reason != 'OWNER_TOPIC01_REFRESH_CP10' && steps.scope.outputs.reason != 'OWNER_TOPIC_W1_REFRESH'
        run: python scripts/test-thpt-topic-w1-golden-browser.py
