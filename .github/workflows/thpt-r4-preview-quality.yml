permissions:
  contents: read

# New commits supersede obsolete preview runs on the SAME pull request only.
# Never cancel checks belonging to another PR or to a published main commit.
concurrency:
  group: math-thpt-r4-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-only:
    name: Build R4 preview without deployment
    runs-on: ubuntu-latest
    # Full THPT+THCS cross-grade browser regression now exceeds 10 minutes;
    # retain ALL mandatory QA steps and allow source-locked preview completion.
    timeout-minutes: 40 # full R4 multi-device QA is ~25 min; no test omitted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Read immutable G11 baseline Git blobs for historical-source tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MkDocs Material
        run: python -m pip install 'mkdocs-material>=9,<10'
      - name: Check Model B 4-tab learner Knowledge source and negative layout fixtures
        run: |
          node --check scripts/test-thpt-knowledge-model-v3.cjs
          node scripts/test-thpt-knowledge-model-v3.cjs --self-test
          node scripts/test-thpt-knowledge-model-v3.cjs
      - name: Topic 3-page navigation, horizontal Knowledge tabs and negative UX fixtures
        run: |
          node --check scripts/test-thpt-topic-knowledge-tabs-v3.cjs
          node scripts/test-thpt-topic-knowledge-tabs-v3.cjs --self-test
          node scripts/test-thpt-topic-knowledge-tabs-v3.cjs
      - name: Check concise THPT Knowledge titles and protected route scope
        run: python scripts/test_thpt_knowledge_short_labels.py
      - name: Validate scoped THPT JavaScript syntax
        run: |
          node --check docs/assets/javascripts/thpt-g11-chv-b15-b17-source-locked-formative-r03.js
          node --check scripts/test-thpt-g11-chv-release-integration.cjs
          node --check scripts/test-thpt-g11-chv-browser-smoke.cjs
          node --check docs/assets/javascripts/thpt-g11-chvi-b18-b21-source-locked-formative-r01.js
          node --check scripts/test-thpt-g11-chvi-release-integration.cjs
          node --check scripts/test-thpt-g11-chvi-browser-smoke.cjs
          node --check docs/assets/javascripts/thpt-g11-chvii-b22-b27-source-locked-formative-r01.js
          node --check scripts/test-thpt-g11-chvii-release-integration.cjs
          node --check scripts/test-thpt-g11-chvii-browser-smoke.cjs
          node --check docs/assets/javascripts/thpt-g11-chviii-b28-b30-source-locked-formative-r00.js
          node --check scripts/test-thpt-g11-chviii-release-integration.cjs
          node --check scripts/test-thpt-g11-chviii-browser-smoke.cjs
          node --check docs/assets/javascripts/thpt-g11-chix-b31-b33-source-locked-formative-r00.js
          node --check scripts/test-thpt-g11-chix-release-integration.cjs
          node --check scripts/test-thpt-g11-chix-browser-smoke.cjs
          node --check docs/assets/javascripts/thpt-g11-chiv-b10-b14-source-locked-formative-r03.js
          node --check scripts/test-thpt-g11-chiv-release-integration.cjs
          node --check scripts/test-thpt-g11-chiv-browser-smoke.cjs
          node --check docs/assets/javascripts/thpt-g11-chiii-b08-b09-source-locked-formative-r03.js
          node --check docs/assets/javascripts/thpt-g11-reviewed-selfcheck-v1.js
          node --check scripts/test-thpt-g11-chiii-release-integration.cjs
          node --check scripts/test-thpt-g11-chiii-browser-smoke.cjs
          node --check docs/assets/javascripts/thpt-r4-preview.js
          node --check scripts/test-thpt-r4-sidebar-context-browser.cjs
          node --check docs/assets/javascripts/thpt-self-check-qa-v1.js
          node --check docs/assets/javascripts/thpt-g10-reviewed-selfcheck-v1.js
