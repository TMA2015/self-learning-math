      - name: Verify future Self-Learning Math rename compatibility (no rename/deploy)
        run: |
          node scripts/test-root-program-selector-v1.cjs
          node scripts/test-site-navigation-v1.js
          node scripts/test-self-learning-math-rename-preflight.cjs
          for js in             docs/assets/javascripts/sticky-nav-v1.js             docs/assets/javascripts/anchor-library-v1.js             docs/assets/javascripts/anchor-topic-related-v1.js             docs/assets/javascripts/model-examples-library-v1.js             docs/assets/javascripts/written-exercise-library-v1.js             docs/assets/javascripts/topic25-exam-engine-v1.js             docs/assets/javascripts/route-module-loader-v1.js             docs/assets/javascripts/route-module-loader-v2.js; do node --check "$js"; done
      - name: Guard AP presentation pilot source math and teaching content (no deploy)
        run: node scripts/test-thpt-academic-presentation-pilot.cjs
      - name: Guard G11 all SGK learner headings, numbering and math UI — existing and future chapters (no deploy)
        run: node scripts/test-thpt-g11-learner-presentation-source.cjs
      - name: Audit 359 G11 B01–B33 PUBLIC Core/Practice canonical source and math rendering scope
        run: node scripts/test-thpt-g11-core-practice-math-source.cjs
      - name: Guard G11 SGK pp99–109 original locked academic source and public canonical release
        run: node scripts/test-thpt-g11-supplement-release-source.cjs
      - name: Guard G12 SGK ChI original Academic/PED SOURCE SHA and 78 PUBLIC canonical learner records
        run: node scripts/test-thpt-g12-chi-release-source.cjs
      - name: Guard G12 SGK ChII original V2 receipt, 64 PUBLIC canonical, 16 END references and 3 original SVG
        run: node scripts/test-thpt-g12-chii-release-source.cjs
      - name: Guard G12 ChIII V2 Academic/PED source receipt, 48 canonical and 12 reused END refs
        run: node scripts/test-thpt-g12-chiii-source-lock.cjs
      - name: Guard G12 sidebar versus SGK overview, published chapter and lesson route parity
        run: node scripts/test-thpt-g12-overview-sidebar-parity.cjs
      - name: Enforce existing Golden R4 learner UI, no inline bulk questions and AI Tutor/Q16 boundary
