          node --check scripts/test-thpt-g12-exp01-exp02-release-source.cjs
          node --check scripts/test-thpt-g12-exp01-exp02-release-browser.cjs
      - name: Validate updated interactive THPT browser test syntax
        run: |
          node --check scripts/test-thpt-interactive-compact-browser.cjs
          node --check scripts/test-thpt-formative-actions-ui-browser.cjs
          node --check scripts/test-thpt-r4-public-formative-interaction.cjs
          node --check scripts/test-thpt-self-check-qa-browser.cjs
          node --check scripts/test-thpt-g10-reviewed-selfcheck-data.cjs
          node --check scripts/test-thpt-g10-reviewed-selfcheck-browser.cjs
