name: THPT Safe Main Push Deploy Scope QA (no deploy)

on:
  pull_request:
    paths:
      - '.github/workflows/deploy.yml'
      - 'scripts/test-thpt-push-deploy-scope.cjs'
      - 'scripts/test-thpt-scoped-deploy-proof.cjs'
      - 'scripts/test-thpt-release-impact.cjs'
      - '.github/workflows/thpt-deploy-scope-safety-qa.yml'

permissions:
  contents: read

jobs:
  deploy-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Strict syntax and positive/negative site change regression
        run: |
          node --check scripts/test-thpt-push-deploy-scope.cjs
          node scripts/test-thpt-push-deploy-scope.cjs --self-test
          node --check scripts/test-thpt-scoped-deploy-proof.cjs
          node scripts/test-thpt-scoped-deploy-proof.cjs --self-test
          node --check scripts/test-thpt-release-impact.cjs
          node scripts/test-thpt-release-impact.cjs --self-test
      - name: Preserve full original deploy gate signatures
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const w=fs.readFileSync('.github/workflows/deploy.yml','utf8');
          assert(/BEFORE_SHA:\s*\$\{\{\s*github\.event\.before\s*\}\}/.test(w),'Full main push base required');
          assert(/HEAD_SHA:\s*\$\{\{\s*github\.sha\s*\}\}/.test(w),'Full main push head required');
          const expr="$"+"{{";
          const fullIf="if: "+expr+" needs.release-scope.outputs.deploy == 'true' && needs.release-scope.outputs.impact != 'SCOPED_LESSON' && needs.release-scope.outputs.impact != 'SCOPED_TOPIC_W3' && needs.release-scope.outputs.impact != 'SCOPED_TOPIC_HOTFIX_W2_W3' && needs.release-scope.outputs.impact != 'SCOPED_TOPIC_W4' && needs.release-scope.outputs.impact != 'SCOPED_TOPIC_W5' && needs.release-scope.outputs.impact != 'SCOPED_TOPIC_W5_P1_HOTFIX' && needs.release-scope.outputs.impact != 'SCOPED_MATH_LAB_FULLPAGE' }}";
          const labIf="if: "+expr+" needs.release-scope.outputs.deploy == 'true' && needs.release-scope.outputs.impact == 'SCOPED_MATH_LAB_FULLPAGE' }}";
          assert(w.includes(labIf),"Math Lab 25 must have an exact-diff production lane");
          const lab=w.split('\n  deploy-scoped-math-lab-fullpage:\n')[1];
          assert(lab,"Math Lab 25 protected production job missing");
          for(const req of ['SCOPED_MATH_LAB_FULLPAGE','scripts/test-math-lab-25-release-intake.cjs',
            'scripts/test-math-lab-25-browser.py','node scripts/test-thpt-handoff-gate-v2.cjs',
            'node scripts/test-thpt-release-queue.cjs','mkdocs build --strict',
            'mkdocs build -f mkdocs.thpt-preview.yml --strict',
            'node scripts/assemble-thpt-site.cjs','ghp-import -n -p -f site'])
            assert(lab.includes(req),"Math Lab source/browser/assessment/build guard missing: "+req);
          const scopedIf="if: "+expr+" needs.release-scope.outputs.deploy == 'true' && needs.release-scope.outputs.impact == 'SCOPED_LESSON' && needs.release-scope.outputs.changed_lessons != '' }}";
          assert(w.includes(fullIf),'Original FULL release cannot execute on a scoped lesson');
          assert(w.includes(scopedIf),'Scoped release needs explicit single-lesson classified impact');
          const topicIf="if: "+expr+" needs.release-scope.outputs.deploy == 'true' && needs.release-scope.outputs.impact == 'SCOPED_TOPIC_W3' }}";
          assert(w.includes(topicIf),"W3 release must run only for exact signed Topic impact");
          const w4If="if: "+expr+" needs.release-scope.outputs.deploy == 'true' && needs.release-scope.outputs.impact == 'SCOPED_TOPIC_W4' }}";
          assert(w.includes(w4If),"W4 exact 3-Topic main-push scoped release lane missing");
          const w4=w.split('\n  deploy-scoped-topic-w4:\n')[1];
          assert(w4,'Dedicated W4 publish job missing');
          for(const req of ['SCOPED_TOPIC_W4','scripts/test-thpt-topic-w4-source-locked.py',
             'scripts/test-thpt-topic-w4-golden-browser.py',
             'W4_CD16_18_SOURCE_INTAKE_20261123.json','PUBLIC_REPLAY_ONLY',
             'mkdocs build --strict','mkdocs build -f mkdocs.thpt-preview.yml --strict',
             'node scripts/assemble-thpt-site.cjs','ghp-import -n -p -f site'])
            assert(w4.includes(req),'W4 source/Q18/browser/production guard missing '+req);
          const w5If="if: "+expr+" needs.release-scope.outputs.deploy == 'true' && (needs.release-scope.outputs.impact == 'SCOPED_TOPIC_W5' || needs.release-scope.outputs.impact == 'SCOPED_TOPIC_W5_P1_HOTFIX') }}";
          assert(w.includes(w5If),"W5 exact 4-Topic main-push scoped lane missing");
          const w5=w.split('\n  deploy-scoped-topic-w5:\n')[1];
          assert(w5,'Dedicated W5 publish job missing');
          for(const req of ['SCOPED_TOPIC_W5','SCOPED_TOPIC_W5_P1_HOTFIX',
             'node scripts/test-thpt-release-impact.cjs --self-test',
             'scripts/test-thpt-topic-w5-source-intake.py',
             'scripts/test-thpt-topic-w5-source-locked.py',
             'scripts/test-thpt-topic-w5-golden-browser.py',
             'W5_CD19_22_SOURCE_INTAKE_20261123.json','PUBLIC_REPLAY_ONLY',
             'mkdocs build --strict','mkdocs build -f mkdocs.thpt-preview.yml --strict',
             'node scripts/assemble-thpt-site.cjs','ghp-import -n -p -f site'])
            assert(w5.includes(req),'W5 source/Q18/Q15/Q16/browser/production guard missing '+req);
          const hotfixIf="if: "+expr+" needs.release-scope.outputs.deploy == 'true' && needs.release-scope.outputs.impact == 'SCOPED_TOPIC_HOTFIX_W2_W3' }}";
          assert(w.includes(hotfixIf),'Exact CĐ06–15 hotfix must use separate protected deploy lane');
          const hotfix=w.split('\n  deploy-scoped-topic-w2w3-hotfix:\n')[1];
          assert(hotfix,'Missing dedicated CĐ06–15 postpublish lane');
          for(const req of ['scripts/test-thpt-topic-w2-source-locked.py',
             'scripts/test-thpt-topic-w3-source-locked.py',
             'scripts/test-thpt-topic-w2-golden-browser.py',
             'scripts/test-thpt-topic-w3-golden-browser.py',
             'SCOPED_TOPIC_HOTFIX_W2_W3','PUBLIC_REPLAY_ONLY',
             'mkdocs build --strict','node scripts/assemble-thpt-site.cjs',
             'ghp-import -n -p -f site'])
             assert(hotfix.includes(req),'Source/Q16/browser gate missing from hotfix lane: '+req);

          assert(w.includes('impact: '+expr+' steps.scope.outputs.impact }}')&&
            w.includes('changed_lessons: '+expr+' steps.scope.outputs.changed_lessons }}'),
            'Scope classifier outputs required before any deploy branch');
          const scoped=w.split('\n  deploy-scoped-lesson:\n')[1];
          assert(scoped,'Dedicated scoped publish job must exist');
          const topic=w.split('\n  deploy-scoped-topic-w3:\n')[1];
          assert(topic,'Dedicated owner-authorized W3 publish job must exist');
          for(const required of ['scripts/test-thpt-topic-w3-source-locked.py',
            'scripts/test-thpt-topic-w3-golden-browser.py',
            'SCOPED_TOPIC_W3','mkdocs build --strict',
            'mkdocs build -f mkdocs.thpt-preview.yml --strict',
            'node scripts/assemble-thpt-site.cjs',
            'PUBLIC_REPLAY_ONLY','ghp-import -n -p -f site']) {
            assert(topic.includes(required),'W3 source/Q16/Golden publish gate removed: '+required);
          }
          const full=w.split('\n  deploy:\n')[1]?.split('\n  deploy-scoped-lesson:\n')[0];
          assert(full,'Original full deploy gate must remain available for shared changes');
          for(const required of ['scripts/test-thpt-scoped-deploy-proof.cjs',
             'scripts/test-thpt-scoped-lesson-browser.cjs',
             'SCOPED_LESSONS: '+expr+' needs.release-scope.outputs.changed_lessons }}',
             'node scripts/test-thpt-chvi-reviewed-formative.cjs',
             'node scripts/test-thpt-g10-reviewed-selfcheck-data.cjs',
             'node scripts/guard-w9-candidate-publication-r1.js --deploy',
             'mkdocs build --strict',
             'mkdocs build -f mkdocs.thpt-preview.yml --strict',
             'node scripts/assemble-thpt-site.cjs',
             'ghp-import -n -p -f site']){
             assert(scoped.includes(required),'Scoped release gate removed: '+required);
          }
          for(const s of ['scripts/test-thpt-release-queue.cjs','scripts/test-thpt-g10-chvi-full-r04-release.cjs',
            'scripts/test-thpt-g10-chiv-full-r04-release.cjs','scripts/test-thpt-g12-chvi-release-source.cjs',
            'node scripts/test-thpt-static-release.cjs','python check_roadmap_dependencies.py']){
            assert(full.includes(s),'Original FULL production regression guard removed: '+s);
          }
          const queueStep=w.indexOf('Protect release-queue manifest and REGISTER even on metadata-only main pushes');
          const classificationStep=w.indexOf('Assert safe push-scope classifier and classify FULL main push');
          assert(queueStep>0 && classificationStep>queueStep,'Ready/REGISTER guard must run before any no-deploy classification');
          assert(w.slice(queueStep,classificationStep).includes('node scripts/test-thpt-release-queue.cjs'),'Ready/REGISTER preflight cannot be skipped');
          const v2Step=w.indexOf('Enforce V2 source/receipt SHA of any new READY packet even when no site deployment');
          assert(v2Step>queueStep && v2Step<classificationStep,'V2 source lock must precede metadata-only deploy skip');
          assert(w.slice(v2Step,classificationStep).includes('node scripts/test-thpt-handoff-gate-v2.cjs'),'New V2 READY receipt SHA cannot be skipped');

          assert(!w.includes('continue-on-error:'),'No failures may be ignored');
          console.log('PASS deploy safety: six mutually exclusive FULL, SGK-scoped, W3, W4, W5 and W2+W3 maintenance lanes, source/receipt + Q16/built-site guards, unchanged FULL regression signatures.');
          NODE
      - name: Evidence boundary
        run: |
          echo 'This verifies deployment scope logic only; not a site publication or owner approval.'
