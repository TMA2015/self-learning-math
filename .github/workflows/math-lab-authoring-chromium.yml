name: Math Lab Authoring Chromium QA (NO DEPLOY)
on:
  push:
    branches:
      - authoring/math-lab-topic21-topic22-registry-r01-20261117
    paths:
      - prototypes/thpt/content-drafts/interactive-models/selected/**
      - prototypes/thpt/content-drafts/interactive-models/qa/mathlab_chromium_all25.py
      - .github/workflows/math-lab-authoring-chromium.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-models:
    name: Source-locked 25-model Chromium / no release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser QA dependency
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify exact SHA, math/interaction and mobile/desktop UI
        run: python prototypes/thpt/content-drafts/interactive-models/qa/mathlab_chromium_all25.py
      - name: Retain reports and screenshots on PASS or HOLD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Temp_MathLab_25_Chromium_Evidence
          path: artifacts/math-lab-chromium/
          if-no-files-found: warn
          retention-days: 14
