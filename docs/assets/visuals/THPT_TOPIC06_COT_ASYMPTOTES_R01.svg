<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Đồ thị y = cot x trên hai nhánh liên tiếp</title>
<desc id="desc">Côtang không xác định tại các bội của pi. Hai nhánh từ âm pi đến 0 và từ 0 đến pi đều giảm, qua điểm có tung độ 0 tại âm pi chia hai và pi chia hai. Các đường cong bị cắt ở biên vùng vẽ; không nối qua tiệm cận.</desc>
