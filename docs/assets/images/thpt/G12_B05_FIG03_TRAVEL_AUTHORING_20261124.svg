<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 280" role="img" aria-labelledby="t d"><title id="t">Chọn điểm lên bờ để thời gian nhỏ nhất</title><desc id="d">A và C đối diện qua sông rộng 3 km; C đến B dài 8 km; D nằm giữa C và B, CD=x, DB=8−x, AD bằng căn của 9 cộng x bình phương.</desc><rect width="650" height="280" rx="10" fill="white"/><rect x="45" y="70" width="560" height="135" fill="#e0f1fa"/><path d="M45 70H605 M45 205H605" stroke="#4c7a85" stroke-width="3"/><path d="M105 205V70" stroke="#6b8492" stroke-width="2" stroke-dasharray="5 4"/><path d="M105 205L330 70" stroke="#1773a1" stroke-width="4"/><path d="M330 70H545" stroke="#ab552f" stroke-width="4"/><path d="M105 86h15v-16" fill="none" stroke="#52697b" stroke-width="1.5"/><g fill="#23445d" font-family="sans-serif" font-size="17"><circle cx="105" cy="205" r="5"/><circle cx="105" cy="70" r="5"/><circle cx="330" cy="70" r="5"/><circle cx="545" cy="70" r="5"/><text x="92" y="229">A</text><text x="98" y="55">C</text><text x="325" y="55">D</text><text x="540" y="55">B</text><text x="67" y="142">3 km</text><text x="211" y="49" text-anchor="middle">x km</text><text x="440" y="49" text-anchor="middle">8 − x km</text><text x="219" y="153" fill="#1773a1">Chèo: √(9+x²)</text><text x="390" y="95" fill="#ab552f">Chạy bộ</text><text x="325" y="257" text-anchor="middle">0 ≤ x ≤ 8; hình minh họa không theo tỉ lệ.</text></g></svg>