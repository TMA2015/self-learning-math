<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 405" role="img" aria-labelledby="t d"><title id="t">Hai hướng trong mặt phẳng và pháp tuyến</title><desc id="d">Mặt phẳng z=x+y qua O, hai vectơ u=(1;0;1), v=(0;1;1), pháp tuyến n=(-1;-1;1). Phối cảnh affine, các tích vô hướng bằng 0.</desc><rect width="670" height="405" rx="10" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b9b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b25c32"/></marker></defs><g font-family="sans-serif" fill="#25445a"><text x="20" y="29" font-size="20" font-weight="bold">Hai hướng độc lập xác định phương của mặt phẳng</text><polygon points="268.4,289.6 432.55,181.8 334.55,76.45000000000005 170.4,184.25" fill="#deedf2" stroke="#7299ad" stroke-width="2"/><g fill="none" stroke-width="3.5"><path d="M290 220L357 176" stroke="#176b9b" marker-end="url(#a)"/><path d="M290 220L250 177" stroke="#176b9b" marker-end="url(#a)"/><path d="M290 220L263 103" stroke="#b25c32" marker-end="url(#b)"/></g><circle cx="290" cy="220" r="4" fill="#25445a"/><g font-size="16"><text x="300" y="241">O</text><text x="365" y="178" fill="#176b9b">u</text><text x="230" y="184" fill="#176b9b">v</text><text x="259" y="93" fill="#b25c32">n</text><text x="98" y="308">(P): z=x+y</text></g><g font-size="16"><text x="441" y="94" font-weight="bold">u = (1;0;1)</text><text x="441" y="122" font-weight="bold">v = (0;1;1)</text><text x="441" y="164" fill="#b25c32" font-weight="bold">n = (−1;−1;1)</text><text x="441" y="207">n·u = −1+1 = 0</text><text x="441" y="233">n·v = −1+1 = 0</text><text x="441" y="280">u, v không cùng phương</text><text x="20" y="387" font-size="14">Phối cảnh chỉ minh họa; kiểm vuông góc bằng tích vô hướng, không đo góc trên hình.</text></g></g></svg>