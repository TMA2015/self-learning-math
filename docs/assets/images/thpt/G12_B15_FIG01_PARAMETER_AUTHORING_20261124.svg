<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img" aria-labelledby="t d"><title id="t">Một tham số xác định một điểm</title><desc id="d">Đường qua A(1;2;3) có hướng (2;-1;1). Các điểm ứng với t=-1,0,1,2 lần lượt là (-1;3;2),(1;2;3),(3;1;4),(5;0;5). Hình chiếu affine trên giấy.</desc><rect width="680" height="280" fill="white" rx="10"/><g font-family="sans-serif" fill="#23445d"><text x="20" y="30" font-size="20" font-weight="bold">Đi dọc một đường, dùng cùng một t</text><path d="M54 206L626 63" stroke="#176b9b" stroke-width="3"/><path d="M614 60l12 3 -9 9" fill="none" stroke="#176b9b" stroke-width="2"/><g fill="#176b9b"><circle cx="67" cy="202.75" r="5"/><circle cx="212" cy="166.5" r="5"/><circle cx="357" cy="130.25" r="5"/><circle cx="502" cy="94" r="5"/></g><g text-anchor="middle" font-size="15"><text x="67" y="189.75">t=-1</text><text x="67" y="227.75">(-1;3;2)</text><text x="212" y="153.5">t=0</text><text x="212" y="191.5">(1;2;3)</text><text x="357" y="117.25">t=1</text><text x="357" y="155.25">(3;1;4)</text><text x="502" y="81">t=2</text><text x="502" y="119">(5;0;5)</text></g><path d="M212 166.5L357 130.25" stroke="#b25c32" stroke-width="4"/><path d="M344 128l13 2 -10 10" fill="none" stroke="#b25c32" stroke-width="2.5"/><text x="280" y="112" text-anchor="middle" font-size="16" fill="#b25c32">u=(2;−1;1)</text><text x="20" y="251" font-size="15">M(t)=(1+2t; 2−t; 3+t). Một giá trị t cho cả ba tọa độ.</text><text x="20" y="270" font-size="13">Hình chiếu minh họa vị trí tương đối, không dùng để đo độ dài.</text></g></svg>