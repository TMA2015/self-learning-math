<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="860" height="480" role="img" aria-labelledby="title desc">
<title id="title">Định lí Thalès trong không gian với ba mặt phẳng song song</title>
<desc id="desc">Ba mặt phẳng P, Q, R song song từ trên xuống, mặt Q nằm giữa. Hai đường thẳng cắt cả ba mặt lần lượt tại A B C và A phẩy B phẩy C phẩy. Các đoạn tương ứng trên hai cát tuyến tỉ lệ AB trên BC bằng A phẩy B phẩy trên B phẩy C phẩy.</desc>
<rect width="860" height="480" rx="18" fill="#fff"/>
<text x="430" y="36" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#183453">Thalès trong không gian: ba mặt phẳng song song</text>
<polygon points="112,133 706,133 770,84 176,84" fill="#dcfce7" fill-opacity=".85" stroke="#5b9275" stroke-width="2"/>
<polygon points="112,251 706,251 770,202 176,202" fill="#dbeafe" fill-opacity=".85" stroke="#5881af" stroke-width="2"/>
<polygon points="112,369 706,369 770,320 176,320" fill="#f8ead0" fill-opacity=".85" stroke="#b28f54" stroke-width="2"/>
<line x1="271" y1="65" x2="377" y2="418" stroke="#a34231" stroke-width="3.6"/>
<line x1="519" y1="65" x2="634" y2="418" stroke="#285b9f" stroke-width="3.6"/>
<g font-family="Arial,sans-serif" font-size="20" font-weight="700">
<circle cx="282" cy="103" r="5.5" fill="#a34231"/><text x="260" y="102" fill="#9e3b2b">A</text>
<circle cx="318" cy="221" r="5.5" fill="#a34231"/><text x="290" y="219" fill="#9e3b2b">B</text>
<circle cx="354" cy="339" r="5.5" fill="#a34231"/><text x="324" y="341" fill="#9e3b2b">C</text>
<circle cx="531" cy="103" r="5.5" fill="#285b9f"/><text x="541" y="99" fill="#1c5188">A′</text>
<circle cx="570" cy="221" r="5.5" fill="#285b9f"/><text x="581" y="218" fill="#1c5188">B′</text>
<circle cx="608" cy="339" r="5.5" fill="#285b9f"/><text x="619" y="338" fill="#1c5188">C′</text>
<text x="730" y="126" fill="#336f55">(P)</text>
<text x="730" y="244" fill="#315a87">(Q)</text>
<text x="730" y="360" fill="#806231">(R)</text>
</g>
<text x="430" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#27455f">AB / BC = A′B′ / B′C′</text>
</svg>