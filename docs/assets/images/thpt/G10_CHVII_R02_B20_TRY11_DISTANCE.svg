<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"><title>B20 · Khoảng cách từ điểm đến đường thẳng</title><desc>M0=(0,0), Δ:3x+4y−5=0, chân H=(3/5,4/5), M0H=1, pháp tuyến (3,4) cùng phương với HM0.</desc><rect width="760" height="430" fill="#ffffff"/><g font-family="Arial,DejaVu Sans,sans-serif" fill="#17324d"><text x="30" y="35" font-size="21" fill="#17324d" font-weight="bold" text-anchor="start">B20 · Vì sao đo theo đoạn vuông góc?</text><line x1="96" y1="50" x2="436" y2="305" stroke="#2667ad" stroke-width="4" /><line x1="170" y1="306" x2="266" y2="178" stroke="#d66b28" stroke-width="4" /><line x1="170" y1="306" x2="377" y2="263" stroke="#677b8e" stroke-width="1.8" stroke-dasharray="7 6"/><circle cx="170" cy="306" r="6" fill="#17324d"/><circle cx="266" cy="178" r="6" fill="#17324d"/><polyline points="257,190 269,199 278,187" fill="none" stroke="#17324d" stroke-width="2"/><line x1="266" y1="178" x2="326" y2="98" stroke="#167e70" stroke-width="3" /><text x="120" y="340" font-size="18" fill="#17324d" font-weight="normal" text-anchor="start">M₀ (0;0)</text><text x="281" y="166" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">H (3/5;4/5)</text><text x="304" y="96" font-size="17" fill="#167e70" font-weight="bold" text-anchor="start">n=(3;4)</text><text x="427" y="306" font-size="16" fill="#2667ad" font-weight="normal" text-anchor="start">Δ: 3x+4y−5=0</text><text x="450" y="191" font-size="19" fill="#17324d" font-weight="bold" text-anchor="start">M₀H ⟂ Δ</text><text x="450" y="229" font-size="18" fill="#17324d" font-weight="bold" text-anchor="start">d(M₀,Δ)=M₀H=1</text><text x="450" y="268" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">H nằm trên Δ</text><text x="450" y="311" font-size="16" fill="#167e70" font-weight="normal" text-anchor="start">n cùng phương HM₀</text><text x="30" y="405" font-size="14" fill="#677b8e" font-weight="normal" text-anchor="start">H là hình chiếu vuông góc: đoạn M₀H ngắn nhất trong các đoạn nối M₀ tới Δ.</text></g></svg>