<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-labelledby="ttl ds"><title id="ttl">Đồng dạng trong khối chóp</title><desc id="ds">Tứ giác mặt cắt nằm chính giữa các đoạn nối đỉnh với bốn đỉnh đáy, do đó cạnh bằng nửa cạnh đáy.</desc><rect width="840" height="470" rx="18" fill="#f6fafb"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="28" y="38" font-size="25" fill="#17324d" font-weight="bold">Đồng dạng trong khối chóp</text><polygon points="230,340 525,340 625,260 330,260" fill="#d9e7ee" stroke="#17324d" stroke-width="2" /><polygon points="410,75 230,340 525,340" fill="#e0edf3" stroke="#8a9dae" stroke-width="2" fill-opacity=".5"/><polygon points="410,75 525,340 625,260" fill="#d4e6f0" stroke="#8a9dae" stroke-width="2" fill-opacity=".5"/><line x1="410" y1="75" x2="230" y2="340" stroke="#516e80" stroke-width="2" /><line x1="410" y1="75" x2="525" y2="340" stroke="#516e80" stroke-width="2" /><line x1="410" y1="75" x2="625" y2="260" stroke="#516e80" stroke-width="2" /><line x1="410" y1="75" x2="330" y2="260" stroke="#516e80" stroke-width="2" stroke-dasharray="6 5"/><polygon points="320,207.5 467.5,207.5 517.5,167.5 370,167.5" fill="#91cdb4" stroke="#23835c" stroke-width="3" fill-opacity=".9"/><line x1="680" y1="75" x2="680" y2="300" stroke="#17324d" stroke-width="2" /><line x1="672" y1="75" x2="688" y2="75" stroke="#17324d" stroke-width="2" /><line x1="672" y1="187.5" x2="688" y2="187.5" stroke="#17324d" stroke-width="2" /><line x1="672" y1="300" x2="688" y2="300" stroke="#17324d" stroke-width="2" /><text x="691" y="83" font-size="17" fill="#17324d" >đỉnh</text><text x="691" y="193" font-size="17" fill="#23835c" >h/2</text><text x="691" y="306" font-size="17" fill="#17324d" >h</text><text x="290" y="384" font-size="19" fill="#17324d" >Đáy vuông: cạnh a</text><text x="224" y="182" font-size="19" fill="#23835c" >Lát: cạnh a/2</text><text x="430" y="70" font-size="18" fill="#17324d" >Đỉnh</text><text x="28" y="443" font-size="17" fill="#17324d" >Tỉ số cạnh x/h; tỉ số diện tích (x/h)². Hình phối cảnh không dùng đo độ dài.</text></g></svg>