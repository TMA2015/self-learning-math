<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-labelledby="ttl ds"><title id="ttl">Mặt cắt vuông thay đổi theo x</title><desc id="ds">Khối minh họa có mặt cắt vuông tại x=0,1,2 với cạnh 2,3,4; cùng phép chiếu, các mặt song song.</desc><rect width="840" height="470" rx="18" fill="#f6fafb"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="28" y="38" font-size="25" fill="#17324d" font-weight="bold">Mặt cắt vuông thay đổi theo x</text><polygon points="144.2,240.2 513.4,180.4 636.6,180.4 205.8,240.2" fill="#dcebf3" stroke="#8096a5" stroke-width="2" /><polygon points="205.8,240.2 636.6,180.4 636.6,259.6 205.8,279.8" fill="#c6ddeb" stroke="#8096a5" stroke-width="2" /><polygon points="144.2,240.2 205.8,240.2 205.8,279.8 144.2,279.8" fill="#eff6fa" stroke="#637f93" stroke-width="2" /><polygon points="513.4,180.4 636.6,180.4 636.6,259.6 513.4,259.6" fill="#dae9f4" stroke="#637f93" stroke-width="2" /><polygon points="328.8,210.3 421.2,210.3 421.2,269.7 328.8,269.7" fill="#91cdb4" stroke="#23835c" stroke-width="3" fill-opacity=".85"/><line x1="100" y1="260" x2="700" y2="200" stroke="#17324d" stroke-width="2" stroke-dasharray="7 5"/><text x="130" y="340" font-size="18" fill="#17324d" >x=0; cạnh 2</text><text x="330" y="345" font-size="18" fill="#23835c" >x=1; cạnh 3</text><text x="540" y="345" font-size="18" fill="#17324d" >x=2; cạnh 4</text><text x="315" y="125" font-size="22" fill="#23835c" >Lát cắt vuông S(x)=(2+x)²</text><text x="28" y="443" font-size="17" fill="#17324d" >Diện tích lát cắt là (2+x)², không phải 2+x; nhân độ dày dx.</text></g></svg>