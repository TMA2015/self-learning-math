<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 350" role="img" aria-labelledby="t d"><title id="t">Tọa độ vectơ là độ thay đổi có dấu</title><desc id="d">A có tọa độ âm 1, 1, 2; B có tọa độ 2, âm 1, 1. Đi từ A cộng 3 theo Ox, trừ 2 theo Oy, trừ 1 theo Oz tới B.</desc><rect width="670" height="350" rx="10" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b9b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8d6236"/></marker></defs><g font-family="sans-serif" fill="#20394d"><text x="20" y="30" font-size="21" font-weight="bold">Từ điểm A đến điểm B</text><g fill="none" stroke="#8d6236" stroke-width="2.8" stroke-dasharray="6 4" marker-end="url(#b)"><path d="M120 153L324 225"/><path d="M324 225L408 163"/><path d="M408 163L408 219"/></g><g fill="none" stroke="#176b9b" stroke-width="3.6" marker-end="url(#a)"><path d="M120 153L408 219"/></g><circle cx="120" cy="153" r="4.8" fill="#176b9b"/><circle cx="408" cy="219" r="4.8" fill="#176b9b"/><g font-size="17"><text x="45" y="141">A(−1;1;2)</text><text x="416" y="235">B(2;−1;1)</text><text x="212" y="215" fill="#8d6236">+3 theo Ox</text><text x="374" y="186" fill="#8d6236">−2 theo Oy</text><text x="418" y="195" fill="#8d6236">−1 theo Oz</text><text x="199" y="139" fill="#176b9b">AB</text></g><g transform="translate(565 100)" font-size="14" stroke="#607687" fill="none"><path d="M0 0l48 17m-48 -17l-30 22m30 -22v-40" stroke-width="2"/><g fill="#607687" stroke="none"><text x="50" y="20">x</text><text x="-40" y="30">y</text><text x="7" y="-38">z</text></g></g><rect x="20" y="293" width="630" height="41" rx="6" fill="#eef5f9"/><text x="34" y="319" font-size="18">AB: (2−(−1); −1−1; 1−2) = (3; −2; −1)</text></g></svg>