<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" role="img" aria-labelledby="t d"><title id="t">Miền tam giác quay quanh Ox thành khối nón</title><desc id="d">Miền từ x=0 đến 4 giữa y=x/2 và Ox. Lát đứng ở x=3 dài 1,5; quay quanh Ox tạo đĩa bán kính 1,5. Công thức diện tích đĩa là π(x/2)².</desc><rect width="680" height="360" rx="10" fill="white"/><g font-family="sans-serif" fill="#23445d"><text x="20" y="30" font-size="20" font-weight="bold">Quay đoạn đứng quanh trục thành đĩa tròn</text><text x="25" y="61" font-size="16" font-weight="bold">Miền phẳng</text><path d="M47 246L247 146V246Z" fill="#b9dfd3"/><path d="M47 246L247 146" stroke="#176b9b" stroke-width="3"/><path d="M247 146V246" stroke="#607989" stroke-dasharray="5 4"/><path d="M30 246H278l-7 -4m7 4l-7 4 M47 270V111l-4 7m4 -7l4 7" stroke="#607989" stroke-width="1.6" fill="none"/><path d="M197 246V171" stroke="#aa552f" stroke-width="4"/><g font-size="15"><text x="38" y="266">O</text><text x="197" y="266" text-anchor="middle">3</text><text x="247" y="266" text-anchor="middle">4</text><text x="283" y="250">x</text><text x="54" y="111">y</text><text x="161" y="151">y=x/2</text><text x="205" y="207" fill="#aa552f">1,5</text></g><path d="M287 196h48l-8 -5m8 5l-8 5" stroke="#607989" fill="none" stroke-width="2"/><text x="292" y="182" font-size="14">quay</text><text x="350" y="61" font-size="16" font-weight="bold">Khối nón và thiết diện</text><path d="M356 202L588 102L588 302Z" fill="#dcebf2"/><ellipse cx="588" cy="202" rx="25" ry="100" fill="#c6dfeb" stroke="#527c93" stroke-width="2"/><path d="M356 202L588 102 M356 202L588 302" stroke="#527c93" stroke-width="2" fill="none"/><ellipse cx="530" cy="202" rx="18.75" ry="75" fill="#b9dfd3" stroke="#21836c" stroke-width="2.5"/><path d="M356 202H630l-8 -4m8 4l-8 4" stroke="#607989" stroke-dasharray="5 4" fill="none"/><path d="M530 202V127" stroke="#aa552f" stroke-width="3.5"/><circle cx="530" cy="202" r="3.5" fill="#aa552f"/><text x="540" y="163" font-size="15" fill="#aa552f">r=1,5</text><text x="527" y="117" font-size="14" text-anchor="middle">đĩa tại x=3</text><text x="634" y="207" font-size="15">x</text><text x="20" y="327" font-size="16" font-weight="bold">Mỗi đĩa có bán kính r(x)=x/2, diện tích S(x)=π(x/2)².</text><text x="20" y="347" font-size="14">Hình elip chỉ là cách vẽ mặt tròn trong phối cảnh.</text></g></svg>