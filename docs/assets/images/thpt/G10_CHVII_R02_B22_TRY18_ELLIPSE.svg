<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"><title>B22 · Elip từ dây căng và hai tiêu điểm</title><desc>Tổng MF1+MF2=2a không đổi và điều kiện elip không suy biến 2a>2c>0.</desc><rect width="760" height="430" fill="#ffffff"/><g font-family="Arial,DejaVu Sans,sans-serif" fill="#17324d"><text x="27" y="35" font-size="21" fill="#17324d" font-weight="bold" text-anchor="start">B22 · Elip từ hai đinh và sợi dây</text><ellipse cx="345" cy="240" rx="160" ry="124.90" fill="#f5fbff" stroke="#2667ad" stroke-width="3"/><line x1="245" y1="240" x2="436.76319777159307" y2="137.68300591310845" stroke="#167e70" stroke-width="3" /><line x1="445" y1="240" x2="436.76319777159307" y2="137.68300591310845" stroke="#d66b28" stroke-width="3" /><line x1="245" y1="240" x2="445" y2="240" stroke="#91a9bc" stroke-width="1.5" stroke-dasharray="6 5"/><circle cx="245" cy="240" r="5" fill="#17324d"/><circle cx="445" cy="240" r="5" fill="#17324d"/><circle cx="436.76319777159307" cy="137.68300591310845" r="6" fill="#d66b28"/><text x="203" y="262" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">F₁</text><text x="454" y="262" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">F₂</text><text x="445.76319777159307" y="131.68300591310845" font-size="16" fill="#d66b28" font-weight="bold" text-anchor="start">M (bút)</text><text x="538" y="136" font-size="20" fill="#167e70" font-weight="bold" text-anchor="start">MF₁+MF₂ = 2a</text><text x="538" y="177" font-size="20" fill="#17324d" font-weight="normal" text-anchor="start">F₁F₂ = 2c</text><text x="538" y="219" font-size="19" fill="#d66b28" font-weight="bold" text-anchor="start">2a > 2c > 0</text><text x="538" y="267" font-size="17" fill="#17324d" font-weight="normal" text-anchor="start">Dây luôn căng.</text><text x="27" y="409" font-size="14" fill="#677b8e" font-weight="normal" text-anchor="start">Hai đinh cố định: bút đi theo elip khi tổng hai đoạn dây luôn bằng 2a.</text></g></svg>