<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="t d">
<title id="t">Tam giác Pascal đến hàng n bằng 4</title><desc id="d">Các hàng hệ số nhị thức Newton lần lượt là 1; 1 1; 1 2 1; 1 3 3 1; 1 4 6 4 1. Mỗi số ở giữa bằng tổng hai số liền kề hàng trên, giúp tìm hệ số khi khai triển (a+b) mũ 4.</desc><rect width="760" height="440" rx="20" fill="#ffffff"/><text x="22" y="39" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#203b69">Từ cách chọn hạng tử đến hệ số Newton</text><circle cx="380" cy="100" r="22" fill="#e8f1ff" stroke="#6091b3"/><text x="380" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">1</text><circle cx="339" cy="155" r="22" fill="#e8f1ff" stroke="#6091b3"/><text x="339" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">1</text><circle cx="421" cy="155" r="22" fill="#e8f1ff" stroke="#6091b3"/><text x="421" y="163" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">1</text><circle cx="298" cy="210" r="22" fill="#e8f1ff" stroke="#6091b3"/><text x="298" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">1</text><circle cx="380" cy="210" r="22" fill="#e8f1ff" stroke="#6091b3"/><text x="380" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">2</text><circle cx="462" cy="210" r="22" fill="#e8f1ff" stroke="#6091b3"/><text x="462" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">1</text><circle cx="257" cy="265" r="22" fill="#e8f1ff" stroke="#6091b3"/><text x="257" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">1</text><circle cx="339" cy="265" r="22" fill="#e8f1ff" stroke="#6091b3"/><text x="339" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">3</text><circle cx="421" cy="265" r="22" fill="#e8f1ff" stroke="#6091b3"/><text x="421" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">3</text><circle cx="503" cy="265" r="22" fill="#e8f1ff" stroke="#6091b3"/><text x="503" y="273" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">1</text><circle cx="216" cy="320" r="22" fill="#d9eff5" stroke="#6091b3"/><text x="216" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">1</text><circle cx="298" cy="320" r="22" fill="#d9eff5" stroke="#6091b3"/><text x="298" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">4</text><circle cx="380" cy="320" r="22" fill="#d9eff5" stroke="#6091b3"/><text x="380" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">6</text><circle cx="462" cy="320" r="22" fill="#d9eff5" stroke="#6091b3"/><text x="462" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">4</text><circle cx="544" cy="320" r="22" fill="#d9eff5" stroke="#6091b3"/><text x="544" y="328" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#214d78">1</text>
<text x="28" y="411" font-family="Arial,sans-serif" font-size="18" fill="#405b78">Hàng n=4: (a+b)⁴ = a⁴ + 4a³b + 6a²b² + 4ab³ + b⁴.</text></svg>