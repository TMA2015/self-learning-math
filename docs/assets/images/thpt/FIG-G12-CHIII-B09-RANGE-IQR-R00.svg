<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="t d"><title id="t">Khoảng biến thiên và khoảng tứ phân vị là hai thước đo khác nhau</title><desc id="d">Thanh phạm vi toàn bộ dài từ 0 đến 50; đoạn giữa Q1=17,78 đến Q3=32,22 nhấn mạnh 50 phần trăm giữa mẫu. Các con số lấy từ một bảng ghép nhóm minh họa.</desc><rect width="1100" height="490" rx="22" fill="#f6f9fb"/><text x="42" y="63" fill="#182d48" font-size="31" font-family="DejaVu Sans">Bài 9 · Hai cách đọc mức phân tán</text><text x="46" y="126" fill="#40556b" font-size="22" font-family="DejaVu Sans">Miền phủ R = 50 (từ cận 0 tới cận 50)</text><line x1="130" y1="207" x2="930" y2="207" stroke="#60748a" stroke-width="12" stroke-linecap="round"/><circle cx="130" cy="207" r="12" fill="#60748a"/><circle cx="930" cy="207" r="12" fill="#60748a"/><text x="114" y="243" font-size="19" font-family="DejaVu Sans">0</text><text x="913" y="243" font-size="19" font-family="DejaVu Sans">50</text><text x="46" y="300" fill="#40556b" font-size="22" font-family="DejaVu Sans">Nửa giữa IQR ≈ 14,44 (Q₁≈17,78; Q₃≈32,22)</text><line x1="130" y1="360" x2="930" y2="360" stroke="#cbd7e0" stroke-width="11"/><line x1="414" y1="360" x2="646" y2="360" stroke="#208b70" stroke-width="18" stroke-linecap="round"/><text x="386" y="401" font-size="20" fill="#208b70" font-family="DejaVu Sans">Q₁</text><text x="630" y="401" font-size="20" fill="#208b70" font-family="DejaVu Sans">Q₃</text><text x="46" y="457" fill="#40556b" font-size="18" font-family="DejaVu Sans">IQR chỉ phản ánh phần giữa; hai cận R nhạy với nhóm biên có dữ liệu.</text></svg>