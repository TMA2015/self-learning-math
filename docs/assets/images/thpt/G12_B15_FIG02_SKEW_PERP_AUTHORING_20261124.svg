<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="t d"><title id="t">Hai đường thẳng vuông góc và chéo nhau</title><desc id="d">d1=(t;0;0) nằm trong z=0; d2=(0;s;1) nằm trong z=1. Hướng (1;0;0),(0;1;0) vuông góc, không có điểm chung vì khác cao độ. Phối cảnh affine.</desc><rect width="720" height="390" rx="10" fill="white"/><g font-family="sans-serif" fill="#23445d"><text x="20" y="30" font-size="21" font-weight="bold">Vuông góc về hướng không có nghĩa là cắt nhau</text><polygon points="29.60000000000001,228.4 281.20000000000005,289.6 410.4,221.6 158.8,160.4" fill="#dceaf1" stroke="#7694a5"/><polygon points="29.60000000000001,133.4 281.20000000000005,194.60000000000002 410.4,126.6 158.8,65.4" fill="#f5e6d8" fill-opacity=".85" stroke="#b78b65"/><path d="M72 189L368 261" stroke="#176b9b" stroke-width="4"/><path d="M144 170L296 90" stroke="#b25c32" stroke-width="4"/><path d="M220 225L220 130" stroke="#607989" stroke-dasharray="5 5" stroke-width="2.5"/><circle cx="220" cy="225" r="5" fill="#176b9b"/><circle cx="220" cy="130" r="5" fill="#b25c32"/><g font-size="15"><text x="232" y="240">A(0;0;0)</text><text x="230" y="119">B(0;0;1)</text><text x="345" y="275" fill="#176b9b">d₁</text><text x="303" y="84" fill="#b25c32">d₂</text><text x="85" y="274">z=0</text><text x="85" y="105">z=1</text></g><g font-size="16"><text x="432" y="91" fill="#176b9b">d₁: (t;0;0)</text><text x="432" y="120" fill="#b25c32">d₂: (0;s;1)</text><text x="432" y="171">u·v = 0</text><text x="432" y="197" font-weight="bold">⇒ d₁ ⟂ d₂</text><text x="432" y="242">0 ≠ 1 (cao độ)</text><text x="432" y="269" font-weight="bold">⇒ không có điểm chung</text><text x="432" y="300" font-weight="bold">⇒ chéo nhau</text></g><text x="20" y="363" font-size="14">Hai hình bình hành là các phần của hai mặt phẳng ngang; không đo góc bằng hình phối cảnh.</text></g></svg>