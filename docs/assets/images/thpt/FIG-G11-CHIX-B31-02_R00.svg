<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="title desc"><title id="title">Điểm gấp khúc: liên tục chưa đủ để có đạo hàm</title><desc id="desc">Đồ thị y=|x| qua O: độ dốc trái −1, phải +1; giới hạn hai phía không tồn tại.</desc><rect width="860" height="460" rx="20" fill="#fafcff"/><text x="430" y="36" font-size="21" font-family="Arial" fill="#1f2937" text-anchor="middle" font-weight="bold">Điểm gấp khúc: liên tục chưa đủ để có đạo hàm</text><line x1="80" y1="340" x2="760" y2="340" stroke="#475569" stroke-width="2"/><line x1="420" y1="401" x2="420" y2="70" stroke="#475569" stroke-width="2"/><polyline points="150,70 420,340 690,70" fill="none" stroke="#dc2626" stroke-width="4"/><circle cx="420" cy="340" r="6" fill="#b91c1c"/><text x="438" y="358" font-size="17">O(0,0)</text><text x="90" y="115" font-size="17">x &lt; 0: độ dốc −1</text><text x="535" y="115" font-size="17">x &gt; 0: độ dốc +1</text><text x="280" y="397" font-size="16">Hai giới hạn khác nhau: f′(0) không tồn tại</text><text x="430" y="441" font-size="13" font-family="Arial" fill="#475569" text-anchor="middle">Đọc nhãn và điều kiện; không suy số liệu từ khoảng cách trên hình.</text></svg>