<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" aria-labelledby="t d"><title id="t">Thiết diện hình vuông của khối chóp</title><desc id="d">Khối chóp vuông cao 6, cạnh đáy 4. Mặt cắt tại x=3 có cạnh 2 và diện tích 4. Mặt cắt song song đáy, kích thước tuyến tính theo x.</desc><rect width="680" height="410" rx="10" fill="white"/><g font-family="sans-serif" fill="#23445d"><text x="20" y="30" font-size="20" font-weight="bold">Từ chiều dài cạnh đến diện tích mặt cắt</text><polygon points="83.00 209.00 495.00 311.00 583.00 263.00" fill="#e9f0f4"/><polygon points="83.00 209.00 583.00 263.00 583.00 107.00" fill="#dfeaf0"/><polygon points="83.00 209.00 583.00 107.00 495.00 155.00" fill="#edf4f7"/><polygon points="495.00 311.00 583.00 263.00 583.00 107.00 495.00 155.00" fill="#d3e5ed" stroke="#527c93" stroke-width="2"/><g fill="none" stroke="#527c93" stroke-width="1.8"><path d="M83.00 209.00L495.00 311.00"/><path d="M83.00 209.00L583.00 263.00"/><path d="M83.00 209.00L583.00 107.00"/><path d="M83.00 209.00L495.00 155.00"/></g><polygon points="289.00 260.00 333.00 236.00 333.00 158.00 289.00 182.00" fill="#9fd5c8" fill-opacity=".95" stroke="#21836c" stroke-width="2.5"/><path d="M60 209H621l-8 -4m8 4l-8 4" fill="none" stroke="#607989" stroke-dasharray="6 4" stroke-width="1.8"/><circle cx="83" cy="209" r="4" fill="#23445d"/><g font-size="15"><text x="68" y="227">O</text><text x="626" y="215">x</text><text x="311" y="228" text-anchor="middle">3</text><text x="539" y="228" text-anchor="middle">6</text><text x="280" y="142" fill="#21836c">cạnh 2</text><text x="536" y="100">cạnh 4</text><text x="20" y="344" font-size="16">Cạnh thiết diện tại x: ℓ(x)=4x/6.</text><text x="20" y="370" font-size="16">Diện tích S(x)=(2x/3)²; không phải 2x/3.</text><text x="20" y="394" font-size="14">Hình phối cảnh: các mặt cắt song song đáy, vuông góc Ox.</text></g></g></svg>