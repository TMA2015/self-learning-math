<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" role="img" aria-labelledby="t d"><title id="t">Góc hai mặt phẳng bằng góc hai pháp tuyến</title><desc id="d">Thiết diện y=0 của P:z=0 và Q:z=x cho hai đường ngang và nghiêng 45 độ. Pháp tuyến P hướng lên, pháp tuyến Q hướng lên trái, tạo góc 45 độ.</desc><rect width="680" height="280" rx="10" fill="white"/><g font-family="sans-serif" fill="#23445d"><text x="20" y="29" font-size="20" font-weight="bold">Cắt vuông góc giao tuyến để thấy góc thật</text><path d="M38 181H360" stroke="#176b9b" stroke-width="3"/><path d="M100 260L318 42" stroke="#21836c" stroke-width="3"/><path d="M179 181V53" stroke="#b25c32" stroke-width="3"/><path d="M179 181L77 79" stroke="#9b6aa6" stroke-width="3"/><path d="M179 53l-5 9m5-9l5 9 M77 79l4 10m-4-10l10 4" stroke-width="2" stroke="#607989" fill="none"/><path d="M179 165H195V181 M167 169L179 157L191 169" stroke="#607989" stroke-width="1.5" fill="none"/><path d="M222 181 A43 43 0 0 0 209.406 150.594" stroke="#21836c" fill="none" stroke-width="2.5"/><path d="M179 121 A60 60 0 0 0 136.574 138.574" stroke="#b25c32" fill="none" stroke-width="2.5"/><circle cx="179" cy="181" r="4"/><g font-size="15"><text x="164" y="200">O</text><text x="322" y="175" fill="#176b9b">P</text><text x="324" y="47" fill="#21836c">Q</text><text x="189" y="55" fill="#b25c32">n₁</text><text x="51" y="76" fill="#9b6aa6">n₂</text><text x="230" y="158" fill="#21836c">45°</text><text x="137" y="109" fill="#b25c32">45°</text><text x="390" y="83">P: z=0; Q: z=x</text><text x="390" y="114">n₁=(0;0;1)</text><text x="390" y="143">n₂=(−1;0;1)</text><text x="390" y="186" font-weight="bold">Góc hai mặt = 45°</text><text x="390" y="215">cos θ = 1/√2</text></g><text x="20" y="268" font-size="13">Giao tuyến Oy vuông góc mặt phẳng hình vẽ y=0; P, Q là vết cắt trong mặt phẳng ấy.</text></g></svg>