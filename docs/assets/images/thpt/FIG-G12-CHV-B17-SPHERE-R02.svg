<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" role="img" aria-labelledby="t d"><title id="t">Mặt cầu và khối cầu</title><desc id="d">Hình chiếu mặt cầu tâm I bán kính R; điểm M trên mặt, A ở trong và B ở ngoài, trong mặt cắt minh họa.</desc><rect width="840" height="450" rx="16" fill="#f6fafb"/><g font-family="Arial,sans-serif"><text x="28" y="39" fill="#18324b" font-size="25" font-weight="bold">Mặt cầu và khối cầu</text><circle cx="370" cy="242" r="146" fill="#dfedf7" stroke="#176c9b" stroke-width="3" /><ellipse cx="370" cy="242" rx="146" ry="43" fill="none" stroke="#739bb1" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="370" y1="242" x2="486.601" y2="154.135" stroke="#b5453b" stroke-width="3" /><polygon points="486.601,154.135 480.026,165.35 474.008,157.364" fill="#b5453b" stroke="#b5453b" stroke-width="1" /><circle cx="370" cy="242" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><circle cx="486.601" cy="154.135" r="4.8" fill="#b5453b" stroke="#b5453b" stroke-width="1" /><circle cx="325" cy="293" r="4.8" fill="#197b56" stroke="#197b56" stroke-width="1" /><circle cx="572" cy="252" r="4.8" fill="#9b611b" stroke="#9b611b" stroke-width="1" /><text x="355" y="232" fill="#18324b" font-size="19" >I</text><text x="496.601" y="146.135" fill="#b5453b" font-size="19" >M (trên)</text><text x="260" y="318" fill="#197b56" font-size="19" >A (trong)</text><text x="581" y="274" fill="#9b611b" font-size="19" >B (ngoài)</text><text x="436.3" y="190.068" fill="#b5453b" font-size="19" >R</text><text x="28" y="425" fill="#18324b" font-size="17" >IM=R; IA&lt;R, IB&gt;R. So sánh bình phương các khoảng cách.</text></g></svg>