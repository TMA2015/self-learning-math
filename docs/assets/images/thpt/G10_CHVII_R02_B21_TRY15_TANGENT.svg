<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"><title>B21 · Tiếp tuyến vuông góc với bán kính</title><desc>M0 trên đường tròn, bán kính IM0 vuông góc tiếp tuyến Δ, pháp tuyến nΔ bằng IM0.</desc><rect width="760" height="430" fill="#ffffff"/><g font-family="Arial,DejaVu Sans,sans-serif" fill="#17324d"><text x="27" y="35" font-size="21" fill="#17324d" font-weight="bold" text-anchor="start">B21 · Tiếp tuyến tại điểm chạm</text><circle cx="315" cy="220" r="112" fill="#f3fbff" stroke="#2667ad" stroke-width="3.5"/><line x1="315" y1="220" x2="427" y2="220" stroke="#d66b28" stroke-width="4" /><line x1="427" y1="75" x2="427" y2="373" stroke="#167e70" stroke-width="4" /><circle cx="315" cy="220" r="6" fill="#17324d"/><circle cx="427" cy="220" r="6" fill="#17324d"/><polyline points="411,220 411,204 427,204" fill="none" stroke="#17324d" stroke-width="2"/><text x="300" y="245" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">I(a;b)</text><text x="439" y="219" font-size="16" fill="#d66b28" font-weight="bold" text-anchor="start">M₀(x₀;y₀)</text><text x="440" y="77" font-size="18" fill="#167e70" font-weight="bold" text-anchor="start">Δ (tiếp tuyến)</text><text x="468" y="282" font-size="20" fill="#17324d" font-weight="bold" text-anchor="start">IM₀ ⟂ Δ</text><text x="468" y="319" font-size="19" fill="#d66b28" font-weight="bold" text-anchor="start">nΔ = IM₀</text><text x="468" y="350" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">=(x₀−a; y₀−b)</text><text x="27" y="406" font-size="14" fill="#677b8e" font-weight="normal" text-anchor="start">Kiểm M₀ thuộc đường tròn trước khi dùng bán kính làm pháp tuyến tiếp tuyến.</text></g></svg>