<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" role="img" aria-labelledby="t d">
<title id="t">Phân biệt chọn hai người có thứ tự và không có thứ tự</title><desc id="d">Từ ba người A, B, C, chọn hai người vào hai vai khác nhau có sáu khả năng có thứ tự AB, AC, BA, BC, CA, CB. Chọn nhóm hai người không phân biệt vai có ba nhóm AB, AC, BC.</desc><rect width="760" height="345" fill="#ffffff" rx="20"/><text x="24" y="40" font-family="Arial,sans-serif" font-size="23" fill="#1b3b67" font-weight="700">Cùng chọn 2 trong 3, nhưng thứ tự có quan trọng?</text>
<rect x="25" y="71" width="347" height="219" rx="13" fill="#e6f1ff" stroke="#88abd0"/><rect x="395" y="71" width="340" height="219" rx="13" fill="#eaf7ee" stroke="#91bb9d"/>
<g font-family="Arial,sans-serif" fill="#1a3b62"><text x="46" y="109" font-weight="700" font-size="21">Có phân vai / thứ tự</text><text x="413" y="109" font-weight="700" font-size="21">Chỉ chọn nhóm</text><text x="48" y="163" font-size="21">AB · AC · BA</text><text x="48" y="202" font-size="21">BC · CA · CB</text><text x="415" y="163" font-size="21">AB · AC · BC</text><text x="48" y="259" font-size="23" font-weight="700">A(3,2) = 6</text><text x="415" y="259" font-size="23" font-weight="700">C(3,2) = 3</text></g>
<text x="25" y="326" font-family="Arial,sans-serif" font-size="17" fill="#385b75">AB và BA khác nhau khi có vai; là cùng một nhóm khi không xét thứ tự.</text></svg>