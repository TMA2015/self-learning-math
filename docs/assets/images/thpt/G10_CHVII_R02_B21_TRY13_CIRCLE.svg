<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"><title>B21 · Đường tròn khác hình tròn</title><desc>Đường tròn là biên IM=R, hình tròn là miền IM≤R; điểm trong, biên và ngoài được phân biệt.</desc><rect width="760" height="430" fill="#ffffff"/><g font-family="Arial,DejaVu Sans,sans-serif" fill="#17324d"><text x="27" y="35" font-size="22" fill="#17324d" font-weight="bold" text-anchor="start">B21 · Đường biên khác vùng phủ</text><circle cx="290" cy="228" r="125" fill="#e1f1e9" stroke="#167e70" stroke-width="5"/><circle cx="290" cy="228" r="5" fill="#17324d"/><circle cx="340" cy="177" r="6" fill="#2667ad"/><circle cx="415" cy="228" r="6" fill="#d66b28"/><circle cx="485" cy="228" r="6" fill="#677b8e"/><line x1="290" y1="228" x2="415" y2="228" stroke="#167e70" stroke-width="2.2" /><text x="272" y="248" font-size="17" fill="#17324d" font-weight="bold" text-anchor="start">I</text><text x="330" y="162" font-size="15" fill="#2667ad" font-weight="normal" text-anchor="start">M trong</text><text x="410" y="213" font-size="15" fill="#d66b28" font-weight="normal" text-anchor="start">M biên</text><text x="487" y="214" font-size="15" fill="#17324d" font-weight="normal" text-anchor="start">M ngoài</text><text x="530" y="130" font-size="20" fill="#167e70" font-weight="bold" text-anchor="start">HÌNH TRÒN</text><text x="530" y="162" font-size="17" fill="#167e70" font-weight="normal" text-anchor="start">Cả vùng: IM ≤ R</text><text x="530" y="230" font-size="20" fill="#d66b28" font-weight="bold" text-anchor="start">ĐƯỜNG TRÒN</text><text x="530" y="262" font-size="17" fill="#d66b28" font-weight="normal" text-anchor="start">Chỉ biên: IM = R</text><text x="530" y="326" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">Điểm ngoài: IM > R</text><text x="30" y="408" font-size="14" fill="#677b8e" font-weight="normal" text-anchor="start">Phương trình đường tròn mô tả biên; mô hình vùng phủ lý tưởng gồm cả phần bên trong.</text></g></svg>