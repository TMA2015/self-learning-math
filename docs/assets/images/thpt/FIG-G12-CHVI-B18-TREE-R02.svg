<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-labelledby="t d"><title id="t">Rút hai bi không hoàn lại</title><desc id="d">Túi 5 đỏ,3 xanh; sau lượt đầu còn 7 bi, từng lá là tích hai xác suất.</desc><rect width="840" height="440" rx="16" fill="#f7fafb"/><g font-family="Arial,sans-serif"><text x="28" y="38" fill="#18324b" font-size="26" font-weight="bold">Rút hai bi không hoàn lại</text><rect x="28" y="194" width="150" height="48" rx="6" fill="#e2edf4" stroke="#176c9b"/><text x="103" y="225" fill="#176c9b" font-size="17" text-anchor="middle">Lượt đầu</text><line x1="178" y1="218" x2="357" y2="130" stroke="#176c9b" stroke-width="2"/><rect x="357" y="109" width="133" height="42" rx="6" fill="#e1edf4" stroke="#176c9b"/><text x="423" y="136" fill="#176c9b" font-size="18" text-anchor="middle">Đỏ</text><text x="255" y="162" fill="#176c9b" font-size="18" text-anchor="middle">5/8</text><line x1="490" y1="130" x2="626" y2="88" stroke="#197b56" stroke-width="2"/><text x="548" y="100" fill="#197b56" font-size="17" text-anchor="middle">4/7</text><rect x="626" y="63" width="184" height="50" rx="5" fill="#e3f2e9" stroke="#197b56"/><text x="718" y="86" fill="#197b56" font-size="17" text-anchor="middle">Đỏ–đỏ</text><text x="718" y="105" fill="#197b56" font-size="16" text-anchor="middle">20/56 = 5/14</text><line x1="490" y1="130" x2="626" y2="171" stroke="#18324b" stroke-width="2"/><text x="548" y="170.5" fill="#18324b" font-size="17" text-anchor="middle">3/7</text><rect x="626" y="146" width="184" height="50" rx="5" fill="#eef2f5" stroke="#18324b"/><text x="718" y="169" fill="#18324b" font-size="17" text-anchor="middle">Đỏ–xanh</text><text x="718" y="188" fill="#18324b" font-size="16" text-anchor="middle">15/56</text><line x1="178" y1="218" x2="357" y2="306" stroke="#176c9b" stroke-width="2"/><rect x="357" y="285" width="133" height="42" rx="6" fill="#e1edf4" stroke="#176c9b"/><text x="423" y="312" fill="#176c9b" font-size="18" text-anchor="middle">Xanh</text><text x="255" y="283" fill="#176c9b" font-size="18" text-anchor="middle">3/8</text><line x1="490" y1="306" x2="626" y2="265" stroke="#18324b" stroke-width="2"/><text x="548" y="276.5" fill="#18324b" font-size="17" text-anchor="middle">5/7</text><rect x="626" y="240" width="184" height="50" rx="5" fill="#eef2f5" stroke="#18324b"/><text x="718" y="263" fill="#18324b" font-size="17" text-anchor="middle">Xanh–đỏ</text><text x="718" y="282" fill="#18324b" font-size="16" text-anchor="middle">15/56</text><line x1="490" y1="306" x2="626" y2="348" stroke="#18324b" stroke-width="2"/><text x="548" y="347" fill="#18324b" font-size="17" text-anchor="middle">2/7</text><rect x="626" y="323" width="184" height="50" rx="5" fill="#eef2f5" stroke="#18324b"/><text x="718" y="346" fill="#18324b" font-size="17" text-anchor="middle">Xanh–xanh</text><text x="718" y="365" fill="#18324b" font-size="16" text-anchor="middle">6/56</text><text x="28" y="419" fill="#18324b" font-size="18" >Cộng 20/56 + 15/56 + 15/56 + 6/56 = 1; không hoàn lại nên mẫu 7.</text></g></svg>