<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="ttl ds"><title id="ttl">Đọc ba tọa độ từ hệ trục đơn vị</title><desc id="ds">Ba trục vuông góc trong không gian chiếu lên màn hình với vạch đơn vị. Từ O đi 2 theo Ox đến P(2;0;0), thêm 1 theo Oy đến H(2;1;0), thêm 3 theo Oz đến M(2;1;3). Các đường phụ song song với trục, H là hình chiếu lên Oxy.</desc><rect width="840" height="520" rx="24" fill="#f6fafb"/><defs><marker id="ax" viewBox="0 0 10 10" markerWidth="5" markerHeight="5" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#17324d"/></marker></defs><g font-family="Arial,sans-serif" font-size="20" fill="#17324d"><text x="30" y="42" font-size="25" font-weight="bold">Đọc M(2;1;3) từ ba bước đơn vị</text><line x1="320" y1="330" x2="619.2" y2="418.4" stroke="#b84438" stroke-width="3.2" marker-end="url(#ax)"/><line x1="320" y1="330" x2="87.5" y2="429.2" stroke="#176d99" stroke-width="3.2" marker-end="url(#ax)"/><line x1="320" y1="330" x2="320" y2="63.5" stroke="#187552" stroke-width="3.2" marker-end="url(#ax)"/><line x1="411" y1="347" x2="405" y2="365" stroke="#b84438" stroke-width="2"/><text x="410" y="381" font-size="17" fill="#b84438">1</text><line x1="499" y1="373" x2="493" y2="391" stroke="#b84438" stroke-width="2"/><text x="498" y="407" font-size="17" fill="#b84438">2</text><line x1="587" y1="399" x2="581" y2="417" stroke="#b84438" stroke-width="2"/><text x="586" y="433" font-size="17" fill="#b84438">3</text><line x1="242" y1="353" x2="248" y2="371" stroke="#176d99" stroke-width="2"/><text x="237" y="388" font-size="17" fill="#176d99">1</text><line x1="167" y1="385" x2="173" y2="403" stroke="#176d99" stroke-width="2"/><text x="162" y="420" font-size="17" fill="#176d99">2</text><line x1="92" y1="417" x2="98" y2="435" stroke="#176d99" stroke-width="2"/><text x="87" y="452" font-size="17" fill="#176d99">3</text><line x1="311" y1="265" x2="329" y2="265" stroke="#187552" stroke-width="2"/><text x="293" y="270" font-size="17" fill="#187552">1</text><line x1="311" y1="200" x2="329" y2="200" stroke="#187552" stroke-width="2"/><text x="293" y="205" font-size="17" fill="#187552">2</text><line x1="311" y1="135" x2="329" y2="135" stroke="#187552" stroke-width="2"/><text x="293" y="140" font-size="17" fill="#187552">3</text><text x="297" y="320" >O</text><text x="631.2" y="420.4" fill="#b84438">x</text><text x="70.5" y="435.2" fill="#176d99">y</text><text x="328" y="67.5" fill="#187552">z</text><line x1="245" y1="362" x2="421" y2="414" stroke="#8b9dac" stroke-width="2" stroke-dasharray="7 5"/><line x1="320" y1="135" x2="421" y2="219" stroke="#8b9dac" stroke-width="2" stroke-dasharray="7 5"/><line x1="320" y1="330" x2="496" y2="382" stroke="#b84438" stroke-width="5"/><line x1="496" y1="382" x2="421" y2="414" stroke="#176d99" stroke-width="5"/><line x1="421" y1="414" x2="421" y2="219" stroke="#187552" stroke-width="5"/><circle cx="320" cy="330" r="4" fill="#17324d"/><circle cx="496" cy="382" r="5" fill="#b84438"/><circle cx="421" cy="414" r="5" fill="#176d99"/><circle cx="421" cy="219" r="7" fill="#713c90"/><text x="507" y="368" font-size="18" fill="#b84438">P(2;0;0)</text><text x="411" y="439" font-size="18" fill="#176d99">H(2;1;0)</text><text x="434" y="212" font-size="22" font-weight="bold" fill="#713c90">M(2;1;3)</text><text x="533" y="195" font-size="18" fill="#b84438">2 bước theo Ox</text><text x="533" y="224" font-size="18" fill="#176d99">1 bước theo Oy</text><text x="533" y="253" font-size="18" fill="#187552">3 bước theo Oz</text><text x="30" y="492" font-size="17">Vạch là đơn vị theo từng trục; không đo góc thật trên ảnh phối cảnh.</text></g></svg>