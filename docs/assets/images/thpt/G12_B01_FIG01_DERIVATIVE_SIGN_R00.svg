<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
<title id="title">Toán 12 B01: dấu đạo hàm và cực trị của y=x³-3x</title>
<desc id="desc">Hàm y=x³-3x có cực đại tại điểm (-1,2), cực tiểu tại (1,-2), đạo hàm 3(x+1)(x-1) dương trên khoảng x nhỏ hơn -1, âm từ -1 đến 1 và dương khi x lớn hơn 1. Bảng dấu: tăng, giảm, tăng.</desc>
<rect width="800" height="500" fill="white"/>
<text x="28" y="37" font-size="22" font-family="sans-serif" fill="#17324d">Vì sao f′ đổi dấu tạo cực trị?</text>
