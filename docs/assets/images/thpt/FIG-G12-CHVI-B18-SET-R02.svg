<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-labelledby="t d"><title id="t">Chỉ xét trong nhóm điều kiện B</title><desc id="d">Sáu kết quả của xúc xắc; B gồm 2,4,6, A là lớn hơn 3, giao gồm 4,6.</desc><rect width="840" height="440" rx="16" fill="#f7fafb"/><g font-family="Arial,sans-serif"><text x="28" y="38" fill="#18324b" font-size="26" font-weight="bold">Chỉ xét trong nhóm điều kiện B</text><rect x="55" y="78" width="730" height="238" rx="12" fill="#fff" stroke="#9eb3c3"/><text x="75" y="106" fill="#18324b" font-size="22" >Ω: 6 kết quả đồng khả năng</text><rect x="95" y="132" width="86" height="90" rx="10" fill="#f2f4f6" stroke="#75899a"/><text x="138" y="187" fill="#75899a" font-size="36" text-anchor="middle">1</text><rect x="207" y="132" width="86" height="90" rx="10" fill="#e1edf4" stroke="#176c9b"/><text x="250" y="187" fill="#176c9b" font-size="36" text-anchor="middle">2</text><text x="250" y="250" fill="#176c9b" font-size="18" text-anchor="middle">B</text><rect x="319" y="132" width="86" height="90" rx="10" fill="#f2f4f6" stroke="#75899a"/><text x="362" y="187" fill="#75899a" font-size="36" text-anchor="middle">3</text><rect x="431" y="132" width="86" height="90" rx="10" fill="#e3f2e9" stroke="#197b56"/><text x="474" y="187" fill="#197b56" font-size="36" text-anchor="middle">4</text><text x="474" y="250" fill="#176c9b" font-size="18" text-anchor="middle">B</text><text x="474" y="280" fill="#197b56" font-size="18" text-anchor="middle">A</text><rect x="543" y="132" width="86" height="90" rx="10" fill="#f2f4f6" stroke="#75899a"/><text x="586" y="187" fill="#75899a" font-size="36" text-anchor="middle">5</text><text x="586" y="280" fill="#197b56" font-size="18" text-anchor="middle">A</text><rect x="655" y="132" width="86" height="90" rx="10" fill="#e3f2e9" stroke="#197b56"/><text x="698" y="187" fill="#197b56" font-size="36" text-anchor="middle">6</text><text x="698" y="250" fill="#176c9b" font-size="18" text-anchor="middle">B</text><text x="698" y="280" fill="#197b56" font-size="18" text-anchor="middle">A</text><rect x="84" y="330" width="280" height="43" rx="6" fill="#e1edf4" stroke="none"/><text x="99" y="358" fill="#176c9b" font-size="21" >B = {2, 4, 6}</text><rect x="379" y="330" width="376" height="43" rx="6" fill="#e3f2e9" stroke="none"/><text x="394" y="358" fill="#197b56" font-size="21" >A ∩ B = {4, 6}</text><text x="28" y="419" fill="#18324b" font-size="18" >Mẫu số là 3 kết quả trong B; hai kết quả thuận lợi ⇒ P(A | B) = 2/3.</text></g></svg>