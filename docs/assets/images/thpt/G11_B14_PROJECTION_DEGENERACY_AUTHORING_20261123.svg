<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" width="880" height="380" role="img" aria-labelledby="title desc">
<title id="title">Phép chiếu song song: đường thành đường và đường có thể co thành một điểm</title>
<desc id="desc">Hai hình: bên trái đoạn AB không cùng phương chiếu, ảnh A phẩy B phẩy là đoạn; bên phải đoạn MN có phương song song phương chiếu, ảnh của mọi điểm M N trùng nhau tại K trên mặt phẳng chiếu.</desc>
<rect width="880" height="380" rx="18" fill="#fff"/>
<text x="440" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1c3b57">Phép chiếu song song: cần xét trường hợp suy biến</text>
<g font-family="Arial,sans-serif" font-size="18">
<rect x="25" y="52" width="405" height="295" rx="14" fill="#f5fafb" stroke="#d5e4e8"/>
<text x="229" y="80" text-anchor="middle" font-size="19" font-weight="700" fill="#235274">Đường không cùng phương chiếu</text>
<polygon points="68,294 352,294 395,243 111,243" fill="#e1f5e8" stroke="#427e64" stroke-width="2"/>
<line x1="128" y1="116" x2="278" y2="116" stroke="#235e98" stroke-width="3.7"/>
<circle cx="128" cy="116" r="5" fill="#235e98"/><circle cx="278" cy="116" r="5" fill="#235e98"/>
<line x1="128" y1="116" x2="196" y2="267" stroke="#a65d2a" stroke-width="2.5" stroke-dasharray="8 6"/>
<line x1="278" y1="116" x2="346" y2="267" stroke="#a65d2a" stroke-width="2.5" stroke-dasharray="8 6"/>
<line x1="196" y1="267" x2="346" y2="267" stroke="#235e98" stroke-width="3.7"/>
<circle cx="196" cy="267" r="5" fill="#235e98"/><circle cx="346" cy="267" r="5" fill="#235e98"/>
<text x="118" y="104" fill="#235e98">A</text><text x="275" y="104" fill="#235e98">B</text>
<text x="182" y="290" fill="#235e98">A′</text><text x="343" y="288" fill="#235e98">B′</text>
<text x="238" y="328" text-anchor="middle" fill="#375969">Ảnh của AB vẫn là đoạn A′B′</text>
<rect x="450" y="52" width="405" height="295" rx="14" fill="#f5fafb" stroke="#d5e4e8"/>
<text x="652" y="80" text-anchor="middle" font-size="19" font-weight="700" fill="#235274">Đường cùng phương chiếu</text>
<polygon points="480,297 785,297 826,241 521,241" fill="#e1f5e8" stroke="#427e64" stroke-width="2"/>
<line x1="571" y1="114" x2="722" y2="265" stroke="#a65d2a" stroke-width="3.5"/>
<circle cx="571" cy="114" r="6" fill="#235e98"/><circle cx="642" cy="185" r="6" fill="#235e98"/>
<circle cx="722" cy="265" r="7" fill="#a73e2f" stroke="#fff" stroke-width="2"/>
<text x="551" y="109" fill="#235e98">M</text><text x="646" y="182" fill="#235e98">N</text>
<text x="734" y="262" fill="#a73e2f">K = M′ = N′</text>
<text x="652" y="328" text-anchor="middle" fill="#375969">Ảnh của cả đường là một điểm</text>
</g></svg>