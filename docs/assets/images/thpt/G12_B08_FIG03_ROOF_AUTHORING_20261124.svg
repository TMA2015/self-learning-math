<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 420" role="img" aria-labelledby="t d"><title id="t">Mô hình nhà mái chữ A</title><desc id="d">Lăng trụ đứng có mặt trước tam giác OAB, O=(0;0;0), A=(240;0;0), B=(120;0;180), dài 360 cm theo Oy. M là chân đường cao từ B, M=(120;0;0).</desc><rect width="650" height="420" rx="10" fill="white"/><g font-family="sans-serif" font-size="17" fill="#25465c"><text x="20" y="30" font-size="21" font-weight="bold">Từ tọa độ đến kích thước mái nhà</text><path d="M100.00 335.00L226.00 212.00L373.60 132.80L247.60 255.80Z" fill="#dcecf3" stroke="#6f94ab" stroke-width="2"/><path d="M226.00 212.00L352.00 387.80L499.60 308.60L373.60 132.80Z" fill="#bbd7e6" stroke="#6f94ab" stroke-width="2"/><path d="M100.00 335.00L352.00 387.80L226.00 212.00Z" fill="#f2f7fa" stroke="#516e81" stroke-width="2"/><path d="M247.60 255.80L499.60 308.60" stroke="#8497a6" stroke-dasharray="6 4" fill="none"/><path d="M226.00 212.00L226.00 361.40" stroke="#ac5530" stroke-width="2.5" stroke-dasharray="6 4"/><path d="M352.00 387.80L226.00 212.00" stroke="#176b9b" stroke-width="4"/><path d="M352.00 387.80L499.60 308.60" stroke="#176b9b" stroke-width="3"/><g font-weight="bold"><text x="78" y="350">O</text><text x="360" y="401.8">A</text><text x="218" y="201.99999999999997">B</text><text x="229.6" y="245.8">O′</text><text x="509.6" y="311.6">A′</text><text x="381.6" y="123.79999999999998">B′</text><text x="220" y="379.4">M</text></g><text x="146" y="382">OA = 240 cm</text><text x="241" y="270" fill="#ac5530">180 cm</text><text x="406" y="365" fill="#176b9b">AA′ = 360 cm</text><text x="20" y="64" font-size="15">B(120;0;180) · B′(120;360;180)</text><text x="20" y="406" font-size="15">Mặt trước nằm trong (Oxz); chiều dài nhà theo Oy.</text></g></svg>