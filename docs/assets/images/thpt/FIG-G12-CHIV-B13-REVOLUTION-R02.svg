<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-labelledby="ttl ds"><title id="ttl">Quay miền dưới y=3x quanh Ox</title><desc id="ds">Mô hình phối cảnh khối nón cao 1, bán kính đáy 3; đĩa cắt tại x=0,6 có bán kính 1,8.</desc><rect width="840" height="470" rx="18" fill="#f6fafb"/><g font-family="Arial,sans-serif" fill="#17324d"><text x="28" y="38" font-size="25" fill="#17324d" font-weight="bold">Quay miền dưới y=3x quanh Ox</text><line x1="70" y1="250" x2="715" y2="250" stroke="#17324d" stroke-width="2" /><text x="723" y="256" font-size="19" fill="#17324d" >x</text><line x1="120" y1="400" x2="120" y2="80" stroke="#17324d" stroke-width="2" /><text x="105" y="78" font-size="19" fill="#17324d" >y</text><polygon points="120,250 640,112 640,250 640,388" fill="#cce4ef" stroke="#176d99" stroke-width="2" fill-opacity=".65"/><ellipse cx="640" cy="250" rx="26" ry="138" fill="#daeef6" fill-opacity=".65" stroke="#176d99" stroke-width="2"/><ellipse cx="432" cy="250" rx="16" ry="82.8" fill="#86c9ad" fill-opacity=".75" stroke="#23835c" stroke-width="2"/><line x1="432" y1="250" x2="432" y2="167.2" stroke="#23835c" stroke-width="3" /><text x="451" y="190.2" font-size="18" fill="#23835c" >r=3x</text><line x1="120" y1="250" x2="640" y2="112" stroke="#176d99" stroke-width="3" /><text x="505" y="100" font-size="20" fill="#176d99" >y=3x</text><text x="110" y="277" font-size="17" fill="#17324d" >0</text><text x="630" y="277" font-size="17" fill="#17324d" >1</text><text x="290" y="365" font-size="20" fill="#23835c" >Đĩa vuông góc Ox</text><text x="28" y="443" font-size="17" fill="#17324d" >Mỗi đoạn đứng quay thành một đĩa đầy: S(x)=π(3x)².</text></g></svg>