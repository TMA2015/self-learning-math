<title id="title">Giá trị lớn nhất và nhỏ nhất trên đoạn đóng</title>
<desc id="desc">Đồ thị f(x)=x²−4x+1 trên đoạn [0;5]. Ba điểm đặc (0;1), (2;−3), (5;6). Giá trị nhỏ nhất −3 tại 2; giá trị lớn nhất 6 tại 5.</desc>
