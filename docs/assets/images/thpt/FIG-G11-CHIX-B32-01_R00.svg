<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" role="img" aria-labelledby="title desc"><title id="title">Quy tắc tích: hai dải diện tích mới</title><desc id="desc">Hình chữ nhật diện tích uv. Khi u,v cùng tăng, hai dải bổ sung vΔu, uΔv và góc ΔuΔv. Nếu hai hàm khả vi, phần góc chia Δx tiến về 0.</desc><rect width="860" height="460" rx="20" fill="#fafcff"/><text x="430" y="36" font-size="21" font-family="Arial" fill="#1f2937" text-anchor="middle" font-weight="bold">Quy tắc tích: hai dải diện tích mới</text><rect x="190" y="110" width="265" height="205" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><rect x="455" y="110" width="75" height="205" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/><rect x="190" y="62" width="265" height="48" fill="#bbf7d0" stroke="#15803d" stroke-width="2"/><rect x="455" y="62" width="75" height="48" fill="#fbcfe8" stroke="#9d174d" stroke-width="2"/><text x="320" y="205" font-size="24">u·v</text><text x="459" y="225" font-size="14">vΔu</text><text x="282" y="93" font-size="17">uΔv</text><text x="462" y="92" font-size="13">ΔuΔv</text><text x="299" y="345" font-size="17">u</text><text x="468" y="345" font-size="14">Δu</text><text x="158" y="215" font-size="17">v</text><text x="136" y="91" font-size="15">Δv</text><text x="590" y="160" font-size="18">(uv)'</text><text x="580" y="195" font-size="18">= u'v + uv'</text><text x="575" y="235" font-size="14">Góc ΔuΔv là bậc hai</text><text x="430" y="441" font-size="13" font-family="Arial" fill="#475569" text-anchor="middle">Đọc nhãn và điều kiện; không suy số liệu từ khoảng cách trên hình.</text></svg>