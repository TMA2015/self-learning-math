<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img"><title>B19 · Vectơ pháp tuyến và chỉ phương</title><desc>Hai vectơ khác không vuông góc; n=(2,1), u=(-1,2), tích vô hướng bằng 0.</desc><rect width="760" height="430" fill="#ffffff"/><g font-family="Arial,DejaVu Sans,sans-serif" fill="#17324d"><text x="28" y="37" font-size="21" fill="#17324d" font-weight="bold" text-anchor="start">B19 · Pháp tuyến vuông góc với chỉ phương</text><line x1="190" y1="55" x2="355" y2="385" stroke="#2667ad" stroke-width="4" /><line x1="285" y1="245" x2="230" y2="135" stroke="#167e70" stroke-width="4" /><line x1="285" y1="245" x2="395" y2="190" stroke="#d66b28" stroke-width="4" /><polyline points="241,143 230,135 229,153" fill="none" stroke="#167e70" stroke-width="2"/><polyline points="381,189 395,190 387,203" fill="none" stroke="#d66b28" stroke-width="2"/><polyline points="274,223 296,213 307,235" fill="none" stroke="#17324d" stroke-width="2"/><circle cx="285" cy="245" r="5" fill="#17324d"/><text x="301" y="263" font-size="17" fill="#17324d" font-weight="bold" text-anchor="start">A</text><text x="174" y="116" font-size="15" fill="#167e70" font-weight="bold" text-anchor="start">u (chỉ phương)</text><text x="305" y="162" font-size="15" fill="#d66b28" font-weight="bold" text-anchor="start">n (pháp tuyến)</text><text x="455" y="125" font-size="22" fill="#d66b28" font-weight="bold" text-anchor="start">n = (2;1)</text><text x="455" y="162" font-size="22" fill="#167e70" font-weight="bold" text-anchor="start">u = (−1;2)</text><text x="455" y="209" font-size="17" fill="#17324d" font-weight="bold" text-anchor="start">n · u = 2(−1) + 1(2) = 0</text><text x="455" y="251" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">n ⟂ u</text><text x="455" y="305" font-size="16" fill="#17324d" font-weight="normal" text-anchor="start">u dọc đường; n vuông góc.</text><text x="30" y="407" font-size="14" fill="#677b8e" font-weight="normal" text-anchor="start">Đường được xác định bằng một điểm và một hướng khác vectơ không.</text></g></svg>