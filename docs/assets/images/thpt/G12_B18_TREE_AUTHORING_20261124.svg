<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 343" role="img" aria-labelledby="t d"><title id="t">Rút hai viên bi không hoàn lại</title><desc id="d">Túi có 3 đỏ và 2 xanh. Nhánh đầu đỏ 3/5, xanh 2/5; Xác suất lá đỏ đỏ 3/5×2/4=3/10, đỏ xanh 3/10, xanh đỏ 3/10, xanh xanh 1/10.</desc><rect width="680" height="343" rx="10" fill="white"/><g font-family="sans-serif" fill="#25445a"><text x="20" y="27" font-size="20" font-weight="bold">Rút hai viên bi không hoàn lại</text><path d="M65 176L228 107 M65 176L228 245" stroke="#52778d" stroke-width="2" fill="none"/><path d="M228 107L440 75" stroke="#21836c" stroke-width="3" fill="none"/><path d="M228 107L440 139" stroke="#8096a3" stroke-width="2" fill="none"/><path d="M228 245L440 213" stroke="#21836c" stroke-width="3" fill="none"/><path d="M228 245L440 277" stroke="#8096a3" stroke-width="2" fill="none"/><circle cx="65" cy="176" r="4"/><text x="25" y="181" font-size="15">Gốc</text><text x="133" y="128" font-size="16">3/5</text><rect x="197" y="93" width="62" height="27" rx="5" fill="white" stroke="#b9cbd3"/><text x="228" y="112" font-size="15" text-anchor="middle">Đ</text><text x="133" y="232" font-size="16">2/5</text><rect x="197" y="231" width="62" height="27" rx="5" fill="white" stroke="#b9cbd3"/><text x="228" y="250" font-size="15" text-anchor="middle">X</text><text x="329" y="84" font-size="15">2/4</text><text x="451" y="80" font-size="16" fill="#19735c">ĐĐ: 3/10</text><text x="329" y="116" font-size="15">2/4</text><text x="451" y="144" font-size="16" fill="#25445a">ĐX: 3/10</text><text x="329" y="222" font-size="15">3/4</text><text x="451" y="218" font-size="16" fill="#19735c">XĐ: 3/10</text><text x="329" y="254" font-size="15">1/4</text><text x="451" y="282" font-size="16" fill="#25445a">XX: 1/10</text><text x="20" y="329" font-size="15">Nhân xác suất dọc từng đường đi; các xác suất lá cộng thành 1.</text></g></svg>