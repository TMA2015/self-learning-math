<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img" aria-labelledby="t d"><title id="t">Khoảng cách theo cung tròn lớn</title><desc id="d">Trên tiết diện qua tâm O, OP và OQ cùng bán kính R, góc ở tâm 120 độ. Dây PQ khác cung nhỏ PQ. Độ dài cung là R nhân góc tính radian.</desc><rect width="680" height="310" rx="10" fill="white"/><g font-family="sans-serif" fill="#25445a"><text x="20" y="28" font-size="20" font-weight="bold">Cung trên mặt cầu khác đoạn thẳng xuyên qua cầu</text><circle cx="181" cy="171" r="118" fill="#eef5fa" stroke="#7e9bac" stroke-width="2"/><path d="M299 171 A118 118 0 0 0 122 68.809" fill="none" stroke="#21836c" stroke-width="6"/><path d="M181 171H299L122 68.809Z" stroke="#176b9b" stroke-width="2" fill="none"/><path d="M214 171 A33 33 0 0 0 164.5 142.421" fill="none" stroke="#b25c32" stroke-width="2"/><g font-size="16"><text x="166" y="190">O</text><text x="305" y="176">P</text><text x="106" y="60">Q</text><text x="192" y="143" fill="#b25c32">120°</text><text x="240" y="190">R</text><text x="144" y="108">R</text><text x="335" y="89" fill="#21836c">Cung nhỏ PQ: R × 2π/3</text><text x="335" y="128" fill="#176b9b">Dây PQ: R√3</text><text x="335" y="173">cos góc ở tâm = −1/2</text><text x="335" y="210">Không lấy trị tuyệt đối!</text></g><text x="20" y="304" font-size="14">Thiết diện qua O, P, Q là một đường tròn lớn của mặt cầu.</text></g></svg>