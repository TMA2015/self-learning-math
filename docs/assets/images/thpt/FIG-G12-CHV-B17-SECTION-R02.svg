<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" role="img" aria-labelledby="t d"><title id="t">Mặt cắt của mặt cầu với mặt phẳng</title><desc id="d">Mặt cắt qua tâm và đường chiếu IH. Tam giác IHX vuông tại H, IX=R, IH=h, HX=r.</desc><rect width="840" height="450" rx="16" fill="#f6fafb"/><g font-family="Arial,sans-serif"><text x="28" y="39" fill="#18324b" font-size="25" font-weight="bold">Mặt cắt của mặt cầu với mặt phẳng</text><circle cx="340" cy="210" r="145" fill="#e2f1f8" stroke="#176c9b" stroke-width="2" /><line x1="100" y1="285" x2="675" y2="285" stroke="#197b56" stroke-width="3" /><line x1="340" y1="210" x2="340" y2="285" stroke="#b5453b" stroke-width="3" /><line x1="340" y1="210" x2="464.097" y2="285" stroke="#18324b" stroke-width="3" /><line x1="340" y1="285" x2="464.097" y2="285" stroke="#9b611b" stroke-width="3" /><polyline points="357,285 357,268 340,268" stroke="#18324b" stroke-width="1.5" fill="none" stroke-linejoin="round" /><circle cx="340" cy="210" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><circle cx="340" cy="285" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><circle cx="464.097" cy="285" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><text x="320" y="202" fill="#18324b" font-size="19" >I</text><text x="317" y="310" fill="#18324b" font-size="19" >H</text><text x="474.097" y="303" fill="#18324b" font-size="19" >X</text><text x="317" y="247.5" fill="#b5453b" font-size="19" >h</text><text x="399.048" y="308" fill="#9b611b" font-size="19" >r</text><text x="403.048" y="235.5" fill="#18324b" font-size="19" >R</text><text x="640" y="315" fill="#197b56" font-size="19" >(P)</text><text x="28" y="425" fill="#18324b" font-size="17" >Khi 0 ≤ h &lt; R, đường tròn giao có bán kính r=√(R²−h²).</text></g></svg>