<g fill="#263442" font-family="Arial,sans-serif" font-size="21">
<text x="445" y="339">O</text><text x="882" y="336">+Ox</text><text x="480" y="75">+Oy</text>
<text x="601" y="293" fill="#1e6196">F₁ = 8 N</text>
<text x="192.5" y="123.14" fill="#9b4b12">F₂ = 15 N</text>
<text x="500.5" y="120.14" fill="#146e64">R = 13 N</text>
<text x="483.5" y="488.86" fill="#b43c48">F₃ = −R, 13 N</text>
<text x="368" y="265">120°</text>
<text x="625" y="98" font-size="19">F₁ = (8; 0) N</text>
<text x="625" y="126" font-size="19">F₂ = (−15/2; 15√3/2) N</text>
<text x="625" y="154" font-size="19">R = (1/2; 15√3/2) N</text>
<text x="625" y="182" font-size="19" fill="#b43c48">F₃ = (−1/2; −15√3/2) N</text>
<text x="480" y="577" text-anchor="middle" font-size="18">Đường chéo hình bình hành là hợp lực; lực cân bằng ngược chiều hợp lực.</text>
</g></svg>