<path d="M465 310L585 310" stroke="#1e6196" stroke-width="4.5" marker-end="url(#a1)"/>
<path d="M465 310L352.5 115.14" stroke="#ae5a1e" stroke-width="4.5" marker-end="url(#a2)"/>
<path d="M465 310L472.5 115.14" stroke="#168477" stroke-width="5" marker-end="url(#ar)"/>
<path d="M465 310L457.5 504.86" stroke="#b43c48" stroke-width="5" marker-end="url(#a3)"/>
