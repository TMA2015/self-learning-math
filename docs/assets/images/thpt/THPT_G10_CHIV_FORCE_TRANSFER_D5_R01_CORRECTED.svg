<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
<title id="t">Hợp lực hai lực tại góc 120 độ và lực cân bằng đối vectơ</title>
<desc id="d">Trục Ox hướng Đông, Oy hướng Bắc. Tại O, F1 bằng 8 N sang phải, F2 bằng 15 N theo hướng 120 độ ngược chiều kim đồng hồ, nên hợp lực R gần thẳng lên có độ dài 13 N. F3 là vectơ ngược R, hướng gần thẳng xuống dài 13 N. Mũi tên của từng vectơ đặt đúng tại điểm cuối tương ứng, không đảo chiều.</desc>
<defs><marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 3L0 6Z" fill="#1e6196"/></marker><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 3L0 6Z" fill="#ae5a1e"/></marker><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 3L0 6Z" fill="#168477"/></marker><marker id="a3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0L8 3L0 6Z" fill="#b43c48"/></marker></defs>
<rect width="960" height="600" fill="#ffffff"/>
