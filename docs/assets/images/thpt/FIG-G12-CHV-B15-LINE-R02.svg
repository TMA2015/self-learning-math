<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" role="img" aria-labelledby="t d"><title id="t">Một tham số xác định vị trí trên đường thẳng</title><desc id="d">Đường thẳng có A tại t=0; các điểm cách đều theo một bước vectơ u.</desc><rect width="840" height="450" rx="16" fill="#f6fafb"/><g font-family="Arial,sans-serif"><text x="28" y="39" fill="#18324b" font-size="25" font-weight="bold">Một tham số xác định vị trí trên đường thẳng</text><line x1="115.8" y1="374.4" x2="746" y2="73" stroke="#18324b" stroke-width="3" /><polygon points="746,73 737.332,82.688 733.017,73.667" fill="#18324b" stroke="#18324b" stroke-width="1" /><line x1="355" y1="260" x2="456.2" y2="211.6" stroke="#197b56" stroke-width="3" /><polygon points="456.2,211.6 447.532,221.288 443.217,212.267" fill="#197b56" stroke="#197b56" stroke-width="1" /><circle cx="171" cy="348" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><text x="159" y="373" fill="#18324b" font-size="19" >t=-2</text><circle cx="263" cy="304" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><text x="251" y="329" fill="#18324b" font-size="19" >t=-1</text><circle cx="355" cy="260" r="4.8" fill="#176c9b" stroke="#176c9b" stroke-width="1" /><text x="337" y="290" fill="#18324b" font-size="19" >A; t=0</text><circle cx="447" cy="216" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><text x="435" y="241" fill="#18324b" font-size="19" >t=1</text><circle cx="539" cy="172" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><text x="527" y="197" fill="#18324b" font-size="19" >t=2</text><circle cx="631" cy="128" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><text x="619" y="153" fill="#18324b" font-size="19" >t=3</text><text x="456.2" y="199.6" fill="#197b56" font-size="19" >u</text><text x="200" y="100" fill="#176c9b" font-size="25" >M = A + t u</text><text x="28" y="425" fill="#18324b" font-size="17" >t âm đi ngược u; t dương đi theo u. Cả ba tọa độ dùng chung t.</text></g></svg>