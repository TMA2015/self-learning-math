<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="t d"><title id="t">Mặt cắt qua tâm và khoảng cách tới mặt phẳng</title><desc id="d">Mặt cầu tâm I bán kính 5. Mặt phẳng cách tâm 3, cắt cầu theo đường tròn bán kính 4. Thiết diện qua tâm thể hiện tam giác vuông 3,4,5.</desc><rect width="680" height="330" rx="10" fill="white"/><g font-family="sans-serif" fill="#25445a"><text x="20" y="28" font-size="20" font-weight="bold">Mặt cắt qua tâm: tam giác vuông 3–4–5</text><circle cx="180" cy="176" r="125" fill="#e8f4f0" stroke="#21836c" stroke-width="2.8"/><path d="M255 56V296" stroke="#176b9b" stroke-width="2"/><path d="M255 76V276" stroke="#176b9b" stroke-width="5"/><path d="M180 176H255V76Z" fill="#f6d8b5" stroke="#b25c32" stroke-width="2"/><path d="M240 176V161H255" fill="none" stroke="#25445a" stroke-width="1.5"/><g font-size="16"><text x="165" y="196">I</text><text x="263" y="192">H</text><text x="265" y="78">M</text><text x="211" y="195">3</text><text x="265" y="125">4</text><text x="199" y="119">5</text><text x="270" y="297">(P)</text><text x="345" y="93">IH = 3, IM = 5</text><text x="345" y="128">HM² = IM² − IH²</text><text x="345" y="162" font-weight="bold">HM = 4</text><text x="345" y="213">H là tâm đường tròn giao.</text><text x="345" y="241">M là điểm trên mặt cầu.</text></g><text x="20" y="320" font-size="14">Đoạn xanh là vết cắt qua tâm đường tròn giao, không phải toàn bộ đường tròn.</text></g></svg>