<svg xmlns="http://www.w3.org/2000/svg" width="840" height="450" viewBox="0 0 840 450" role="img" aria-labelledby="t d"><title id="t">Khoảng cách từ M đến mặt phẳng</title><desc id="d">H là hình chiếu vuông góc của M xuống mặt phẳng z=0, Q là điểm khác H trên mặt phẳng. MH ngắn hơn MQ.</desc><rect width="840" height="450" rx="16" fill="#f6fafb"/><g font-family="Arial,sans-serif"><text x="28" y="39" fill="#18324b" font-size="25" font-weight="bold">Khoảng cách từ M đến mặt phẳng</text><polygon points="323,152.4 719,260.4 485,375.6 89,267.6" fill="#e0edf3" stroke="#66879c" stroke-width="2" /><line x1="412" y1="146.1" x2="600.5" y2="297.7" stroke="#9b611b" stroke-width="2" stroke-dasharray="7 5"/><line x1="412" y1="146.1" x2="412" y2="281.1" stroke="#b5453b" stroke-width="3" /><circle cx="412" cy="281.1" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><circle cx="412" cy="146.1" r="4.8" fill="#b5453b" stroke="#b5453b" stroke-width="1" /><circle cx="600.5" cy="297.7" r="4.8" fill="#18324b" stroke="#18324b" stroke-width="1" /><text x="392" y="305.1" fill="#18324b" font-size="19" >H</text><text x="420" y="139.1" fill="#b5453b" font-size="19" >M</text><text x="610.5" y="289.7" fill="#18324b" font-size="19" >Q</text><text x="422" y="213.6" fill="#b5453b" font-size="19" >d</text><text x="615" y="334" fill="#18324b" font-size="19" >(P)</text><polyline points="431.8,286.5 431.8,268.5 412,263.1" stroke="#18324b" stroke-width="1.5" fill="none" stroke-linejoin="round" /><text x="28" y="425" fill="#18324b" font-size="17" >MH theo pháp tuyến, MQ xiên; d(M,(P)) là độ dài MH.</text></g></svg>