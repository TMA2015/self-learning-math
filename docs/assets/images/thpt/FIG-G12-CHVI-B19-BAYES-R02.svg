<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img" aria-labelledby="t d"><title id="t">Bayes: chọn cột dương hoặc âm</title><desc id="d">10.000 bản ghi giả định, tỷ lệ nền 2%, nhạy 85%, đặc hiệu 95%. Hàng có đặc điểm 170 dương 30 âm, hàng không có đặc điểm 490 dương 9310 âm.</desc><rect width="840" height="380" rx="16" fill="#f7fafb"/><g font-family="Arial,sans-serif"><text x="28" y="38" fill="#18324b" font-size="26" font-weight="bold">Bayes: chọn cột dương hoặc âm</text><rect x="40" y="76" width="250" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="165" y="115" fill="#18324b" font-size="20" text-anchor="middle">Nhóm</text><rect x="290" y="76" width="170" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="375" y="115" fill="#18324b" font-size="20" text-anchor="middle">Dương (+)</text><rect x="460" y="76" width="170" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="545" y="115" fill="#18324b" font-size="20" text-anchor="middle">Âm (−)</text><rect x="630" y="76" width="170" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="715" y="115" fill="#18324b" font-size="20" text-anchor="middle">Tổng</text><rect x="40" y="138" width="250" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="165" y="177" fill="#18324b" font-size="20" text-anchor="middle">Có đặc điểm</text><rect x="290" y="138" width="170" height="62" rx="0" fill="#e3f2e9" stroke="#92a9b7"/><text x="375" y="177" fill="#197b56" font-size="20" text-anchor="middle">170</text><rect x="460" y="138" width="170" height="62" rx="0" fill="#fff" stroke="#92a9b7"/><text x="545" y="177" fill="#18324b" font-size="20" text-anchor="middle">30</text><rect x="630" y="138" width="170" height="62" rx="0" fill="#fff" stroke="#92a9b7"/><text x="715" y="177" fill="#18324b" font-size="20" text-anchor="middle">200</text><rect x="40" y="200" width="250" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="165" y="239" fill="#18324b" font-size="20" text-anchor="middle">Không đặc điểm</text><rect x="290" y="200" width="170" height="62" rx="0" fill="#e3f2e9" stroke="#92a9b7"/><text x="375" y="239" fill="#197b56" font-size="20" text-anchor="middle">490</text><rect x="460" y="200" width="170" height="62" rx="0" fill="#fff" stroke="#92a9b7"/><text x="545" y="239" fill="#18324b" font-size="20" text-anchor="middle">9310</text><rect x="630" y="200" width="170" height="62" rx="0" fill="#fff" stroke="#92a9b7"/><text x="715" y="239" fill="#18324b" font-size="20" text-anchor="middle">9800</text><rect x="40" y="262" width="250" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="165" y="301" fill="#18324b" font-size="20" text-anchor="middle">Tổng</text><rect x="290" y="262" width="170" height="62" rx="0" fill="#edf0f3" stroke="#92a9b7"/><text x="375" y="301" fill="#197b56" font-size="20" text-anchor="middle">660</text><rect x="460" y="262" width="170" height="62" rx="0" fill="#edf0f3" stroke="#92a9b7"/><text x="545" y="301" fill="#18324b" font-size="20" text-anchor="middle">9340</text><rect x="630" y="262" width="170" height="62" rx="0" fill="#edf0f3" stroke="#92a9b7"/><text x="715" y="301" fill="#18324b" font-size="20" text-anchor="middle">10000</text><text x="28" y="359" fill="#18324b" font-size="18" >Biết dương: 170/660; biết âm: 9310/9340 là tỷ lệ không có đặc điểm.</text></g></svg>