<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 320" role="img" aria-labelledby="t d"><title id="t">Gấp hộp không nắp từ tấm bìa 30 nhân 20</title><desc id="d">Tấm bìa 30 cm nhân 20 cm; bốn hình vuông cạnh x được cắt đi; đáy rộng 30 trừ 2x nhân 20 trừ 2x, chiều cao x.</desc><rect width="650" height="320" rx="10" fill="#fff"/><g font-family="sans-serif" font-size="17" fill="#23445d"><text x="20" y="27" font-weight="bold">Tấm bìa trước khi gấp</text><text x="407" y="27" font-weight="bold">Hộp sau khi gấp</text><rect x="45" y="62" width="270" height="180" fill="#e9f4f8" stroke="#43778e" stroke-width="2"/><g fill="#ffe1ce" stroke="#b7633b" stroke-dasharray="4 3"><rect x="45" y="62" width="36" height="36"/><rect x="279" y="62" width="36" height="36"/><rect x="45" y="206" width="36" height="36"/><rect x="279" y="206" width="36" height="36"/></g><rect x="81" y="98" width="198" height="108" fill="#cfe8f0" stroke="#43778e" stroke-dasharray="6 4"/><text x="180" y="145" text-anchor="middle">30 − 2x</text><text x="180" y="171" text-anchor="middle">20 − 2x</text><text x="63" y="84" text-anchor="middle">x</text><path d="M45 50H315 M45 45V55 M315 45V55 M32 62V242 M27 62H37 M27 242H37" fill="none" stroke="#52697b"/><text x="180" y="44" text-anchor="middle">30 cm</text><text x="22" y="152" transform="rotate(-90 22 152)" text-anchor="middle">20 cm</text><path d="M342 151h42l-10 -6m10 6l-10 6" fill="none" stroke="#527086" stroke-width="2"/><path d="M414 124l122 -25 76 44 -122 26Z" fill="#eef7fa" stroke="#326c89" stroke-width="2"/><path d="M414 124l122 -25 0 43 -87 18Z" fill="#a7cdda" stroke="#326c89" stroke-width="1.3"/><path d="M536 99l76 44 -35 33 -41 -34Z" fill="#c6e1eb" stroke="#326c89" stroke-width="1.3"/><path d="M449 160l87 -18 41 34 -87 18Z" fill="#dceef4" stroke="#326c89" stroke-width="1.3"/><path d="M414 124v70l76 44v-69Z" fill="#dceef4" stroke="#326c89" stroke-width="2"/><path d="M490 169v69l122 -26v-69Z" fill="#9dc9db" stroke="#326c89" stroke-width="2"/><path d="M414 124l76 45 122 -26 -76 -44Z" fill="none" stroke="#326c89" stroke-width="2"/><path d="M624 144v68m-5 -68h10m-10 68h10" stroke="#52697b"/><text x="632" y="183">x</text><text x="511" y="267" text-anchor="middle">Đáy: (30 − 2x) × (20 − 2x)</text><text x="45" y="292" fill="#95502d">Ô màu cam: phần bỏ đi. Nét đứt: đường gấp.</text></g></svg>