<svg xmlns="http://www.w3.org/2000/svg" width="840" height="435" viewBox="0 0 840 435" role="img" aria-labelledby="t d"><title id="t">Quản trò mở cửa 3 (H)</title><desc id="d">Ba cửa; xe được đặt đều, quản trò chọn đều trong các cửa chưa chọn có lừa. Cột xác suất H và giao theo từng vị trí xe.</desc><rect width="840" height="435" rx="16" fill="#f7fafb"/><g font-family="Arial,sans-serif"><text x="28" y="38" fill="#18324b" font-size="26" font-weight="bold">Quản trò mở cửa 3 (H)</text><rect x="40" y="74" width="260" height="54" rx="0" fill="#e1edf4" stroke="#91a9b8"/><text x="170" y="109" fill="#18324b" font-size="18" text-anchor="middle">Xe sau cửa</text><rect x="300" y="74" width="158" height="54" rx="0" fill="#e1edf4" stroke="#91a9b8"/><text x="379" y="109" fill="#18324b" font-size="18" text-anchor="middle">P(Eᵢ)</text><rect x="458" y="74" width="170" height="54" rx="0" fill="#e1edf4" stroke="#91a9b8"/><text x="543" y="109" fill="#18324b" font-size="18" text-anchor="middle">P(H | Eᵢ)</text><rect x="628" y="74" width="172" height="54" rx="0" fill="#e1edf4" stroke="#91a9b8"/><text x="714" y="109" fill="#18324b" font-size="18" text-anchor="middle">P(Eᵢ ∩ H)</text><rect x="40" y="128" width="260" height="54" rx="0" fill="#e1edf4" stroke="#91a9b8"/><text x="170" y="163" fill="#18324b" font-size="18" text-anchor="middle">1 (đã chọn)</text><rect x="300" y="128" width="158" height="54" rx="0" fill="#fff" stroke="#91a9b8"/><text x="379" y="163" fill="#18324b" font-size="18" text-anchor="middle">1/3</text><rect x="458" y="128" width="170" height="54" rx="0" fill="#fff" stroke="#91a9b8"/><text x="543" y="163" fill="#18324b" font-size="18" text-anchor="middle">1/2</text><rect x="628" y="128" width="172" height="54" rx="0" fill="#e3f2e9" stroke="#91a9b8"/><text x="714" y="163" fill="#18324b" font-size="18" text-anchor="middle">1/6</text><rect x="40" y="182" width="260" height="54" rx="0" fill="#e1edf4" stroke="#91a9b8"/><text x="170" y="217" fill="#18324b" font-size="18" text-anchor="middle">2 (cửa còn lại)</text><rect x="300" y="182" width="158" height="54" rx="0" fill="#fff" stroke="#91a9b8"/><text x="379" y="217" fill="#18324b" font-size="18" text-anchor="middle">1/3</text><rect x="458" y="182" width="170" height="54" rx="0" fill="#fff" stroke="#91a9b8"/><text x="543" y="217" fill="#18324b" font-size="18" text-anchor="middle">1</text><rect x="628" y="182" width="172" height="54" rx="0" fill="#e3f2e9" stroke="#91a9b8"/><text x="714" y="217" fill="#197b56" font-size="18" text-anchor="middle">1/3</text><rect x="40" y="236" width="260" height="54" rx="0" fill="#e1edf4" stroke="#91a9b8"/><text x="170" y="271" fill="#18324b" font-size="18" text-anchor="middle">3 (cửa mở)</text><rect x="300" y="236" width="158" height="54" rx="0" fill="#fff" stroke="#91a9b8"/><text x="379" y="271" fill="#18324b" font-size="18" text-anchor="middle">1/3</text><rect x="458" y="236" width="170" height="54" rx="0" fill="#fff" stroke="#91a9b8"/><text x="543" y="271" fill="#18324b" font-size="18" text-anchor="middle">0</text><rect x="628" y="236" width="172" height="54" rx="0" fill="#fff" stroke="#91a9b8"/><text x="714" y="271" fill="#18324b" font-size="18" text-anchor="middle">0</text><rect x="40" y="290" width="260" height="54" rx="0" fill="#e1edf4" stroke="#91a9b8"/><text x="170" y="325" fill="#18324b" font-size="18" text-anchor="middle">Tổng giao</text><rect x="300" y="290" width="158" height="54" rx="0" fill="#eef2f5" stroke="#91a9b8"/><text x="379" y="325" fill="#18324b" font-size="18" text-anchor="middle"></text><rect x="458" y="290" width="170" height="54" rx="0" fill="#eef2f5" stroke="#91a9b8"/><text x="543" y="325" fill="#18324b" font-size="18" text-anchor="middle"></text><rect x="628" y="290" width="172" height="54" rx="0" fill="#eef2f5" stroke="#91a9b8"/><text x="714" y="325" fill="#18324b" font-size="18" text-anchor="middle">1/2</text><text x="47" y="372" fill="#197b56" font-size="20" >Sau quan sát H: giữ = (1/6)/(1/2) = 1/3; đổi = (1/3)/(1/2) = 2/3.</text><text x="28" y="414" fill="#18324b" font-size="18" >Nếu quy tắc quản trò thay đổi thì phải tính lại các trọng số giao.</text></g></svg>