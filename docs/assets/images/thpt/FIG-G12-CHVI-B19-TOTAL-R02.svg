<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-labelledby="t d"><title id="t">Xác suất toàn phần theo hai nguồn</title><desc id="d">Nguồn A tỷ trọng 0,6, lỗi 0,02; nguồn B tỷ trọng 0,4, lỗi 0,05. Hai lá lỗi có xác suất 0,012 và 0,020.</desc><rect width="840" height="440" rx="16" fill="#f7fafb"/><g font-family="Arial,sans-serif"><text x="28" y="38" fill="#18324b" font-size="26" font-weight="bold">Xác suất toàn phần theo hai nguồn</text><rect x="28" y="194" width="150" height="48" rx="6" fill="#e2edf4" stroke="#176c9b"/><text x="103" y="225" fill="#176c9b" font-size="17" text-anchor="middle">Nguồn</text><line x1="178" y1="218" x2="357" y2="130" stroke="#176c9b" stroke-width="2"/><rect x="357" y="109" width="133" height="42" rx="6" fill="#e1edf4" stroke="#176c9b"/><text x="423" y="136" fill="#176c9b" font-size="18" text-anchor="middle">Nguồn A</text><text x="255" y="162" fill="#176c9b" font-size="18" text-anchor="middle">0,6</text><line x1="490" y1="130" x2="626" y2="88" stroke="#197b56" stroke-width="2"/><text x="548" y="100" fill="#197b56" font-size="17" text-anchor="middle">0,02</text><rect x="626" y="63" width="184" height="50" rx="5" fill="#e3f2e9" stroke="#197b56"/><text x="718" y="86" fill="#197b56" font-size="17" text-anchor="middle">Lỗi</text><text x="718" y="105" fill="#197b56" font-size="16" text-anchor="middle">0,012</text><line x1="490" y1="130" x2="626" y2="171" stroke="#18324b" stroke-width="2"/><text x="548" y="170.5" fill="#18324b" font-size="17" text-anchor="middle">0,98</text><rect x="626" y="146" width="184" height="50" rx="5" fill="#eef2f5" stroke="#18324b"/><text x="718" y="169" fill="#18324b" font-size="17" text-anchor="middle">Không lỗi</text><text x="718" y="188" fill="#18324b" font-size="16" text-anchor="middle">0,588</text><line x1="178" y1="218" x2="357" y2="306" stroke="#176c9b" stroke-width="2"/><rect x="357" y="285" width="133" height="42" rx="6" fill="#e1edf4" stroke="#176c9b"/><text x="423" y="312" fill="#176c9b" font-size="18" text-anchor="middle">Nguồn B</text><text x="255" y="283" fill="#176c9b" font-size="18" text-anchor="middle">0,4</text><line x1="490" y1="306" x2="626" y2="265" stroke="#197b56" stroke-width="2"/><text x="548" y="276.5" fill="#197b56" font-size="17" text-anchor="middle">0,05</text><rect x="626" y="240" width="184" height="50" rx="5" fill="#e3f2e9" stroke="#197b56"/><text x="718" y="263" fill="#197b56" font-size="17" text-anchor="middle">Lỗi</text><text x="718" y="282" fill="#197b56" font-size="16" text-anchor="middle">0,020</text><line x1="490" y1="306" x2="626" y2="348" stroke="#18324b" stroke-width="2"/><text x="548" y="347" fill="#18324b" font-size="17" text-anchor="middle">0,95</text><rect x="626" y="323" width="184" height="50" rx="5" fill="#eef2f5" stroke="#18324b"/><text x="718" y="346" fill="#18324b" font-size="17" text-anchor="middle">Không lỗi</text><text x="718" y="365" fill="#18324b" font-size="16" text-anchor="middle">0,380</text><text x="28" y="419" fill="#18324b" font-size="18" >Cộng đúng các lá lỗi: 0,012 + 0,020 = 0,032. Tổng cả bốn lá = 1.</text></g></svg>