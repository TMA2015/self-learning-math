<title id="title">Đồ thị tiến sát đường tiệm cận xiên</title><desc id="desc">Hàm y=x−1+2/(x+1). Hai nhánh tách tại x=−1, cùng tiến sát y=x−1 khi đi ra xa. Độ chênh tung độ tại x=1 là 1 và tại x=5 là 1/3.</desc>
