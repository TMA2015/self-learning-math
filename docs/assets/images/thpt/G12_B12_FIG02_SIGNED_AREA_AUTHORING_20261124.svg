<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 365" role="img" aria-labelledby="t d"><title id="t">Tích phân có dấu và tích phân trị tuyệt đối</title><desc id="d">Đường y=x từ -2 tới 2. Tam giác bên trái dưới trục có diện tích 2 và tích phân -2, tam giác bên phải diện tích 2 và tích phân +2. Tổng tích phân 0; tổng diện tích 4.</desc><rect width="650" height="365" rx="10" fill="white"/><g font-family="sans-serif" fill="#23445d"><text x="20" y="29" font-size="20" font-weight="bold">Cùng hai miền, hai cách cộng</text><path d="M105 175L105 295L225 175Z" fill="#f3cfb9"/><path d="M225 175L345 55L345 175Z" fill="#b9dfd3"/><g stroke="#607989" fill="none" stroke-width="1.7"><path d="M65 175H387l-8 -4m8 4l-8 4 M225 320V44l-4 8m4 -8l4 8"/></g><path d="M85 315L365 35" stroke="#176b9b" stroke-width="3"/><g stroke="#607989" stroke-dasharray="5 4" fill="none"><path d="M105 175V295H225 M345 175V55H225"/></g><g font-size="15"><text x="105" y="166" text-anchor="middle">−2</text><text x="230" y="193">0</text><text x="345" y="193" text-anchor="middle">2</text><text x="209" y="60" text-anchor="end">2</text><text x="209" y="300" text-anchor="end">−2</text><text x="390" y="180">x</text><text x="232" y="45">y</text><text x="370" y="48" fill="#176b9b">y=x</text><text x="124" y="205" fill="#a34b2d">−2</text><text x="302" y="145" fill="#16765e">+2</text></g><g font-size="17"><text x="405" y="100" font-weight="bold">Tích phân có dấu</text><text x="405" y="127">−2 + 2 = 0</text><text x="405" y="215" font-weight="bold">Tổng diện tích</text><text x="405" y="242">2 + 2 = 4</text></g><text x="20" y="348" font-size="15">Mỗi tam giác có diện tích 2; dấu âm chỉ phần tích phân dưới Ox.</text></g></svg>