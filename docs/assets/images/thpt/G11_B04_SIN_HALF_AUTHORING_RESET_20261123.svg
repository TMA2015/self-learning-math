<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">Đồ thị sin x = 1/2 trong một chu kì</title>
<desc id="desc">Đường cong y=sin x và đường ngang y=1/2 trên đoạn x từ 0 đến 2π. Hai giao điểm được đánh dấu tại x=π/6 và x=5π/6; qua những giao điểm này suy ra hai họ nghiệm.</desc>
