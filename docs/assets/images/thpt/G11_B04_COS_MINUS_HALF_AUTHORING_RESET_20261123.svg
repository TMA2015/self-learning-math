<svg xmlns="http://www.w3.org/2000/svg" width="760" height="350" viewBox="0 0 760 350" role="img" aria-labelledby="title desc">
<title id="title">Đồ thị cos x = -1/2 trong một chu kì</title>
<desc id="desc">Đường cong y=cos x và đường ngang y=-1/2 trên đoạn x từ 0 đến 2π. Hai giao điểm được đánh dấu tại x=2π/3 và x=4π/3; qua những giao điểm này suy ra hai họ nghiệm.</desc>
