<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510" role="img" aria-labelledby="t d"><title id="t">Vị trí Q1 và Q3 trong tần số tích lũy</title><desc id="d">Bốn nhóm [10;15),[15;20),[20;25),[25;30) có tần số 6,14,12,8 và tần số tích lũy 6,20,32,40. Mốc n/4=10 thuộc nhóm thứ hai, 3n/4=30 thuộc nhóm thứ ba.</desc><rect width="1100" height="510" rx="22" fill="#f6f9fb"/><text x="36" y="58" fill="#182d48" font-size="30" font-family="DejaVu Sans">Bài 9 · Xác định nhóm của Q₁, Q₃</text><text x="36" y="99" fill="#43576e" font-size="20" font-family="DejaVu Sans">Ví dụ minh họa: n = 40; n/4 = 10; 3n/4 = 30</text><line x1="110" y1="409" x2="930" y2="409" stroke="#576c84" stroke-width="4"/><line x1="110" y1="132" x2="110" y2="410" stroke="#576c84" stroke-width="4"/><g font-family="DejaVu Sans" font-size="22" text-anchor="middle"><rect x="160" y="363" width="155" height="46" fill="#bddae8"/><rect x="344" y="302" width="155" height="107" fill="#9fd1c0"/><rect x="528" y="210" width="155" height="199" fill="#e9ca9e"/><rect x="712" y="149" width="155" height="260" fill="#bec3ee"/><text x="238" y="443">[10;15)</text><text x="422" y="443">[15;20)</text><text x="606" y="443">[20;25)</text><text x="790" y="443">[25;30)</text><text x="238" y="351">6</text><text x="422" y="290">20</text><text x="606" y="198">32</text><text x="790" y="137">40</text></g><line x1="120" y1="330" x2="920" y2="330" stroke="#0d9671" stroke-width="3" stroke-dasharray="12 7"/><text x="933" y="336" fill="#0d9671" font-size="21" font-family="DejaVu Sans">10 → Q₁</text><line x1="120" y1="222" x2="920" y2="222" stroke="#bd6337" stroke-width="3" stroke-dasharray="12 7"/><text x="933" y="228" fill="#bd6337" font-size="21" font-family="DejaVu Sans">30 → Q₃</text><text x="42" y="485" fill="#40556b" font-size="17" font-family="DejaVu Sans">Cột: tần số tích lũy; Q là ước lượng nội suy trong nhóm, không phải số liệu gốc.</text></svg>