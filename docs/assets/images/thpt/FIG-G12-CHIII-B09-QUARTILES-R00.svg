<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 390" role="img" aria-labelledby="t d"><title id="t">Nội suy tứ phân vị từ tần số tích lũy</title><desc id="d">Các điểm (10;0), (15;6), (20;20), (25;32), (30;40). Mốc 10 cắt đoạn từ 15 đến 20 tại Q1 xấp xỉ 16,43; mốc 30 cắt đoạn từ 20 đến 25 tại Q3 xấp xỉ 24,17.</desc><rect width="680" height="390" rx="10" fill="white"/><g font-family="sans-serif" fill="#23445d"><text x="20" y="28" font-size="20" font-weight="bold">Từ tần số tích lũy đến Q₁ và Q₃</text><text x="20" y="55" font-size="15">Nối các mốc bằng đoạn thẳng để nội suy trong từng nhóm.</text><g stroke="#d5e1e8" fill="none"><path d="M80 300H560"/><path d="M80 250H560"/><path d="M80 200H560"/><path d="M80 150H560"/><path d="M80 100H560"/></g><g fill="none" stroke="#60798c" stroke-width="1.7"><path d="M80 310V83l-5 9m5 -9l5 9 M70 300H580l-9 -5m9 5l-9 5"/></g><g font-size="15"><text x="68" y="305" text-anchor="end">0</text><text x="68" y="255" text-anchor="end">10</text><text x="68" y="205" text-anchor="end">20</text><text x="68" y="155" text-anchor="end">30</text><text x="68" y="105" text-anchor="end">40</text><text x="80" y="324" text-anchor="middle">10</text><text x="200" y="324" text-anchor="middle">15</text><text x="320" y="324" text-anchor="middle">20</text><text x="440" y="324" text-anchor="middle">25</text><text x="560" y="324" text-anchor="middle">30</text><text x="85" y="82">Tần số tích lũy</text><text x="585" y="306">Giá trị</text></g><polyline points="80,300 200,270 320,200 440,140 560,100" stroke="#176b9b" stroke-width="3" fill="none"/><g fill="#176b9b"><circle cx="80" cy="300" r="4.5"/><circle cx="200" cy="270" r="4.5"/><circle cx="320" cy="200" r="4.5"/><circle cx="440" cy="140" r="4.5"/><circle cx="560" cy="100" r="4.5"/></g><g font-size="15"><text x="182" y="259">6</text><text x="327" y="190">20</text><text x="448" y="130">32</text><text x="567" y="92">40</text></g><g stroke-width="2.3" fill="none" stroke-dasharray="6 4"><path d="M80 250H234.28571428571425V300" stroke="#21806b"/><path d="M80 150H420V300" stroke="#b45a31"/></g><g font-size="15" font-weight="bold"><circle cx="234.28571428571425" cy="250" r="5" fill="#21806b"/><circle cx="420" cy="150" r="5" fill="#b45a31"/><text x="234.28571428571425" y="350" text-anchor="middle" fill="#21806b">Q₁ ≈ 16,43</text><text x="420" y="350" text-anchor="middle" fill="#b45a31">Q₃ ≈ 24,17</text></g><text x="20" y="376" font-size="14">Mốc n/4 = 10 và 3n/4 = 30 nằm trong hai nhóm khác nhau.</text></g></svg>