<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img" aria-labelledby="t d"><title id="t">Bảng 2×2: chọn đúng mẫu số</title><desc id="d">Bảng số học sinh theo đi xe buýt và kết quả đạt, tổng các hàng và cột.</desc><rect width="840" height="380" rx="16" fill="#f7fafb"/><g font-family="Arial,sans-serif"><text x="28" y="38" fill="#18324b" font-size="26" font-weight="bold">Bảng 2×2: chọn đúng mẫu số</text><rect x="40" y="76" width="250" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="165" y="115" fill="#18324b" font-size="20" text-anchor="middle">Nhóm</text><rect x="290" y="76" width="170" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="375" y="115" fill="#18324b" font-size="20" text-anchor="middle">Đạt</text><rect x="460" y="76" width="170" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="545" y="115" fill="#18324b" font-size="20" text-anchor="middle">Chưa đạt</text><rect x="630" y="76" width="170" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="715" y="115" fill="#18324b" font-size="20" text-anchor="middle">Tổng</text><rect x="40" y="138" width="250" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="165" y="177" fill="#18324b" font-size="20" text-anchor="middle">Xe buýt</text><rect x="290" y="138" width="170" height="62" rx="0" fill="#e3f2e9" stroke="#92a9b7"/><text x="375" y="177" fill="#197b56" font-size="20" text-anchor="middle">24</text><rect x="460" y="138" width="170" height="62" rx="0" fill="#fff" stroke="#92a9b7"/><text x="545" y="177" fill="#18324b" font-size="20" text-anchor="middle">16</text><rect x="630" y="138" width="170" height="62" rx="0" fill="#e3f2e9" stroke="#92a9b7"/><text x="715" y="177" fill="#197b56" font-size="20" text-anchor="middle">40</text><rect x="40" y="200" width="250" height="62" rx="0" fill="#e0edf3" stroke="#92a9b7"/><text x="165" y="239" fill="#18324b" font-size="20" text-anchor="middle">Không xe buýt</text><rect x="290" y="200" 