<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="ttl ds"><title id="ttl">Trọng tâm tứ diện ABCD</title><desc id="ds">G là giao các đường trung tuyến tam giác BCD. I nằm trên AG với AI bằng ba phần tư AG và IG bằng một phần tư AG. Hình chiếu minh họa, không dùng thước đo góc hoặc khoảng cách thật.</desc><rect width="840" height="520" rx="24" fill="#f6fafb"/><g font-family="Arial,sans-serif" font-size="21" fill="#17324d"><text x="30" y="42" font-size="24" font-weight="bold">Trọng tâm tứ diện: từ trọng tâm đáy đến I</text><polygon points="110,387 680,387 480,225" fill="#dbeafe" fill-opacity=".7" stroke="#64748b" stroke-width="2"/><line x1="330" y1="85" x2="110" y2="387" stroke="#64748b" stroke-width="2.5"/><line x1="330" y1="85" x2="680" y2="387" stroke="#64748b" stroke-width="2.5"/><line x1="330" y1="85" x2="480" y2="225" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 6"/><line x1="110" y1="387" x2="580" y2="306" stroke="#6b95b7" stroke-width="2" stroke-dasharray="6 5"/><line x1="680" y1="387" x2="295" y2="306" stroke="#6b95b7" stroke-width="2" stroke-dasharray="6 5"/><line x1="480" y1="225" x2="395" y2="387" stroke="#6b95b7" stroke-width="2" stroke-dasharray="6 5"/><line x1="330" y1="85" x2="400" y2="271" stroke="#176d99" stroke-width="5"/><line x1="400" y1="271" x2="423.3333333333333" y2="333" stroke="#b84438" stroke-width="5"/><circle cx="330" cy="85" r="4" fill="#17324d"/><circle cx="110" cy="387" r="4" fill="#17324d"/><circle cx="680" cy="387" r="4" fill="#17324d"/><circle cx="480" cy="225" r="4" fill="#17324d"/><circle cx="423.3333333333333" cy="333" r="6" fill="#176d99"/><circle cx="400" cy="271" r="6" fill="#b84438"/><text x="305" y="77" >A</text><text x="84" y="406" >B</text><text x="689" y="407" >C</text><text x="493" y="220" >D</text><text x="435.3333333333333" y="354" font-weight="bold" fill="#176d99">G</text><text x="371" y="263" font-weight="bold" fill="#b84438">I</text><text x="523" y="106" font-size="19">G: trọng tâm BCD</text><text x="523" y="135" font-size="19" fill="#176d99">AI = 3AG/4</text><text x="523" y="164" font-size="19" fill="#b84438">IG = AG/4</text><text x="30" y="455" font-size="19">I là điểm cân bằng của bốn đỉnh A, B, C, D.</text><text x="30" y="487" font-size="17">Nét phụ chỉ trung tuyến; hình không dùng để đo độ dài thực.</text></g></svg>