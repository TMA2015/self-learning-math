<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="t d">
<title id="t">Quy tắc cộng và quy tắc nhân trong chọn câu lạc bộ</title><desc id="d">Bốn lựa chọn nghệ thuật và ba lựa chọn thể thao. Nếu chọn một môn thuộc đúng một trong hai nhóm không trùng nhau thì có 4+3=7 cách. Nếu chọn một môn ở mỗi nhóm thì có 4 nhân 3 bằng 12 cặp.</desc><rect width="760" height="350" rx="20" fill="#ffffff"/><text x="28" y="40" fill="#1d3c68" font-family="Arial,sans-serif" font-size="23" font-weight="700">Đếm một lựa chọn hay một cặp lựa chọn?</text>
<rect x="35" y="78" width="326" height="218" fill="#e7f1ff" stroke="#6b9ac6" rx="16"/><rect x="398" y="78" width="326" height="218" fill="#ecf8ed" stroke="#6baf91" rx="16"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#193b61"><text x="54" y="111" font-weight="700">Chọn một môn (hoặc)</text><text x="415" y="111" font-weight="700">Chọn hai môn (và)</text><text x="54" y="151">4 môn nghệ thuật</text><text x="54" y="183">3 môn thể thao</text><text x="54" y="232" font-size="26" font-weight="700">4 + 3 = 7 cách</text><text x="415" y="151">4 chọn nghệ thuật</text><text x="415" y="183">3 chọn thể thao</text><text x="415" y="232" font-size="26" font-weight="700">4 × 3 = 12 cặp</text></g><text x="28" y="331" font-family="Arial,sans-serif" font-size="17" fill="#435c78">Cộng khi nhóm lựa chọn không trùng; nhân khi một kết quả gồm đủ các bước.</text></svg>