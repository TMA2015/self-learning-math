<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">Quỹ tích hypebol hai trạm tín hiệu, nhánh phải khi tín hiệu từ B đến máy thu trước</title>
<desc id="desc">Hai trạm A âm 50 và B dương 50 km. Hypebol x bình phương trên 900 trừ y bình phương trên 1600 bằng 1, đỉnh ở âm 30 và dương 30, hai nhánh. Khi tín hiệu từ B đến máy thu trước, hiệu PA trừ PB bằng 60 km, người thu ở nhánh phải; không xác định duy nhất một điểm.</desc>
