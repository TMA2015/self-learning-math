<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img" aria-labelledby="t d"><title id="t">Góc đường thẳng với mặt phẳng trong thiết diện vuông góc</title><desc id="d">Mặt phẳng z=0. Đường OM qua O(0;0;0), M(3;0;4). H(3;0;0) là hình chiếu. Tam giác OHM có cạnh 3,4,5. Góc MOH là 53,1 độ, góc giữa OM và pháp tuyến thẳng đứng qua O là 36,9 độ, hai góc phụ nhau.</desc><rect width="680" height="330" rx="10" fill="white"/><g font-family="sans-serif" fill="#23445d"><text x="20" y="29" font-size="20" font-weight="bold">Góc với mặt phẳng là góc với hình chiếu</text><path d="M67 260H390L322 292H22Z" fill="#e2edf2" stroke="#8aa8b8"/><text x="58" y="284" font-size="15">(P): z=0</text><path d="M100 260L265 40L265 260Z" fill="#e6f4ef" stroke="#7daea0"/><path d="M100 260L265 40" stroke="#176b9b" stroke-width="3.5"/><path d="M100 260H265" stroke="#21836c" stroke-width="3"/><path d="M265 260V40" stroke="#607989" stroke-width="2" stroke-dasharray="5 4"/><path d="M100 260V49" stroke="#b25c32" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M100 49l-5 9m5-9l5 9" stroke="#b25c32" stroke-width="2" fill="none"/><path d="M250 260V245H265" stroke="#607989" stroke-width="1.5" fill="none"/><path d="M146 260 A46 46 0 0 0 127.6 223.2" stroke="#21836c" fill="none" stroke-width="2.5"/><path d="M100 200 A60 60 0 0 1 136 212" stroke="#b25c32" fill="none" stroke-width="2.5"/><g font-size="16"><text x="85" y="278">O</text><text x="272" y="37">M</text><text x="272" y="278">H</text><text x="80" y="47" fill="#b25c32">n</text><text x="183" y="144" fill="#176b9b">5</text><text x="276" y="152">4</text><text x="179" y="252">3</text><text x="148" y="236" fill="#21836c">θ</text><text x="109" y="190" fill="#b25c32">α</text><text x="400" y="85">θ + α = 90°</text><text x="400" y="125" font-weight="bold">sin θ = 4/5</text><text x="400" y="155">cos α = 4/5</text><text x="400" y="205">θ ≈ 53,1°</text><text x="400" y="233">α ≈ 36,9°</text></g><text x="20" y="316" font-size="14">Hình vẽ trong mặt phẳng Oxyz có y=0; dải xanh nhạt gợi mặt phẳng (P).</text></g></svg>