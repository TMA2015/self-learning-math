<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" role="img" aria-labelledby="ti de"><title id="ti">G12 B02: GTLN và GTNN của f=x²−4x+1 trên đoạn [0,5]</title><desc id="de">Parabol trên đoạn đóng 0 đến 5, đỉnh (2,-3) là giá trị nhỏ nhất -3, điểm biên x=5 có f=6 là giá trị lớn nhất; f(0)=1. Hai đầu đoạn được lấy, không bỏ quên chúng khi so sánh ứng viên.</desc><rect width="840" height="470" fill="white"/><text x="24" y="31" font-family="sans-serif" font-size="22" fill="#264863">f(x)=x²−4x+1, miền xét [0,5]</text><line x1="65" y1="270" x2="640" y2="270" stroke="#526d82" stroke-width="2"/><line x1="95" y1="36" x2="95" y2="448" stroke="#526d82" stroke-width="2"/><polyline points="95.00,229.00 98.33,234.42 101.67,239.75 105.00,244.99 108.33,250.14 111.67,255.19 115.00,260.16 118.33,265.03 121.67,269.82 125.00,274.51 128.33,279.11 131.67,283.62 135.00,288.04 138.33,292.37 141.67,296.60 145.00,300.75 148.33,304.80 151.67,308.77 155.00,312.64 158.33,316.42 161.67,320.11 165.00,323.71 168.33,327.22 171.67,330.63 175.00,333.96 178.33,337.19 181.67,340.34 185.00,343.39 188.33,346.35 191.67,349.22 195.00,352.00 198.33,354.69 201.67,357.28 205.00,359.79 208.33,362.20 211.67,364.53 215.00,366.76 218.33,368.90 221.67,370.95 225.00,372.91 228.33,374.78 231.67,376.55 235.00,378.24 238.33,379.83 241.67,381.34 245.00,382.75 248.33,384.07 251.67,385.30 255.00,386.44 258.33,387.49 261.67,388.44 265.00,389.31 268.33,390.08 271.67,390.77 275.00,391.36 278.33,391.86 281.67,392.27 285.00,392.59 288.33,392.82 291.67,392.95 295.00,393.00 298.33,392.95 301.67,392.82 305.00,392.59 308.33,392.27 311.67,391.86 315.00,391.36 318.33,390.77 321.67,390.08 325.00,389.31 328.33,388.44 331.67,387.49 335.00,386.44 338.33,385.30 341.67,384.07 345.00,382.75 348.33,381.34 351.67,379.83 355.00,378.24 358.33,376.55 361.67,374.78 365.00,372.91 368.33,370.95 371.67,368.90 375.00,366.76 378.33,364.53 381.67,362.20 385.00,359.79 388.33,357.28 391.67,354.69 395.00,352.00 398.33,349.22 401.67,346.35 405