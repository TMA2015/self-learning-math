<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
<title id="title">Sơ đồ cây xác suất toàn phần cho hai nguồn sản phẩm X và Y</title>
<desc id="desc">Nguồn X chiếm 30 phần trăm, xác suất lỗi khi từ X là 2 phần trăm. Nguồn Y chiếm 70 phần trăm, xác suất lỗi khi từ Y là 4 phần trăm. Nhân xác suất dọc mỗi nhánh được X lỗi 0,006, X tốt 0,294, Y lỗi 0,028, Y tốt 0,672. Cộng các lá lỗi được 0,034.</desc>
<rect x="1" y="1" width="998" height="498" rx="12" fill="#fff" stroke="#77818a" stroke-width="2"/>
<g font-family="Arial,sans-serif" fill="#202b35">
<text x="24" y="38" font-size="22" font-weight="bold">Cây xác suất toàn phần: nhân theo nhánh, cộng các trường hợp lỗi</text>
<text x="24" y="68" font-size="16">Ví dụ đã giải · chọn ngẫu nhiên một sản phẩm từ hai nguồn X và Y</text>
</g>
<g stroke="#6b7680" stroke-width="2.5" stroke-linecap="round" fill="none">
<path d="M140 250 L350 132 M140 250 L350 368"/>
<path d="M398 132 L668 95 M398 132 L668 185"/>
<path d="M398 368 L668 321 M398 368 L668 417"/>
</g>
<g font-family="Arial,sans-serif" fill="#202b35" stroke="#77818a" stroke-width="1.4">
<rect x="36" y="231" width="109" height="38" rx="8" fill="#fff"/><text x="51" y="255" font-size="17" stroke="none">Bắt đầu</text>
<rect x="349" y="113" width="62" height="38" rx="7" fill="#fff"/><text x="370" y="139" font-size="18" stroke="none">X</text>
<rect x="349" y="349" width="62" height="38" rx="7" fill="#fff"/><text x="370" y="375" font-size="18" stroke="none">Y</text>
</g>
<g font-family="Arial,sans-serif" font-size="16" fill="#2d3844">
<text x="215" y="166">P(X)=0,30</text><text x="215" y="330">P(Y)=0,70</text>
<text x="487" y="101">P(lỗi | X)=0,02</text><text x="486" y="199">P(tốt | X)=0,98</text>
<text x="485" y="312">P(lỗi | Y)=0,04</text><text x="484" y="423">P(tốt | Y)=0,96</text>
</g>
<g font-family="Arial,sans-serif" font-size="17" fill="#202b35" stroke="#707981" stroke-width="1.2">
<rect x="669" y="75" width="300" height="44" rx="6" fill="#f0f2f4"/><text x="682" y="103" stroke="none">X và lỗi: 0,30 × 0,02 = 0,006</text>
<rect x="669" y="166" width="300" height="44" rx="6" fill="#fff"/><text x="682" y="194" stroke="none">X và tốt: 0,30 × 0,98 = 0,294</text>
<rect x="669" y="300" width="300" height="44" rx="6" fill="#f0f2f4"/><text x="682" y="328" stroke="none">Y và lỗi: 0,70 × 0,04 = 0,028</text>
<rect x="669" y="399" width="300" height="44" rx="6" fill="#fff"/><text x="682" y="427" stroke="none">Y và tốt: 0,70 × 0,96 = 0,672</text>
</g>
<g font-family="Arial,sans-serif" fill="#202b35">
<text x="27" y="467" font-size="19" font-weight="bold">P(lỗi) = 0,006 + 0,028 = 0,034 = 3,4%</text>
<text x="597" y="466" font-size="14">Tổng bốn lá = 1</text>
</g>
</svg>