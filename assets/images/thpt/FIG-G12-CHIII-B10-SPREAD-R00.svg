<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 410" role="img" aria-labelledby="t d"><title id="t">Cùng trung bình, khác độ phân tán</title><desc id="d">Giá trị đại diện 10,20,30,40,50. Mẫu A có tần số 1,2,8,2,1; mẫu B là 4,2,2,2,4. Cả hai có 14 quan sát, trung bình 30. Độ lệch chuẩn A khoảng 9,26; B khoảng 16,04.</desc><rect width="680" height="410" rx="10" fill="white"/><g font-family="sans-serif" fill="#25445a"><text x="20" y="29" font-size="21" font-weight="bold">Cùng trung bình, khác độ phân tán</text><text x="20" y="54" font-size="15">Mỗi cột biểu diễn số quan sát trong một nhóm.</text><g stroke="#d5e1e8" fill="none"><path d="M74 288H595"/><path d="M74 240H595"/><path d="M74 192H595"/><path d="M74 144H595"/><path d="M74 96H595"/></g><path d="M74 82V288H607" fill="none" stroke="#607989" stroke-width="1.6"/><g font-size="15"><text x="64" y="293" text-anchor="end">0</text><text x="64" y="245" text-anchor="end">2</text><text x="64" y="197" text-anchor="end">4</text><text x="64" y="149" text-anchor="end">6</text><text x="64" y="101" text-anchor="end">8</text><text x="76" y="77">Tần số</text><text x="132" y="310" text-anchor="middle">10</text><text x="234" y="310" text-anchor="middle">20</text><text x="336" y="310" text-anchor="middle">30</text><text x="438" y="310" text-anchor="middle">40</text><text x="540" y="310" text-anchor="middle">50</text><text x="595" y="330" text-anchor="end">Giá trị đại diện</text></g><path d="M336 78V288" stroke="#607989" stroke-dasharray="5 4"/><text x="345" y="86" font-size="14">Trung bình 30</text><rect x="101" y="264" width="29" height="24" fill="#176b9b"/><text x="115.5" y="259" font-size="14" text-anchor="middle">1</text><rect x="203" y="240" width="29" height="48" fill="#176b9b"/><text x="217.5" y="235" font-size="14" text-anchor="middle">2</text><rect x="305" y="96" width="29" height="192" fill="#176b9b"/><text x="319.5" y="91" font-size="14" text-anchor="middle">8</text><rect x="407" y="240" width="29" height="48" fill="#176b9b"/><text x="421.5" y="235" font-size="14" text-anchor="middle">2</text><rect x="509" y="264" width="29" height="24" fill="#176b9b"/><text x="523.5" y="259" font-size="14" text-anchor="middle">1</text><rect x="134" y="192" width="29" height="96" fill="#b96137"/><text x="148.5" y="187" font-size="14" text-anchor="middle">4</text><rect x="236" y="240" width="29" height="48" fill="#b96137"/><text x="250.5" y="235" font-size="14" text-anchor="middle">2</text><rect x="338" y="240" width="29" height="48" fill="#b96137"/><text x="352.5" y="235" font-size="14" text-anchor="middle">2</text><rect x="440" y="240" width="29" height="48" fill="#b96137"/><text x="454.5" y="235" font-size="14" text-anchor="middle">2</text><rect x="542" y="192" width="29" height="96" fill="#b96137"/><text x="556.5" y="187" font-size="14" text-anchor="middle">4</text><rect x="26" y="347" width="16" height="16" fill="#176b9b"/><text x="50" y="360" font-size="16">A: s ≈ 9,26</text><rect x="234" y="347" width="16" height="16" fill="#b96137"/><text x="258" y="360" font-size="16">B: s ≈ 16,04</text><text x="20" y="391" font-size="14">B có nhiều quan sát ở xa trung bình hơn A, dù cùng số trung bình.</text></g></svg>