<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img" aria-labelledby="t d"><title id="t">Hai cách đo độ trải rộng của mẫu ghép nhóm</title><desc id="d">Cùng bảng có các nhóm từ 10 tới 30 và tần số 6,14,12,8. Khoảng biến thiên 20, khoảng tứ phân vị khoảng 7,74 từ 16,43 tới 24,17. Các đầu mút nhóm không phải giá trị quan sát thực tế.</desc><rect width="680" height="270" rx="10" fill="white"/><g font-family="sans-serif" fill="#23445d"><text x="20" y="28" font-size="20" font-weight="bold">Toàn miền và phần giữa</text><text x="20" y="53" font-size="15">Cùng mẫu ghép nhóm: [10;15), [15;20), [20;25), [25;30)</text><path d="M90 95H570" stroke="#667e90" stroke-width="6"/><g stroke="#667e90" stroke-width="2"><path d="M90 88v14"/><path d="M210 88v14"/><path d="M330 88v14"/><path d="M450 88v14"/><path d="M570 88v14"/></g><g font-size="15"><text x="90" y="122" text-anchor="middle">10</text><text x="210" y="122" text-anchor="middle">15</text><text x="330" y="122" text-anchor="middle">20</text><text x="450" y="122" text-anchor="middle">25</text><text x="570" y="122" text-anchor="middle">30</text><text x="330" y="81" text-anchor="middle">R = 30 − 10 = 20</text></g><path d="M90 176H570" stroke="#d2dfe5" stroke-width="6"/><path d="M244.28571428571425 176H430" stroke="#21806b" stroke-width="9"/><g stroke="#21806b" stroke-width="2"><path d="M244.28571428571425 168v16 M430 168v16"/></g><g font-size="16" fill="#21806b"><text x="244.28571428571425" y="203" text-anchor="middle">16,43</text><text x="430" y="203" text-anchor="middle">24,17</text><text x="337.1428571428571" y="159" text-anchor="middle" font-weight="bold">ΔQ ≈ 7,74</text></g><text x="20" y="241" font-size="14">R dùng cận nhóm; ΔQ dùng hai tứ phân vị nội suy.</text><text x="20" y="259" font-size="14">Các giá trị quan sát thật không được khôi phục từ hình.</text></g></svg>