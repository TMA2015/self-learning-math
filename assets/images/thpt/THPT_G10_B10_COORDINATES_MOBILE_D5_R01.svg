<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560" role="img" aria-labelledby="t d"><title id="t">Tọa độ vectơ AB trên điện thoại</title><desc id="d">Gốc O ở (200;320). A(-2;1) nằm tại (112;276), B(3;4) tại (332;144); cùng một tỉ lệ 44 pixel mỗi đơn vị theo cả Ox, Oy. Vectơ AB có hiệu hoành độ 5 và hiệu tung độ 3, độ dài căn 34.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2060a5"/></marker><marker id="ax" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#475569"/></marker></defs><rect width="420" height="560" rx="15" fill="#f8fafc"/><text x="18" y="34" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#15243d">Tọa độ vectơ = độ dời</text><path d="M18 320H396M200 365V59" stroke="#536174" stroke-width="2" marker-end="url(#ax)" fill="none"/><g font-family="Arial,sans-serif" font-size="17" fill="#263445"><text x="398" y="318">x</text><text x="205" y="58">y</text><text x="205" y="340">O</text></g><path d="M112 276H332V144" stroke="#148477" stroke-width="3" fill="none" stroke-dasharray="8 6"/><path d="M112 276L332 144" stroke="#2060a5" stroke-width="5" marker-end="url(#arr)"/><circle cx="112" cy="276" r="6" fill="#af2454"/><circle cx="332" cy="144" r="6" fill="#af2454"/><g font-family="Arial,sans-serif" font-size="19" fill="#253449"><text x="22" y="270">A(−2;1)</text><text x="290" y="126">B(3;4)</text><text x="167" y="298" fill="#147b69">Δx = 5</text><text x="339" y="225" fill="#147b69">Δy = 3</text><text x="22" y="418" font-size="23" font-weight="bold">AB = B − A = (5;3)</text><text x="22" y="455" font-size="20">|AB| = √(5² + 3²) = √34</text><text x="22" y="490" font-size="20">Đổi chiều: BA = (−5;−3)</text><text x="22" y="527" font-size="17">Trục Ox/ Oy: cùng tỉ lệ 44 px/đv</text></g></svg>