<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" role="img" aria-labelledby="t d"><title id="t">Khoảng cách là độ dài đường vuông góc</title><desc id="d">M=(1;2;3), H=(5/9;20/9;23/9) trên P:2x-y+2z-4=0. M-H=(2/9)(2;-1;2), MH=2/3. T nằm trên P, MT dài hơn MH.</desc><rect width="680" height="380" rx="10" fill="white"/><g font-family="sans-serif" fill="#25445a"><text x="20" y="30" font-size="20" font-weight="bold">Hình chiếu vuông góc cho khoảng cách ngắn nhất</text><polygon points="326.05,273.11 334.55,385.31 193.95,210.89 185.45,98.69" fill="#deedf2" stroke="#7299ad" stroke-width="2"/><path d="M301.11 208.00L264.25 298.10" stroke="#8595a0" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M260.00 242.00L264.25 298.10" stroke="#7299ad" stroke-width="2" fill="none"/><path d="M260.00 242.00L301.11 208.00" stroke="#b25c32" stroke-width="4" fill="none"/><circle cx="260" cy="242" r="4" fill="#25445a"/><circle cx="301.1111111111111" cy="207.99999999999997" r="4" fill="#b25c32"/><circle cx="264.25" cy="298.1" r="4" fill="#25445a"/><g font-size="16"><text x="243" y="262">H</text><text x="310.1111111111111" y="198.99999999999997" fill="#b25c32">M</text><text x="274.25" y="310.1">T</text><text x="112" y="290">(P)</text><text x="420" y="95" font-weight="bold">MH ⟂ (P)</text><text x="420" y="124">H thuộc (P)</text><text x="420" y="171">MT² = MH² + HT²</text><text x="420" y="200">MH ≤ MT</text><text x="420" y="248" fill="#b25c32" font-weight="bold">d(M,(P)) = MH = 2/3</text></g><text x="20" y="357" font-size="15">Đo theo pháp tuyến, không mặc định đo theo phương thẳng đứng Oz.</text></g></svg>