<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title desc"><title id="title">Biến cố hợp giao và phần bù theo biểu đồ Venn</title><desc id="desc">Hai vòng A và B với xác suất chỉ A bằng 0,3, giao bằng 0,2, chỉ B bằng 0,2 và ngoài cả hai bằng 0,3. Từ đó A bằng 0,5, B bằng 0,4, A hợp B bằng 0,7.</desc><rect width="720" height="450" fill="#fff"/><text x="43" y="42" font-size="23" font-family="sans-serif">Hợp, giao và phần bù — không cộng trùng vùng giao</text><rect x="75" y="70" width="566" height="302" rx="14" fill="#edf2f4" stroke="#617587" stroke-width="3"/><circle cx="287" cy="223" r="119" fill="#72bdca" fill-opacity=".62" stroke="#2a829a" stroke-width="4"/><circle cx="430" cy="223" r="119" fill="#ecb578" fill-opacity=".62" stroke="#b67840" stroke-width="4"/><g font-family="sans-serif" font-size="22" fill="#263a50"><text x="219" y="137">A</text><text x="495" y="137">B</text><text x="231" y="226">0,3</text><text x="347" y="225">0,2</text><text x="483" y="225">0,2</text><text x="105" y="331">Ngoài A∪B: 0,3</text><text x="602" y="102">Ω</text></g><text x="70" y="414" font-family="sans-serif" font-size="19">P(A)=0,5; P(B)=0,4; P(A∩B)=0,2; P(A∪B)=0,7.</text></svg>