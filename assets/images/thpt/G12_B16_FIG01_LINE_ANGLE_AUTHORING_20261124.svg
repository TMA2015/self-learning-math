<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-labelledby="t d"><title id="t">Góc giữa hai đường không đổi khi đảo vectơ</title><desc id="d">Hai đường qua O, đường ngang và đường nghiêng 60 độ. Vectơ u hướng sang phải, v hướng chếch lên phải, vectơ đối của v hướng xuống trái. Góc u,v là 60 độ, góc u,-v là 120 độ, góc hai đường là 60 độ.</desc><rect width="680" height="260" rx="10" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176b9b"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b25c32"/></marker></defs><g font-family="sans-serif" fill="#23445d"><text x="20" y="29" font-size="20" font-weight="bold">Đổi chiều mũi tên, không đổi đường thẳng</text><path d="M45 135H345 M135 230L245 39" stroke="#a3b7c5" stroke-width="2"/><path d="M190 135H325" stroke="#176b9b" stroke-width="3" marker-end="url(#a)"/><path d="M190 135L240 48.397 M190 135L140 221.603" stroke="#b25c32" stroke-width="3" marker-end="url(#b)"/><path d="M230 135 A40 40 0 0 0 210 100.359" fill="none" stroke="#21836c" stroke-width="2.5"/><path d="M250 135 A60 60 0 0 1 160 186.962" stroke="#b25c32" stroke-width="2" fill="none" stroke-dasharray="4 3"/><circle cx="190" cy="135" r="3.5"/><g font-size="16"><text x="174" y="128">O</text><text x="305" y="123" fill="#176b9b">u</text><text x="251" y="53" fill="#b25c32">v</text><text x="110" y="228" fill="#b25c32">−v</text><text x="231" y="110" fill="#21836c">60°</text><text x="214" y="196" fill="#b25c32">120°</text><text x="370" y="85">cos 60° = 1/2</text><text x="370" y="118">cos 120° = −1/2</text><text x="370" y="164" font-weight="bold">Góc hai đường: 60°</text><text x="370" y="195">|cos 120°| = cos 60°</text></g><text x="20" y="248" font-size="14">Dời hai phương về cùng một gốc trước khi xét góc, kể cả khi hai đường chéo nhau.</text></g></svg>