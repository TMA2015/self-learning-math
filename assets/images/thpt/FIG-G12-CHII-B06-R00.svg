<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="ttl ds"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17324d"/></marker></defs><title id="ttl">Quy tắc đường đi trong hình hộp</title><desc id="ds">Vectơ AB đỏ, AD xanh dương, AA phẩy xanh lá, và AC phẩy tím. Mũi tên từ A tới C phẩy là tổng ba vectơ cạnh; chiều và điểm đầu-cuối quan trọng hơn độ dài hình chiếu.</desc><rect width="840" height="520" rx="26" fill="#f6fafb"/><text x="35" y="47" font-family="Arial" font-size="29" font-weight="700" fill="#17324d">Bài 6 · Ghép vectơ trong không gian</text><g transform="translate(0 55)"><g fill="none" stroke="#60758a" stroke-width="3" stroke-linejoin="round"><path d="M130 370 L370 370 L470 280 L230 280 Z M130 145 L370 145 L470 55 L230 55 Z M130 370 L130 145 M370 370 L370 145 M470 280 L470 55 M230 280 L230 55"/></g><path d="M130 370L370 370" stroke="#d64949" stroke-width="6" marker-end="url(#arr)"/><path d="M130 370L230 280" stroke="#1877b8" stroke-width="6" marker-end="url(#arr)"/><path d="M130 370L130 145" stroke="#15926f" stroke-width="6" marker-end="url(#arr)"/><path d="M130 370L470 55" stroke="#7c48a5" stroke-width="5" marker-end="url(#arr)"/><g font-family="Arial" font-size="22" fill="#182f45"><text x="103" y="402">A</text><text x="365" y="402">B</text><text x="477" y="299">C</text><text x="208" y="273">D</text><text x="90" y="136">A′</text><text x="374" y="143">B′</text><text x="481" y="50">C′</text><text x="202" y="48">D′</text></g></g><g font-family="Arial" font-size="24"><text x="525" y="145" fill="#d64949">AB</text><text x="525" y="184" fill="#1877b8">AD</text><text x="525" y="223" fill="#15926f">AA′</text><text x="525" y="262" fill="#7c48a5">AC′</text><text x="520" y="343" fill="#17324d">AB + AD + AA′</text><text x="585" y="377" fill="#17324d">= AC′</text></g><text x="35" y="490" font-family="Arial" font-size="19" fill="#425e70">Chú ý: không đo độ dài thật từ nét xiên phối cảnh.</text></svg>