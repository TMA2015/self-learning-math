<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="ttl ds"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#17324d"/></marker></defs><title id="ttl">Hệ trục Oxyz và tọa độ điểm M</title><desc id="ds">Ba trục x, y, z vuông góc trong không gian được vẽ dưới dạng phối cảnh xiên. Điểm M có tọa độ (2;1;3), nét đứt là đường dẫn từ M xuống một điểm trên mặt phẳng Oxy.</desc><rect width="840" height="520" rx="26" fill="#f6fafb"/><text x="35" y="49" font-family="Arial" font-size="29" font-weight="700" fill="#17324d">Bài 7 · Đọc ba tọa độ</text><g stroke-width="5" fill="none"><path d="M260 355L600 460" stroke="#bd5449" marker-end="url(#arr)"/><path d="M260 355L65 435" stroke="#2d789d" marker-end="url(#arr)"/><path d="M260 355L260 75" stroke="#228d68" marker-end="url(#arr)"/></g><g font-family="Arial" font-size="24" fill="#17324d"><text x="236" y="382">O</text><text x="606" y="465">x</text><text x="39" y="450">y</text><text x="269" y="76">z</text></g><path d="M260 355L360 235" fill="none" stroke="#a5b5c1" stroke-width="3" stroke-dasharray="8 9"/><path d="M360 235L360 398L260 355" fill="none" stroke="#6d8293" stroke-width="3" stroke-dasharray="8 8"/><circle cx="360" cy="235" r="9" fill="#8a4aa2"/><text x="378" y="224" font-family="Arial" font-size="24" font-weight="700" fill="#6f3f8b">M(2;1;3)</text><text x="487" y="305" font-family="Arial" font-size="21" fill="#17324d">x: dọc Ox</text><text x="487" y="339" font-family="Arial" font-size="21" fill="#17324d">y: dọc Oy</text><text x="487" y="373" font-family="Arial" font-size="21" fill="#17324d">z: độ cao</text><text x="35" y="492" font-family="Arial" font-size="19" fill="#425e70">Góc vẽ trên màn hình không dùng để đo góc vuông thật.</text></svg>