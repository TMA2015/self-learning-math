<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc"><title id="title">Góc giữa tia sáng và mặt đất bằng góc với hình chiếu bóng</title><desc id="desc">Một cọc thẳng đứng từ A đến B có độ cao h, bóng từ A đến H có độ dài l, tia sáng từ B đến H. Tam giác ABH vuông tại A. Góc BHA với mặt đất có tan bằng h chia l.</desc><rect width="720" height="410" fill="#fff"/><polygon points="80,328 640,328 682,376 123,376" fill="#e6ebe1" stroke="#7f957e"/><line x1="190" y1="328" x2="190" y2="113" stroke="#334953" stroke-width="10"/><line x1="190" y1="328" x2="580" y2="328" stroke="#d69b47" stroke-width="6"/><line x1="190" y1="113" x2="580" y2="328" stroke="#1a8caa" stroke-width="5"/><path d="M190 300 H218 V328" stroke="#334953" stroke-width="2" fill="none"/><path d="M530 328 A50 50 0 0 1 536 303" stroke="#a66023" stroke-width="3" fill="none"/><g font-family="sans-serif" font-size="20" fill="#173f51"><text x="170" y="100">B</text><text x="162" y="354">A</text><text x="583" y="350">H</text><text x="152" y="228">h</text><text x="375" y="351">l (bóng)</text><text x="535" y="293">θ</text></g><text x="110" y="55" font-family="sans-serif" font-size="22" fill="#153f51">Tia BH, hình chiếu AH, cọc AB ⟂ mặt đất</text><text x="110" y="389" font-family="sans-serif" font-size="18">tan θ = AB / AH = h / l; cần mặt đất phẳng và cọc thẳng.</text></svg>