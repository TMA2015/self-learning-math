<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-labelledby="title desc"><title id="title">Ba thang lôgarit là ba mô hình đo khác nhau</title><desc id="desc">pH giảm một đơn vị khi nồng độ ion H cộng tăng 10 lần; thang Richter tăng một đơn vị khi biên độ tăng 10 lần; mức decibel tăng 10 khi cường độ tăng 10 lần. Không so trực tiếp các mức.</desc><rect width="820" height="370" fill="#fff"/><text x="35" y="39" font-size="22" font-family="sans-serif" fill="#153d49">Đọc thang log: xác định đúng tỉ số và hệ số</text><g font-family="sans-serif" font-size="17"><rect x="35" y="75" width="245" height="230" rx="14" fill="#e8f6f8" stroke="#6aabb8"/><rect x="291" y="75" width="245" height="230" rx="14" fill="#eef0fc" stroke="#98a6d8"/><rect x="547" y="75" width="245" height="230" rx="14" fill="#fff1e6" stroke="#dfaa76"/><text x="60" y="117" font-size="24" fill="#126173">pH</text><text x="306" y="117" font-size="24" fill="#344d9e">Richter (M)</text><text x="562" y="117" font-size="24" fill="#a15a19">Decibel (L)</text><text x="55" y="160">pH = −log₁₀[H⁺]</text><text x="306" y="160">M = log₁₀(I/S)</text><text x="563" y="160">L = 10log₁₀(I/I₀)</text><text x="55" y="209">[H⁺] × 10</text><text x="306" y="209">I/S × 10</text><text x="563" y="209">I/I₀ × 10</text><text x="55" y="250" font-weight="bold">pH giảm 1</text><text x="306" y="250" font-weight="bold">M tăng 1</text><text x="563" y="250" font-weight="bold">L tăng 10 dB</text></g><text x="35" y="344" font-size="16" font-family="sans-serif" fill="#445361">Từng mô hình có đại lượng và giả định riêng; mọi đối số log phải dương.</text></svg>