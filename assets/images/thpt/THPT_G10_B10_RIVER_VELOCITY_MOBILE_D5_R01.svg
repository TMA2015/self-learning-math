<svg xmlns="http://www.w3.org/2000/svg" width="420" height="970" viewBox="0 0 420 970" role="img" aria-labelledby="t d"><title id="t">Ca nô qua sông rộng 96 m: hai phương án lái trên màn hình nhỏ</title><desc id="d">Hình A thuyền lái thẳng Bắc, vận tốc riêng (0;5), dòng về Đông (3;0), theo bờ (3;5), t bằng 19,2 giây, trôi 57,6 mét. Hình B lái chếch Tây Bắc, vận tốc riêng (-3;4), dòng Đông (3;0), theo bờ (0;4), t bằng 24 giây, không trôi. Mỗi m/s biểu diễn 29 pixel trong cả hai hình.</desc><defs><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#1d629c"/></marker><marker id="o" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b65a23"/></marker><marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#11806d"/></marker></defs><rect width="420" height="970" rx="12" fill="#fff"/><g font-family="Arial,sans-serif" fill="#263443"><text x="18" y="36" font-size="22" font-weight="bold">A. Mũi thuyền hướng Bắc</text></g><rect x="18" y="74" width="384" height="277" rx="6" fill="#eaf5fa"/><path d="M18 74H402M18 351H402" stroke="#8b9da9" stroke-width="3"/><path d="M150 330L150 185" stroke="#1d629c" stroke-width="5" marker-end="url(#b)"/><path d="M150 330L237 330" stroke="#b65a23" stroke-width="5" marker-end="url(#o)"/><path d="M150 330L237 185" stroke="#11806d" stroke-width="5" marker-end="url(#g)"/><path d="M150 185H237V330" fill="none" stroke="#99a7b5" stroke-width="2" stroke-dasharray="7 6"/><circle cx="150" cy="330" r="5" fill="#263443"/><g font-family="Arial,sans-serif" font-size="17"><text x="20" y="100" fill="#344456">Bờ Bắc</text><text x="20" y="370" fill="#344456">Bờ Nam</text><text x="260" y="208" fill="#11806d">Về Đông Bắc</text><text x="18" y="401" fill="#1d629c">■ Riêng = (0;5) m/s</text><text x="18" y="425" fill="#b65a23">■ Dòng = (3;0) m/s</text><text x="18" y="449" fill="#11806d">■ Theo bờ = (3;5) m/s</text><text x="18" y="480" font-size="19" font-weight="bold" fill="#263443">t = 96/5 = 19,2 s · Trôi 57,6 m</text><text x="18" y="529" font-size="22" font-weight="bold" fill="#263443">B. Lái ngược dòng, không trôi</text></g><rect x="18" y="553" width="384" height="260" rx="6" fill="#eaf5fa"/><path d="M18 553H402M18 813H402" stroke="#8b9da9" stroke-width="3"/><path d="M205 790L118 674" stroke="#1d629c" stroke-width="5" marker-end="url(#b)"/><path d="M205 790L292 790" stroke="#b65a23" stroke-width="5" marker-end="url(#o)"/><path d="M205 790L205 674" stroke="#11806d" stroke-width="5" marker-end="url(#g)"/><path d="M118 674H205" fill="none" stroke="#99a7b5" stroke-width="2" stroke-dasharray="7 6"/><circle cx="205" cy="790" r="5" fill="#263443"/><g font-family="Arial,sans-serif" font-size="17"><text x="20" y="579" fill="#344456">Bờ Bắc</text><text x="20" y="830" fill="#344456">Bờ Nam</text><text x="220" y="696" fill="#11806d">Chỉ hướng Bắc</text><text x="18" y="856" fill="#1d629c">■ Riêng = (−3;4) m/s</text><text x="18" y="882" fill="#b65a23">■ Dòng = (3;0) m/s</text><text x="18" y="908" fill="#11806d">■ Theo bờ = (0;4) m/s</text><text x="18" y="938" font-size="19" font-weight="bold" fill="#263443">t = 96/4 = 24 s · Không trôi</text></g></svg>