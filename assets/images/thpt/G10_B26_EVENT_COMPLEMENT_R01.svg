<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
<title id="title">Biến cố và biến cố đối trong cùng không gian mẫu</title>
<desc id="desc">Hai sơ đồ Ven đặt cạnh nhau. Hình trái: A là phần elip nằm trong Ω. Hình phải: vùng Ω ở ngoài elip A được tô màu và mang nhãn biến cố đối A, còn elip A để trắng. Hai phần không trùng nhau và hợp lại đủ Ω.</desc>
<rect x="0" y="0" width="1000" height="420" rx="18" fill="#f8fafc"/>
<text x="28" y="42" fill="#16324f" font-family="Arial,sans-serif" font-size="26" font-weight="700">A là tập con của Ω</text>
<rect x="30" y="75" width="435" height="280" rx="17" fill="#eef5ff" stroke="#265e9c" stroke-width="4"/>
<text x="48" y="113" fill="#16324f" font-family="Arial,sans-serif" font-size="25" font-weight="700">Ω</text>
<ellipse cx="247" cy="221" rx="127" ry="82" fill="#b8e5d7" stroke="#087d69" stroke-width="4"/>
<text x="244" y="229" text-anchor="middle" fill="#174137" font-family="Arial,sans-serif" font-size="34" font-weight="700">A</text>
<text x="510" y="42" fill="#16324f" font-family="Arial,sans-serif" font-size="26" font-weight="700">Biến cố đối của A</text>
<rect x="510" y="75" width="455" height="280" rx="17" fill="#fff0cc" stroke="#a35d10" stroke-width="4"/>
<text x="528" y="113" fill="#53320b" font-family="Arial,sans-serif" font-size="25" font-weight="700">Ω</text>
<ellipse cx="740" cy="221" rx="124" ry="82" fill="#ffffff" stroke="#087d69" stroke-width="4"/>
<text x="740" y="229" text-anchor="middle" fill="#174137" font-family="Arial,sans-serif" font-size="34" font-weight="700">A</text>
<text x="887" y="286" text-anchor="middle" fill="#7c4012" font-family="Arial,sans-serif" font-size="28" font-weight="700">Ā</text>
<text x="500" y="393" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#334155">A và Ā không giao nhau; ghép lại được toàn bộ Ω.</text>
</svg>
