<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="title desc"><title id="title">Đo góc phẳng của góc nhị diện</title><desc id="desc">Hai mặt P và Q có giao tuyến d qua H. Mỗi tia HP và HQ nằm trong mặt tương ứng và vuông góc d tại H. Góc PHQ đo góc nhị diện, không phải góc bất kì trên hình phối cảnh.</desc><rect width="760" height="420" fill="#fff"/><polygon points="120,130 560,130 675,220 235,220" fill="#cce9f2" fill-opacity=".8" stroke="#4288a0" stroke-width="2"/><polygon points="235,220 675,220 545,355 105,355" fill="#f7dec1" fill-opacity=".7" stroke="#d49c64" stroke-width="2"/><line x1="235" y1="220" x2="675" y2="220" stroke="#1c3d58" stroke-width="5"/><circle cx="360" cy="220" r="6" fill="#1c3d58"/><line x1="360" y1="220" x2="286" y2="142" stroke="#0b8eac" stroke-width="5"/><line x1="360" y1="220" x2="286" y2="319" stroke="#a86b24" stroke-width="5"/><path d="M319 174 Q287 224 323 269" stroke="#b64a4a" stroke-width="3" fill="none"/><g font-family="sans-serif" font-size="19" fill="#23394b"><text x="683" y="226">d</text><text x="366" y="216">H</text><text x="274" y="132">u</text><text x="268" y="337">v</text><text x="480" y="165">(P)</text><text x="510" y="312">(Q)</text><text x="275" y="232">θ</text></g><text x="65" y="52" font-family="sans-serif" font-size="22">Hai tia tại H cùng vuông góc d</text><text x="76" y="397" font-family="sans-serif" font-size="17">θ là góc phẳng nhị diện; hình chỉ minh họa hướng, không dùng để đo trực tiếp.</text></svg>