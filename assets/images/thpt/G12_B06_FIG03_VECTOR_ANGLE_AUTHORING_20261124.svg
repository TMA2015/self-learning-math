<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="t d"><title id="t">Tìm góc khi đưa hai vectơ về chung gốc</title><desc id="d">Hai vectơ ban đầu đặt ở hai nơi. Sau tịnh tiến, OA hướng sang phải, OB tạo góc tù 120 độ với OA.</desc><defs><marker id="blue" markerWidth="6" markerHeight="6" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#176d9e"/></marker><marker id="red" markerWidth="6" markerHeight="6" refX="9" refY="5" viewBox="0 0 10 10" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ad492c"/></marker></defs><rect width="640" height="340" rx="10" fill="#fff"/><g font-family="sans-serif" font-size="17" fill="#25475d"><text x="20" y="29" font-size="20" font-weight="bold">Tìm góc khi đưa hai vectơ về chung gốc</text><g stroke-width="3" fill="none"><path d="M60 125H205" stroke="#176d9e" marker-end="url(#blue)"/><path d="M120 270L65 174.737" stroke="#ad492c" marker-end="url(#red)"/><path d="M245 186h64l-9 -5m9 5l-9 5" stroke="#8799a7"/><path d="M437 260H582" stroke="#176d9e" marker-end="url(#blue)"/><path d="M437 260L382 164.737" stroke="#ad492c" marker-end="url(#red)"/><path d="M478 260A41 41 0 0 0 416.5 224.493" stroke="#60798a" stroke-width="2"/></g><text x="120" y="114" fill="#176d9e">a</text><text x="78" y="228" fill="#ad492c">b</text><text x="245" y="167" font-size="14">Tịnh tiến</text><text x="425" y="281">O</text><text x="586" y="268">A</text><text x="366" y="158">B</text><text x="448" y="215">120°</text><text x="20" y="321">Giữ nguyên phương, hướng và độ dài; đo góc AOB từ 0° đến 180°.</text></g></svg>