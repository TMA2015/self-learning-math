<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" aria-labelledby="chviB18Title chviB18Desc">
<title id="chviB18Title">Bài 18: Kiểm điều kiện, bình phương rồi thử nghiệm gốc</title>
<desc id="chviB18Desc">Hai loại phương trình: căn A bằng căn B cần A và B không âm rồi giải A bằng B; căn A bằng biểu thức B cần A không âm và B không âm rồi giải A bằng B bình phương. Hai nhánh đều chỉ tạo nghiệm ứng viên và phải kiểm trực tiếp phương trình gốc.</desc>
<rect width="960" height="380" rx="16" fill="#f6f9fc"/>
<g font-family="Arial, sans-serif" fill="#1b334d">
<rect x="260" y="18" width="440" height="54" rx="10" fill="#dcebf7" stroke="#3a658d" stroke-width="2"/>
<text x="480" y="52" font-size="22" font-weight="bold" text-anchor="middle">Phương trình có căn thực</text>
<rect x="35" y="120" width="422" height="118" rx="10" fill="#ecf7f4" stroke="#257b6b" stroke-width="2"/>
<text x="246" y="151" font-size="22" font-weight="bold" text-anchor="middle">√A(x) = √B(x)</text>
<text x="246" y="184" font-size="18" text-anchor="middle">A(x) ≥ 0 và B(x) ≥ 0</text>
<text x="246" y="214" font-size="18" text-anchor="middle">Giải A(x) = B(x)</text>
<rect x="503" y="120" width="422" height="118" rx="10" fill="#fff3e7" stroke="#aa7336" stroke-width="2"/>
<text x="714" y="151" font-size="22" font-weight="bold" text-anchor="middle">√A(x) = B(x)</text>
<text x="714" y="184" font-size="18" text-anchor="middle">A(x) ≥ 0 và B(x) ≥ 0</text>
<text x="714" y="214" font-size="18" text-anchor="middle">Giải A(x) = [B(x)]²</text>
<rect x="165" y="293" width="630" height="65" rx="10" fill="#e9edf8" stroke="#425c99" stroke-width="2"/>
<text x="480" y="320" font-size="20" font-weight="bold" text-anchor="middle">Nghiệm ứng viên → lọc điều kiện</text>
<text x="480" y="345" font-size="18" text-anchor="middle">Thử lại vào phương trình gốc rồi mới kết luận</text>
</g>
<g fill="none" stroke="#385c7e" stroke-width="3"><path d="M480 72 V95 H246 V120 M480 95 H714 V120 M246 238 V267 H480 V293 M714 238 V267 H480"/></g>
</svg>
