<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 470" role="img" aria-labelledby="title desc"><title id="title">Lăng trụ tam giác ABC A phẩy B phẩy C phẩy</title><desc id="desc">Hai tam giác ABC và A phẩy B phẩy C phẩy là các mặt đáy song song bằng nhau. Các cạnh bên AA phẩy, BB phẩy, CC phẩy song song. Cạnh bị che khuất thể hiện bằng nét đứt.</desc><rect width="740" height="470" fill="#fff"/><text x="36" y="43" font-size="23" font-family="sans-serif">Hai đáy tương ứng — ba cạnh bên song song</text><polygon points="150,130 280,185 120,258" fill="#d8f1f7" fill-opacity=".65" stroke="#258fa9" stroke-width="3"/><polygon points="390,170 520,225 360,298" fill="#fcead8" fill-opacity=".65" stroke="#ca7d36" stroke-width="3"/><line x1="150" y1="130" x2="390" y2="170" stroke="#32608d" stroke-width="4"/><line x1="280" y1="185" x2="520" y2="225" stroke="#32608d" stroke-width="4"/><line x1="120" y1="258" x2="360" y2="298" stroke="#32608d" stroke-width="4" stroke-dasharray="11 7"/><g font-size="23" font-family="sans-serif" fill="#203c51"><text x="133" y="117">A</text><text x="287" y="183">B</text><text x="96" y="275">C</text><text x="386" y="157">A′</text><text x="527" y="228">B′</text><text x="337" y="316">C′</text></g><text x="55" y="387" font-family="sans-serif" font-size="18">Đáy 1: ABC     •     Đáy 2: A′B′C′     •     Cạnh khuất: nét đứt</text><text x="55" y="427" font-family="sans-serif" font-size="16">Không suy lăng trụ đứng nếu chưa chứng minh cạnh bên ⟂ đáy.</text></svg>